<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype de combat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --table:#e7e0d0; --table-2:#d9cfb9; --zone:#efe9dc;
  --ink:#2b2416; --ink-2:#615741; --line:#c3b69a; --bronze:#8a5a1f;
  --parchemin:#fbf7ec; --encre-carte:#2b2416; --bord-carte:#b9a982;
  --cible:#1f8a5b; --encre-c:#6a4fb3; --choix:#8a5a1f; --danger:#b3261e;
  --egy:#d4a017; --egy-ink:#2b2416;
  --hin:#c8402a; --hin-ink:#ffffff;
  --nor:#6e7b88; --nor-ink:#ffffff;
  --gre:#2d5fbf; --gre-ink:#ffffff;
  --neutre:#9a8b6c; --neutre-ink:#ffffff;
  --voile:rgba(43,36,22,.55);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --table:#1c2030; --table-2:#262b3f; --zone:#232838;
    --ink:#ede6d4; --ink-2:#b5ad99; --line:#3a4058; --bronze:#d9a35a;
    --parchemin:#f3ead5; --encre-carte:#2b2416; --bord-carte:#8f7f5c;
    --cible:#4cc38a; --encre-c:#b9a2f0; --choix:#e0b061; --danger:#ff7a6e;
    --voile:rgba(8,10,18,.72);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --table:#1c2030; --table-2:#262b3f; --zone:#232838;
  --ink:#ede6d4; --ink-2:#b5ad99; --line:#3a4058; --bronze:#d9a35a;
  --parchemin:#f3ead5; --encre-carte:#2b2416; --bord-carte:#8f7f5c;
  --cible:#4cc38a; --encre-c:#b9a2f0; --choix:#e0b061; --danger:#ff7a6e;
  --voile:rgba(8,10,18,.72);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--table);color:var(--ink);font-family:"Alegreya Sans","Gill Sans","Trebuchet MS",sans-serif;font-size:16px;line-height:1.35}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--choix);outline-offset:2px}
h1,h2{font-family:Cinzel,"Trajan Pro","Times New Roman",serif;font-weight:700;margin:0}

#app{max-width:1280px;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px}
.entete{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.entete h1{font-size:20px;letter-spacing:.02em}
.entete .mode,.entete .tour-info{color:var(--ink-2);font-size:15px}
.entete .tour-info{margin-left:auto}
.btn-discret{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn-discret:hover{border-color:var(--bronze)}

.camp{background:var(--zone);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px}
.bandeau{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.portrait{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:10px;align-items:baseline;background:var(--table-2);border:2px solid transparent;border-radius:12px;padding:8px 14px;text-align:left}
button.portrait{cursor:pointer}
.portrait .pnom{grid-column:1/3;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:15px}
.portrait .ppv{font-family:Cinzel,"Times New Roman",serif;font-size:32px;font-weight:700;line-height:1}
.portrait .plabel{color:var(--ink-2);font-size:14px}
.compteurs{display:flex;gap:14px;color:var(--ink-2);font-size:15px}
.ressources{display:flex;gap:10px}
.res{background:var(--table-2);border-radius:999px;padding:6px 14px;font-size:15px}
.res b{font-family:Cinzel,"Times New Roman",serif;font-size:22px;margin-right:4px}
.res.or b{color:var(--bronze)}
.fin{margin-left:auto;background:var(--bronze);color:var(--parchemin);border:none;border-radius:10px;padding:12px 20px;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:16px;cursor:pointer}
.fin:disabled{opacity:.45;cursor:default}

.rangee{display:flex;gap:10px;min-height:166px;align-items:center;overflow-x:auto;padding:4px}
.vide{color:var(--ink-2);font-style:italic;padding:0 8px}

.centre{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}
.marche,.journal{background:var(--zone);border:1px solid var(--line);border-radius:14px;padding:12px}
.marche h2,.journal h2{font-size:16px;margin-bottom:10px;display:flex;align-items:baseline;gap:12px}
.reste{font-family:"Alegreya Sans",sans-serif;font-weight:400;color:var(--ink-2);font-size:14px}
.marche-cartes{display:flex;gap:10px;overflow-x:auto;padding:4px;align-items:flex-start}
.separateur{width:1px;align-self:stretch;background:var(--line);margin:0 4px;flex:none}
.journal ol{list-style:none;margin:0;padding:0;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.journal li:first-child{color:var(--ink)}

/* Cartes : format TCG 63 × 88 mm, illustration 7:9 en pleine largeur */
.carte,.crea{--fc:var(--neutre);--fci:var(--neutre-ink);--lis:rgba(0,0,0,.4);--gem:transparent;container-type:inline-size;flex:none;aspect-ratio:63/88;position:relative;padding:0;border:none;background:var(--fc);color:#fff;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.28);transition:transform .15s ease, box-shadow .15s ease}
.carte{--w:160px;width:var(--w);border-radius:8px;cursor:pointer}
.crea{width:112px;border-radius:6px;cursor:default}
.cadre{position:absolute;inset:0;padding:4.5cqw;display:flex;flex-direction:column;border-radius:inherit;box-shadow:inset 0 0 0 .7cqw rgba(255,255,255,.2)}
.art{position:relative;display:block;width:100%;aspect-ratio:7/9;border-radius:2.5cqw;overflow:hidden;background:#2a2418;box-shadow:0 0 0 .9cqw var(--lis)}
.art.sans-image::before{content:"";position:absolute;inset:0;background:var(--fc);opacity:.45}
.art.sans-image::after{content:attr(data-sym);position:absolute;inset:0;display:grid;place-items:center;font-size:42cqw;color:rgba(255,255,255,.2)}
.art .illu{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nom-bande{position:absolute;left:0;right:0;top:0;z-index:1;padding:2.6cqw 20cqw 8cqw 3.5cqw;text-align:left;background:linear-gradient(rgba(12,9,5,.9),rgba(12,9,5,.6) 55%,rgba(12,9,5,0));font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:7.4cqw;line-height:1.12;color:#fff;text-shadow:0 1px 2px #000;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.carte .texte{position:absolute;left:0;right:0;bottom:0;z-index:1;max-height:64%;overflow:hidden;padding:10cqw 4cqw 6cqw;font-size:6.5cqw;line-height:1.28;color:#fff;background:linear-gradient(to top,rgba(12,9,5,.94),rgba(12,9,5,.84) 70%,rgba(12,9,5,0));text-shadow:0 1px 2px #000}
.carte .texte .mots-cles{color:#f2d48a;font-weight:700}
.pied{flex:1;display:flex;align-items:center;justify-content:center;gap:2cqw;min-width:0;padding:0 15cqw;font-size:6.2cqw;letter-spacing:.03em;color:var(--fci);white-space:nowrap}
.pied .type{overflow:hidden;text-overflow:ellipsis}
.gemme{flex:none;width:3.6cqw;height:3.6cqw;transform:rotate(45deg);background:var(--gem);box-shadow:0 0 0 .5cqw rgba(0,0,0,.35)}
.prix{position:absolute;z-index:2;top:2.4cqw;right:2.4cqw;width:16cqw;height:16cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4c2,#f0c64e 45%,#a8750f);color:#3b2a06;border:.8cqw solid #7a520a;display:grid;place-items:center;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:8.5cqw;box-shadow:0 1px 3px rgba(0,0,0,.55)}
.atk,.pv,.dur{position:absolute;z-index:2;bottom:1.6cqw;width:15cqw;height:15cqw;display:grid;place-items:center;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:8cqw;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.atk{left:2cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb8a3,#d0503a 55%,#7a1d10);color:#fff;border:.7cqw solid #4f120a;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.pv,.dur{right:2cqw;padding-bottom:2cqw;clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}
.pv{background:linear-gradient(#e0705c,#a3291b);color:#fff}
.pv.blesse{background:linear-gradient(#8f1f14,#4e0d07)}
.dur{background:linear-gradient(#c5ced6,#6f7c88);color:#1d232a}
.crea .atk,.crea .pv{width:19cqw;height:19cqw;font-size:10cqw}
.crea .nom-bande{font-size:9cqw;padding-right:3.5cqw}
.crea .puces{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:9cqw 3cqw 9cqw;display:flex;flex-wrap:wrap;gap:1.5cqw;justify-content:center;background:linear-gradient(to top,rgba(12,9,5,.85),rgba(12,9,5,0))}
.puce{font-size:7.5cqw;line-height:1.2;background:rgba(12,9,5,.75);border:1px solid rgba(242,212,138,.55);color:#f2d48a;border-radius:99px;padding:.6cqw 2.6cqw}
.carte .illimite{position:absolute;z-index:2;left:4.5cqw;top:30%;background:var(--bronze);color:#fff;font-size:5.6cqw;padding:1cqw 3cqw;border-radius:0 2cqw 2cqw 0}
.r-commune{--gem:#ece6d6}
.r-rare{--lis:#d9dee4;--gem:#9fc3e6}
.r-epique{--lis:#b48ae6;--gem:#b48ae6}
.r-legendaire{--lis:#f2c14e;--gem:#f2c14e;box-shadow:0 0 0 1px #f2c14e,0 0 12px rgba(242,193,78,.55)}
.main{display:flex;gap:10px;overflow-x:auto;padding:12px 4px 4px;min-height:244px;align-items:flex-start}
.marche .carte{--w:146px}
.choix-cartes .carte{--w:130px}
.adm-apercu .carte{--w:220px}
.main .carte.jouable:hover,.main .carte.jouable:focus-visible{transform:translateY(-8px)}
.carte.achetable{box-shadow:0 0 0 3px var(--cible),0 2px 6px rgba(0,0,0,.28)}
.carte:not(.achetable):not(.jouable){cursor:default}
.marche .carte:not(.achetable){opacity:.82}

/* Créatures sur le plateau */
.crea.peut{box-shadow:0 0 0 3px var(--choix);cursor:pointer}
.crea.choisie{box-shadow:0 0 0 4px var(--choix);transform:translateY(-6px)}
.crea.cible,.portrait.cible{box-shadow:0 0 0 3px var(--cible);cursor:pointer}
.portrait.cible{border-color:var(--cible)}

.joues{display:flex;gap:8px;flex-wrap:wrap}
.joue{display:flex;align-items:center;gap:6px;background:var(--table-2);border-left:5px solid var(--fc,var(--neutre));border-radius:6px;padding:4px 8px;font-size:14px}
.btn-sac{background:none;border:1px solid var(--bronze);color:var(--ink);border-radius:5px;padding:2px 8px;font-size:13px;cursor:pointer}
.consigne{color:var(--ink-2);font-size:15px;min-height:22px;display:flex;align-items:center;gap:10px}
.consigne button{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:14px}


/* Administration */
.onglets{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.onglet{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:15px;color:var(--ink-2)}
.onglet[aria-selected="true"]{border-bottom-color:var(--bronze);color:var(--ink)}
.adm-cartes{display:grid;grid-template-columns:260px minmax(0,1fr) 240px;gap:16px;align-items:start}
.adm-liste,.adm-form,.adm-page{background:var(--zone);border:1px solid var(--line);border-radius:14px;padding:14px}
.adm-page{max-width:900px}
.adm-page h2,.adm-form h2,.adm-apercu h2{font-size:18px;margin:4px 0 12px}
.adm-page h2:not(:first-child){margin-top:24px}
.adm-outils{display:flex;flex-direction:column;gap:8px}
.adm-compte{color:var(--ink-2);font-size:14px;margin:10px 0 6px}
.adm-items{list-style:none;margin:0;padding:0;max-height:62vh;overflow:auto}
.adm-item{width:100%;display:flex;gap:8px;align-items:center;background:none;border:none;border-radius:6px;padding:7px 8px;cursor:pointer;text-align:left;font-size:15px}
.adm-item:hover{background:var(--table-2)}
.adm-item.actif{background:var(--table-2);font-weight:700}
.pastille{width:11px;height:11px;border-radius:50%;background:var(--fc);flex:none;display:inline-block}
.adm-item-info{margin-left:auto;color:var(--ink-2);font-size:14px}
.adm-groupe{display:flex;align-items:center;gap:8px;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:15px;padding:14px 8px 4px;border-bottom:1px solid var(--line)}
.adm-groupe:first-child{padding-top:4px}
.adm-sous{font-size:13px;color:var(--ink-2);padding:8px 8px 2px;font-weight:700;letter-spacing:.02em}
.champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px}
.champs.petits{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.champ{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2);min-width:0}
.champ input,.champ select{min-width:0}
.champ input,.champ select,.adm-outils input,.adm-outils select,.adm-page textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.champ input[type=color]{padding:2px;height:36px}
.adm-page textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.4}
.adm-form fieldset,.adm-page fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:14px 0 0}
.adm-form legend,.adm-page legend{font-family:Cinzel,"Times New Roman",serif;font-weight:700;padding:0 6px;color:var(--ink);display:flex;align-items:center;gap:8px}
.mots{display:flex;flex-wrap:wrap;gap:8px 18px}
.mots label{display:flex;gap:6px;align-items:center}
details.effet{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px}
details.effet summary{cursor:pointer;font-family:Cinzel,"Times New Roman",serif;font-weight:700}
details.effet summary span{font-family:"Alegreya Sans",sans-serif;font-weight:400;color:var(--ink-2);margin-left:8px}
details.effet .champs{margin-top:10px}
.aide{color:var(--ink-2);font-size:14px;margin:8px 0 0}
.adm-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn.danger{background:var(--danger);color:#fff}
.adm-apercu{position:sticky;top:12px}
.adm-apercu .carte{cursor:default}
fieldset.survol{border-color:var(--cible);border-style:dashed;border-width:2px}
.heros-admin{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.adm-illu{display:block;width:100%;max-width:220px;aspect-ratio:7/9;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
@media (max-width:980px){.adm-cartes{grid-template-columns:1fr}.adm-apercu{position:static}}

/* Héros et pouvoir */
.heros{--fc:var(--neutre);display:flex;align-items:center;gap:10px;background:var(--table-2);border-radius:12px;padding:6px 12px 6px 6px;border-left:5px solid var(--fc)}
.heros-sym{width:40px;height:40px;border-radius:50%;background:var(--fc);color:var(--fci);display:grid;place-items:center;font-size:22px;flex:none}
.heros-txt{display:flex;flex-direction:column;line-height:1.2}
.heros-txt b{font-family:Cinzel,"Times New Roman",serif;font-size:16px}
.heros-txt span{font-size:13px;color:var(--ink-2)}
.pouvoir{display:flex;flex-direction:column;gap:3px;min-width:120px;cursor:help;font-size:13px;color:var(--ink-2)}
.pouvoir .pouvoir-nom{font-weight:700;color:var(--ink)}
.pouvoir .barre{height:6px;margin:0}
.pouvoir.pret .barre span{background:var(--bronze)}
.pouvoir.pret .pouvoir-etat{color:var(--bronze);font-weight:700}
.btn-pouvoir{padding:8px 14px;animation:luire 1.6s ease-in-out infinite}
@keyframes luire{50%{box-shadow:0 0 0 4px rgba(217,163,90,.45)}}
.res.puissance{cursor:help}
@media (prefers-reduced-motion: reduce){.btn-pouvoir{animation:none}}

/* Compte joueur */
.compte{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--table-2);border-radius:12px;padding:12px 14px;margin-top:18px;border-left:5px solid var(--line)}
.compte p{margin:4px 0 0}
.boite .compte .actions{margin:0}
.compte > div:first-child{flex:1 1 300px}
.compte.alerte{border-left-color:var(--bronze)}
.compte.ok-compte{border-left-color:var(--cible)}
.avertissement{background:var(--table-2);border-left:4px solid var(--bronze);padding:8px 12px;border-radius:6px;color:var(--ink)}
.etapes-liste{margin:0 0 14px;padding-left:22px;color:var(--ink-2)}
.etapes-liste li{margin-bottom:4px}
.boite .champ input{font:inherit;font-size:16px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
.lien{background:none;border:none;padding:0;color:var(--bronze);text-decoration:underline;cursor:pointer;font:inherit}

/* Profil, trophées et statistiques */
.adm-page.adm-stats{max-width:1240px}
.adm-stats select{font:inherit;font-size:15px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.page-profil{display:flex;flex-direction:column;gap:16px;max-width:1000px}
.bloc-profil{background:var(--zone);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.bloc-profil h2,.adm-stats h2{font-size:19px;margin:0 0 8px}
.adm-stats h2{margin-top:22px}
.bloc-profil h3,.adm-stats h3{font-family:Cinzel,serif;font-size:15px;margin:18px 0 8px}
.ligne-pseudo{display:flex;gap:10px;flex-wrap:wrap}
.ligne-pseudo input{font:inherit;font-size:17px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:240px;flex:1 1 240px;max-width:360px}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tuile{background:var(--table-2);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tuile b{font-family:Cinzel,"Times New Roman",serif;font-size:24px;color:var(--ink)}
.tuile span{font-size:13px;color:var(--ink-2)}
.tableau-defile{overflow-x:auto}
.tableau{border-collapse:collapse;width:100%;font-size:14px}
.tableau th,.tableau td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tableau thead th{color:var(--ink-2);font-weight:700}
.tableau tbody tr:hover{background:color-mix(in srgb, var(--bronze) 8%, transparent)}
.tableau .tri{background:none;border:none;padding:0;font:inherit;font-weight:700;color:inherit;cursor:pointer}
.tableau .tri.actif{color:var(--ink)}
.tableau.duels td,.tableau.duels th{text-align:center}
.taux-haut{color:var(--danger);font-weight:700}
.taux-bas{color:#4f86d9;font-weight:700}
.liste-en-ligne{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.liste-en-ligne li{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--table-2);border-radius:6px;padding:8px 12px}
.point-vert{width:10px;height:10px;border-radius:50%;background:var(--cible);box-shadow:0 0 0 3px color-mix(in srgb, var(--cible) 25%, transparent)}
.trophees{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.trophee{display:flex;gap:12px;align-items:flex-start;background:var(--table-2);border-radius:8px;padding:12px}
.trophee > div{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.trophee .medaille{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:24px;color:#fff;
  background:radial-gradient(circle at 35% 30%,#8a8f98,#4a4f58);box-shadow:inset 0 0 0 3px rgba(0,0,0,.2);opacity:.45;filter:grayscale(1)}
.trophee.niveau-1 .medaille{background:radial-gradient(circle at 35% 30%,#f0b88a,#a0602e 60%,#6b3c18);opacity:1;filter:none}
.trophee.niveau-2 .medaille{background:radial-gradient(circle at 35% 30%,#ffffff,#b9c2cc 55%,#727c88);color:#2a3038;opacity:1;filter:none}
.trophee.niveau-3 .medaille{background:radial-gradient(circle at 35% 30%,#fff4c2,#f0c64e 45%,#a8750f);color:#3b2a06;opacity:1;filter:none;box-shadow:0 0 14px rgba(240,198,78,.55)}
.trophee .niveau{font-family:Cinzel,serif;font-weight:700;font-size:13px;color:var(--ink-2)}
.trophee.niveau-3 .niveau{color:var(--or)}
.trophee .barre{height:6px;margin:4px 0 0}

/* Écran de connexion */
.boite.porte{max-width:520px}
.porte-tete{text-align:center;margin-bottom:18px}
.porte-tete .sous-logo{margin-bottom:0}
.porte h3{font-family:Cinzel,"Times New Roman",serif;font-size:19px;margin:0 0 10px}
.onglets-porte{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.onglets-porte button{background:transparent;border:none;padding:11px 8px;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:15px;color:var(--ink-2);cursor:pointer}
.onglets-porte button.actif{background:color-mix(in srgb, var(--bronze) 22%, transparent);color:var(--ink);box-shadow:inset 0 -3px 0 var(--bronze)}
.formulaire{display:flex;flex-direction:column;gap:12px;margin:6px 0 16px}
.boite.porte .actions{flex-direction:column;align-items:stretch}
.boite.porte .actions .btn{padding:13px 18px}
.boite.porte .aide{margin-top:12px}

/* Icônes des effets */
.ico-effet{display:inline-block;width:1.3em;height:1.3em;vertical-align:-0.3em;margin-left:.06em;cursor:help;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.ico-effet svg{width:100%;height:100%;display:block}
.effet-part{white-space:nowrap;margin:0 .12em}
.carte .texte{font-size:7cqw}

/* Symboles des mots-clés */
.sym-mot{--sym-fond:#f2d48a;display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;background:var(--sym-fond);color:#2b1a04;
  vertical-align:-0.38em;margin:0 .08em;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.4);cursor:help;text-shadow:none}
.sym-mot svg{width:72%;height:72%;display:block}
.sym-mot.sym-faction{background:var(--fc);color:var(--fci);font-size:.95em;line-height:1;box-shadow:0 0 0 1.5px #f2d48a,0 1px 2px rgba(0,0,0,.45)}
.carte .texte .symboles{display:inline-flex;gap:.25em;justify-content:center;margin-bottom:.15em}
.carte .texte .symboles .sym-mot{width:1.75em;height:1.75em}
.crea .puces .sym-mot{width:15cqw;height:15cqw}
.legende-symboles{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.legende{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

/* Règles du jeu */
.page-regles{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start;max-width:1150px}
.sommaire{position:sticky;top:12px;background:var(--zone);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.sommaire b{font-family:Cinzel,serif}
.sommaire ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:15px}
.sommaire a{color:var(--ink);text-decoration:none}
.sommaire a:hover{color:var(--or);text-decoration:underline}
.corps-regles{display:flex;flex-direction:column;gap:14px}
.corps-regles section{scroll-margin-top:12px;line-height:1.55}
.corps-regles ul,.corps-regles ol{padding-left:22px;margin:6px 0}
.corps-regles li{margin-bottom:6px}
.corps-regles .tableau td{white-space:normal;vertical-align:middle}
.corps-regles .sym-mot,.corps-regles .ico-effet{font-size:18px}
@media (max-width:860px){.page-regles{grid-template-columns:1fr}.sommaire{position:static}}

/* Tutoriel */
#tuto-panneau{position:fixed;z-index:24;left:16px;top:96px;width:320px;max-width:calc(100vw - 32px);background:var(--zone);color:var(--ink);
  border:1px solid color-mix(in srgb, var(--or) 60%, var(--line));border-radius:10px;padding:16px 18px;box-shadow:0 14px 40px var(--ombre),inset 0 0 0 4px var(--zone),inset 0 0 0 5px color-mix(in srgb, var(--or) 25%, transparent)}
#tuto-panneau h2{font-size:20px;margin:4px 0 8px;color:var(--or)}
#tuto-panneau p{margin:0 0 12px;line-height:1.5;font-size:15px}
#tuto-panneau .tuto-etape{font-size:13px;color:var(--ink-2);letter-spacing:.04em}
#tuto-panneau .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tuto-cible{outline:3px solid var(--or);outline-offset:4px;border-radius:10px;animation:tuto-pulse 1.3s ease-in-out infinite;position:relative;z-index:6}
.medaillon.tuto-cible{border-radius:50%}
@keyframes tuto-pulse{50%{outline-color:transparent;box-shadow:0 0 22px color-mix(in srgb, var(--or) 60%, transparent)}}
@media (max-width:1060px){#tuto-panneau{top:auto;bottom:12px;left:12px;right:12px;width:auto}}
@media (prefers-reduced-motion: reduce){.tuto-cible{animation:none}}

/* Musique */
.son{display:inline-flex;align-items:center;gap:8px}
.btn-son{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;padding:0}
.btn-son:hover{color:var(--ink);border-color:var(--bronze)}
.btn-son svg{width:22px;height:22px}
.btn-son[aria-pressed="false"]{opacity:.6}
.son input[type=range]{width:130px;accent-color:var(--bronze)}
.reglage-son{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--ink-2)}
.ligne-musique{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:8px 0}
.ligne-musique .champ{flex:1 1 320px}
.adm-page code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--table-2);padding:1px 6px;border-radius:4px}

/* Crédits */
.page-credits{display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto;text-align:center}
.liste-credits{list-style:none;margin:10px 0 14px;padding:0;display:flex;flex-direction:column;gap:12px}
.liste-credits li{display:flex;flex-direction:column;gap:2px}
.titre-credit{font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:17px;color:var(--ink)}
.artiste-credit{color:var(--ink-2)}

/* Piles de cartes */
.zone-main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:18px}
.zone-main .main.eventail{padding-left:44px;padding-right:44px}
.zone-main .pile{position:relative;z-index:7}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:30px}
.pile-tas{position:relative;width:84px;aspect-ratio:63/88}
.pile.petite{padding-bottom:0}
.pile.petite .pile-tas{width:46px}
.dos-pile{position:absolute;inset:0;border-radius:6px;transform:translate(calc(var(--i) * -3px), calc(var(--i) * -3px));
  background:linear-gradient(135deg,#8a5a1f,#3b2a14);box-shadow:inset 0 0 0 3px rgba(242,212,138,.45),0 2px 5px var(--ombre);display:grid;place-items:center;color:#f2d48a;font-family:Cinzel,serif;font-weight:700;font-size:26px}
.pile.petite .dos-pile{font-size:15px;box-shadow:inset 0 0 0 2px rgba(242,212,138,.45),0 1px 3px var(--ombre)}
.dos-pile:not(:last-of-type) span{opacity:0}
.pile-vide{position:absolute;inset:0;border-radius:6px;border:2px dashed var(--line)}
.pile-tas .carte{--w:84px;position:absolute;inset:0;cursor:default;pointer-events:none}
.pile.petite .pile-tas .carte{--w:46px}
.pile-nb{position:absolute;right:-10px;bottom:-10px;z-index:3;min-width:30px;height:30px;padding:0 7px;border-radius:99px;display:grid;place-items:center;
  font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:15px;color:#3b2a06;background:radial-gradient(circle at 35% 30%,#fff4c2,#f0c64e 45%,#a8750f);border:2px solid #7a520a;box-shadow:0 2px 5px var(--ombre)}
.pile.petite .pile-nb{min-width:22px;height:22px;font-size:12px;right:-8px;bottom:-8px;padding:0 5px}
.pile-nom{font-size:12px;color:var(--ink-2);letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.pile.petite .pile-nom{display:none}
.pile-bannies{font-size:12px}
.piles-adverses{display:flex;gap:16px;align-items:flex-start}
.fx-pulse{animation:fx-pulse .9s ease}
@keyframes fx-pulse{40%{transform:scale(1.12);filter:brightness(1.3)}}
@media (max-width:700px){.zone-main{grid-template-columns:1fr}.zone-main .pile{display:none}}

/* Calque d’animations */
#fx{position:fixed;inset:0;pointer-events:none;z-index:28;overflow:hidden}
.fx-objet{position:absolute;left:0;top:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.fx-objet svg{width:100%;height:100%;display:block}
.fx-carte{position:absolute;left:0;top:0;transform-origin:center}
.fx-attaquant{position:absolute;z-index:2;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.fx-attaquant > .crea{width:100%;height:100%;margin:0}
.champ-res{width:110px;font:inherit;font-size:15px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.actions-res{display:flex;gap:8px;align-items:center}
.fx-carte .carte{--w:100%;width:100%}
.fx-eclat{position:absolute;width:120px;height:120px;border-radius:50%;pointer-events:none}
.fx-eclat.impact{background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,226,140,.85) 25%,rgba(255,160,60,.35) 50%,transparent 70%)}
.fx-eclat.soin{width:150px;height:150px;background:radial-gradient(circle,rgba(220,255,225,.9) 0,rgba(110,220,140,.7) 30%,rgba(60,180,100,.25) 55%,transparent 72%)}
.fx-particule-soin{position:absolute;color:#7fe0a0;font-family:Cinzel,serif;font-weight:700;font-size:24px;text-shadow:0 0 6px rgba(60,180,100,.9)}
@media (prefers-reduced-motion: reduce){.fx-pulse{animation:none}}
.fx-dos{position:absolute;left:0;top:0;aspect-ratio:63/88;border-radius:6px;background:linear-gradient(135deg,#8a5a1f,#3b2a14);box-shadow:inset 0 0 0 3px rgba(242,212,138,.45),0 4px 10px rgba(0,0,0,.4);display:grid;place-items:center;color:#f2d48a;font-family:Cinzel,serif;font-weight:700;font-size:26px}
.fx-symbole{position:absolute;font-size:34px;pointer-events:none}
.fx-symbole .sym-mot{width:1.4em;height:1.4em}
.fx-eclat.poussiere{background:radial-gradient(circle,rgba(200,200,210,.7) 0,rgba(140,140,150,.35) 40%,transparent 70%)}
.fx-eclat.feu{width:150px;height:150px;background:radial-gradient(circle,rgba(255,240,180,.95) 0,rgba(255,150,40,.85) 25%,rgba(200,50,10,.4) 50%,transparent 70%)}
.fx-eclat.or{width:90px;height:90px;background:radial-gradient(circle,rgba(255,250,220,.95) 0,rgba(240,198,78,.7) 35%,transparent 70%)}
.fx-eclat.bouclier{width:130px;height:130px;background:radial-gradient(circle,transparent 45%,rgba(200,230,255,.95) 50%,rgba(120,180,255,.5) 58%,transparent 66%)}
.fx-eclat.pouvoir{width:220px;height:220px;background:radial-gradient(circle,rgba(255,250,220,.9) 0,rgba(242,193,78,.75) 25%,rgba(242,193,78,.25) 50%,transparent 70%)}
.fx-rayon{position:absolute;width:6px;height:110px;border-radius:3px;background:linear-gradient(to top,rgba(242,193,78,0),rgba(255,236,170,.95));transform-origin:50% 100%}
.fx-onde{position:absolute;height:14px;border-radius:99px;transform-origin:0 50%;background:linear-gradient(90deg,rgba(255,200,120,0),rgba(255,226,160,.95) 50%,rgba(255,200,120,0));box-shadow:0 0 22px rgba(255,190,90,.8)}
.fx-eclat-medaillon{position:absolute;width:16px;height:16px;background:linear-gradient(135deg,#d9dde3,#6f7780);clip-path:polygon(50% 0,100% 40%,70% 100%,10% 80%,0 30%)}
body.sans-animations *,body.sans-animations *::before,body.sans-animations *::after{animation:none!important;transition:none!important}
.reglages-joueur{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:14px;color:var(--ink-2)}
.reglages-joueur .reglage-son{display:flex;align-items:center;gap:10px;margin:0}
.reglage-anim{display:flex;align-items:center;gap:8px}
.reglage-anim select{font:inherit;font-size:15px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:6px;padding:5px 8px}

/* Surveillance */
.liste-alertes{display:flex;flex-direction:column;gap:10px}
.alerte{background:var(--table-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.alerte.traitee{opacity:.55}
.alerte header,.alerte footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.alerte footer{justify-content:space-between}
.alerte .quand{margin-left:auto;font-size:13px;color:var(--ink-2)}
.joueur-alerte{font-size:16px}
.motif-alerte{margin:0;font-size:14px;line-height:1.45}
.details-alerte{display:flex;flex-wrap:wrap;gap:6px}
.detail-alerte{font-size:13px;background:var(--zone);border-radius:4px;padding:3px 8px}
.detail-alerte b{color:var(--ink-2);font-weight:700;margin-right:4px}
.gravite{font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;color:#fff}
.gravite.g-forte{background:#b8402f}
.gravite.g-moyenne{background:#b07a1e}
.gravite.g-faible{background:#6f7c88}
.adm-stats select{font:inherit;font-size:15px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:6px;padding:6px 8px}

/* Accueil : écran plein */
#couche.couche-hall{place-items:start center;overflow-y:auto;padding:18px calc(18px + env(safe-area-inset-right, 0px)) 18px calc(18px + env(safe-area-inset-left, 0px))}
.hall{width:min(1100px,100%);display:flex;flex-direction:column;gap:16px;margin:auto 0}
.hall-tete{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hall-logo .logo{font-size:clamp(30px,4.5vw,46px)}
.hall-logo .sous-logo{margin:4px 0 0}
.hall-droite{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.hall-profil{display:flex;align-items:center;gap:8px;background:var(--zone);border:1px solid var(--line);border-radius:99px;padding:4px 14px 4px 4px;color:var(--ink);font:inherit;cursor:pointer}
.hall-profil:hover{border-color:var(--bronze)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:Cinzel,serif;font-weight:700;color:var(--btn-texte);background:linear-gradient(135deg,var(--btn-haut),var(--btn-bas))}
.nom-profil{font-weight:700;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hall-icone{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--zone);color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.hall-icone:hover{color:var(--ink);border-color:var(--bronze)}
.ico{width:20px;height:20px;flex:none}
.hall-icone .ico{width:22px;height:22px}
.hall-grille{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:"jouer quete" "tuiles tuiles" "apprendre apprendre";gap:16px}
.hall-jouer{grid-area:jouer;background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb, var(--bronze) 22%, var(--zone)),var(--zone) 60%);border:1px solid color-mix(in srgb, var(--bronze) 45%, var(--line));border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hall-jouer h2,.hall-quete .quete b{font-family:Cinzel,serif}
.hall-jouer h2{font-size:20px;margin:0}
.btn-geant{display:flex;align-items:center;gap:16px;text-align:left;width:100%;padding:16px 20px;border-radius:10px;cursor:pointer;color:var(--btn-texte);
  background:linear-gradient(180deg,var(--btn-haut),var(--btn-bas));border:1px solid var(--btn-bord);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px var(--ombre);transition:filter .12s, transform .08s}
.btn-geant:hover{filter:brightness(1.08)}
.btn-geant:active{transform:translateY(1px)}
.btn-geant b{display:block;font-family:Cinzel,serif;font-size:clamp(19px,2.3vw,24px)}
.btn-geant small{display:block;font-size:14px;opacity:.85;margin-top:2px}
.ico-geant{width:44px;height:44px;flex:none}
.hall-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));grid-auto-flow:column;gap:10px}
.pastille-test{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#6b3fa0;border-radius:99px;padding:1px 7px;margin-left:4px}
.hall-modes .btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0;padding:11px 12px}
.hall-quete{grid-area:quete;display:flex}
.hall-quete .quete{flex:1;margin:0;display:flex;flex-direction:column;justify-content:center;gap:10px;border-radius:12px;padding:18px}
.hall-tuiles{grid-area:tuiles;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tuile-hall{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;border-radius:12px;background:var(--zone);border:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s, transform .15s}
.tuile-hall:hover,.tuile-hall:focus-visible{border-color:var(--bronze);transform:translateY(-2px)}
.ico-tuile{width:34px;height:34px;color:var(--or)}
.tuile-titre{font-family:Cinzel,serif;font-weight:700;font-size:18px}
.tuile-info{font-size:13px;color:var(--ink-2)}
.hall-apprendre{grid-area:apprendre;display:flex;gap:6px 22px;flex-wrap:wrap;justify-content:center}
.lien-hall{display:inline-flex;align-items:center;gap:8px;background:none;border:none;color:var(--ink-2);font:inherit;font-size:15px;cursor:pointer;padding:6px 4px}
.lien-hall:hover{color:var(--ink);text-decoration:underline}
.pastille-nouveau{font-size:11px;font-weight:700;color:#fff;background:#3f9d6b;border-radius:99px;padding:1px 8px}
.hall > .compte{margin:0}
.boite-reglages{max-width:480px}
.boite-reglages section{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.boite-reglages h2 + section{border-top:none;margin-top:4px;padding-top:0}
.boite-reglages h3{margin:0 0 8px}
@media (max-width:760px){
  .hall-grille{grid-template-columns:1fr;grid-template-areas:"jouer" "quete" "tuiles" "apprendre"}
  .hall-tuiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hall-modes{grid-template-columns:1fr}
}
body.compact .hall{gap:8px}
body.compact .hall-logo .logo{font-size:24px}
body.compact .hall-logo .sous-logo{display:none}
body.compact .hall-grille{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"jouer quete" "tuiles tuiles" "apprendre apprendre";gap:8px}
body.compact .hall-jouer{padding:10px 12px;gap:8px}
body.compact .hall-jouer h2{display:none}
body.compact .btn-geant{padding:10px 14px}
body.compact .btn-geant small{display:none}
body.compact .ico-geant{width:32px;height:32px}
body.compact .hall-modes .btn{padding:7px 8px;font-size:13px}
body.compact .hall-quete .quete{padding:10px 12px;gap:6px}
body.compact .hall-tuiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
body.compact .tuile-hall{padding:8px 10px;gap:2px;flex-direction:row;align-items:center;flex-wrap:wrap}
body.compact .ico-tuile{width:22px;height:22px}
body.compact .tuile-titre{font-size:15px}
body.compact .tuile-info{width:100%;font-size:11px}
body.compact .hall-icone{width:34px;height:34px}
body.compact .nom-profil{max-width:100px}
body.compact .lien-hall{padding:2px 4px;font-size:13px}

/* Administration : barre fixe et menu par thèmes */
.adm-coque{max-width:1440px;margin:0 auto}
.adm-barre{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:12px 0;margin-bottom:12px;
  background:color-mix(in srgb, var(--table) 92%, transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.adm-barre h1{margin:0;font-size:22px}
.adm-statut{font-size:13px;color:var(--ink-2)}
.adm-barre-actions{display:flex;gap:10px;margin-left:auto;align-items:center}
.adm-barre-actions .btn{margin:0}
.adm-corps{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.adm-menu{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px;background:var(--zone);border:1px solid var(--line);border-radius:10px;padding:12px}
.adm-menu-groupe{display:flex;flex-direction:column;gap:2px}
.adm-menu-groupe h2{font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 4px 10px}
.adm-lien{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:6px;border:none;background:none;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.adm-lien:hover{background:color-mix(in srgb, var(--bronze) 12%, transparent)}
.adm-lien[aria-current="page"]{background:color-mix(in srgb, var(--bronze) 24%, transparent);box-shadow:inset 3px 0 0 var(--bronze);font-weight:700}
.badge-menu{background:#b8402f;color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:0 7px;line-height:20px}
.adm-contenu{min-width:0}
.adm-contenu > .adm-page:first-child,.adm-contenu > .adm-cartes:first-child{margin-top:0}
details.effet .champs{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.adm-contenu .champ input,.adm-contenu .champ select{min-width:0;width:100%;box-sizing:border-box}
@media (max-width:900px){
  .adm-corps{grid-template-columns:1fr}
  .adm-menu{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding:6px}
  .adm-menu-groupe{flex-direction:row;gap:4px}
  .adm-menu-groupe h2{display:none}
  .adm-menu-groupe + .adm-menu-groupe{border-left:1px solid var(--line);padding-left:4px}
  .adm-lien{white-space:nowrap;padding:6px 10px}
  .adm-statut{display:none}
}
body.compact .adm-barre{padding:6px 0;margin-bottom:6px}
body.compact .adm-barre h1{font-size:17px}
body.compact .adm-statut{display:none}

/* Illustrations alternatives */
.carte.variante.cadre-dore,.crea.variante.cadre-dore{box-shadow:0 0 0 2px #f2c14e,0 0 12px rgba(242,193,78,.55),0 3px 8px var(--ombre)}
.carte.variante.cadre-holo .art::after,.crea.variante.cadre-holo .art::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.35;
  background:linear-gradient(115deg,transparent 20%,rgba(255,80,180,.7) 35%,rgba(80,200,255,.7) 50%,rgba(140,255,120,.7) 65%,transparent 80%);background-size:250% 250%;animation:holo 4s ease-in-out infinite}
.carte.variante.cadre-holo,.crea.variante.cadre-holo{box-shadow:0 0 0 2px #b9c2ff,0 0 12px rgba(160,180,255,.6)}
@keyframes holo{50%{background-position:100% 100%}}
.carte.variante.cadre-pleine .art{position:absolute;inset:0;height:auto;border-radius:inherit}
.carte.variante.cadre-pleine .texte{background:rgba(10,8,5,.72)}
.edition{position:absolute;left:4cqw;top:16cqw;z-index:2;font-size:5.5cqw;font-weight:700;color:#3b2a06;background:linear-gradient(135deg,#fff4c2,#f0c64e);border-radius:99px;padding:.5cqw 3cqw;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.variante-admin{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.vignette-variante .carte{--w:130px;cursor:default}
.boosters-variante{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:10px;font-size:14px}
.case-booster{display:inline-flex;align-items:center;gap:6px}
.liste-boosters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.liste-boosters .adm-lien{width:auto}
.editeur-booster{border-top:1px solid var(--line);padding-top:12px}
.resume-booster{font-weight:700;margin:10px 0}
.grille-choix{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;max-height:340px;overflow:auto;margin-top:8px;padding:6px;background:var(--table-2);border-radius:8px}
.choix-booster{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.adm-boosters select{font:inherit;font-size:15px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.choix-illustrations{margin:6px 0 10px}
.choix-illustrations h3{font-family:Cinzel,serif;font-size:15px;margin:0 0 6px}
.rangee-vignettes{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.vignette-choix{position:relative;flex:none;background:none;border:2px solid transparent;border-radius:10px;padding:2px;cursor:pointer}
.vignette-choix .carte,.zoom .zoom-info .vignette-choix .carte{--w:72px;width:72px;pointer-events:none;animation:none}
.vignette-choix.vue{border-color:var(--bronze)}
.vignette-choix.verrouillee .carte{filter:grayscale(1) brightness(.55)}
.cadenas{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.marque-choisie{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:10px;font-weight:700;color:#fff;background:#3f9d6b;border-radius:99px;padding:0 7px;white-space:nowrap}
.nouvelle.illustration{background:linear-gradient(135deg,#f0c64e,#b07a1e);color:#2b1a04}
.nouvelle.doublon{background:#6f7c88}
.offre-speciale{border-left-width:5px}
@media (prefers-reduced-motion: reduce){.carte.variante.cadre-holo .art::after,.crea.variante.cadre-holo .art::after{animation:none}}

/* Tour de jeu bien visible */
#banniere{top:34%}
#banniere .banniere-bande{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;padding:16px 20px;text-align:center;
  background:linear-gradient(90deg,transparent,color-mix(in srgb, var(--table) 92%, transparent) 18%,color-mix(in srgb, var(--table) 92%, transparent) 82%,transparent);
  border-top:2px solid color-mix(in srgb, var(--or) 70%, transparent);border-bottom:2px solid color-mix(in srgb, var(--or) 70%, transparent);
  box-shadow:0 0 40px color-mix(in srgb, var(--or) 25%, transparent)}
#banniere .banniere-bande b{font-family:"Cinzel Decorative",Cinzel,serif;font-weight:700;font-size:clamp(34px,6vw,62px);color:var(--or);text-shadow:0 3px 0 var(--ombre),0 0 30px color-mix(in srgb, var(--or) 45%, transparent);letter-spacing:.04em}
#banniere .banniere-bande small{font-family:Cinzel,serif;font-size:clamp(14px,1.8vw,18px);color:var(--ink);letter-spacing:.2em;text-transform:uppercase}
#banniere.adverse .banniere-bande{border-color:color-mix(in srgb, var(--ink-2) 50%, transparent);box-shadow:none}
#banniere.adverse .banniere-bande b{color:var(--ink);font-size:clamp(26px,4.5vw,44px);text-shadow:0 2px 0 var(--ombre)}
.pastille-tour{font-size:14px;font-weight:700;border-radius:99px;padding:4px 14px;white-space:nowrap}
.pastille-tour.a-moi{color:var(--btn-texte);background:linear-gradient(180deg,var(--btn-haut),var(--btn-bas));box-shadow:0 0 12px color-mix(in srgb, var(--or) 45%, transparent)}
.pastille-tour.adverse{color:var(--ink-2);background:var(--zone);border:1px solid var(--line)}
.plateau.tour-moi .camp-moi{box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--or) 55%, transparent);animation:liseré-tour 2.4s ease-in-out infinite}
@keyframes liseré-tour{50%{box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--or) 25%, transparent),inset 0 0 30px color-mix(in srgb, var(--or) 10%, transparent)}}
.plateau.tour-moi .medaillon-bloc.moi .medaillon .anneau{filter:drop-shadow(0 0 8px var(--or))}
.plateau.tour-adverse .medaillon-bloc.adv .medaillon .anneau{filter:drop-shadow(0 0 8px color-mix(in srgb, var(--ink) 60%, transparent))}
.plateau.tour-adverse .zone-main .main{filter:saturate(.55) brightness(.75);transition:filter .4s}
.fin.attend{animation:fin-respire 2.2s ease-in-out infinite}
@keyframes fin-respire{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 0 0 6px color-mix(in srgb, var(--or) 22%, transparent),0 6px 16px var(--ombre)}}
.fin:disabled{font-size:13px}
.adversaire-joue{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;font-family:Cinzel,serif;font-weight:700;font-size:15px;color:var(--ink);
  background:var(--zone);border:1px solid var(--line);border-radius:99px;padding:5px 16px;box-shadow:0 4px 14px var(--ombre);white-space:nowrap}
.adversaire-joue .points i{font-style:normal;animation:point-attente 1.2s infinite}
.adversaire-joue .points i:nth-child(2){animation-delay:.2s}
.adversaire-joue .points i:nth-child(3){animation-delay:.4s}
@keyframes point-attente{0%,60%,100%{opacity:.2}30%{opacity:1}}
body.compact .adversaire-joue{position:static;transform:none;grid-area:axe;justify-self:center;align-self:center;font-size:12px;padding:2px 10px}
body.compact .pastille-tour{font-size:12px;padding:2px 10px}
body.compact #banniere .banniere-bande{padding:8px 12px}
body.compact #banniere .banniere-bande b{font-size:30px}
@media (prefers-reduced-motion: reduce){.plateau.tour-moi .camp-moi,.fin.attend,.adversaire-joue .points i{animation:none}}



/* Lisibilité : actions possibles, défausses, journal */
.main .carte.jouable{box-shadow:0 0 0 2px #ffd34d,0 0 18px rgba(255,211,77,.55),0 3px 8px var(--ombre)}
.crea.peut{box-shadow:0 0 0 3px #4fd18b,0 0 14px rgba(79,209,139,.6);animation:crea-prete 1.6s ease-in-out infinite}
.crea.peut::before{content:"⚔";position:absolute;z-index:4;top:-9px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;
  background:#2f9e63;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
@keyframes crea-prete{50%{box-shadow:0 0 0 3px #4fd18b,0 0 22px rgba(79,209,139,.9)}}
.crea.choisie{box-shadow:0 0 0 4px #ffd34d,0 0 24px rgba(255,211,77,.85);transform:translateY(-8px);animation:none}
.crea.cible{box-shadow:0 0 0 3px #ff5a45,0 0 16px rgba(255,90,69,.7);cursor:crosshair;animation:cible-pulse 1.1s ease-in-out infinite}
.medaillon.cible{cursor:crosshair}
.medaillon.cible .visage{animation:cible-medaillon 1.1s ease-in-out infinite}
@keyframes cible-pulse{50%{box-shadow:0 0 0 3px #ff5a45,0 0 26px rgba(255,90,69,1)}}
@keyframes cible-medaillon{50%{box-shadow:0 0 0 5px #ff5a45,0 0 34px #ff5a45}}
.marche .carte.achetable{box-shadow:0 0 0 3px #4fd18b,0 0 14px rgba(79,209,139,.55),0 2px 6px rgba(0,0,0,.28)}
.plateau.tour-moi ~ .cote .marche .carte:not(.achetable),.table-jeu:has(.plateau.tour-moi) .marche .carte:not(.achetable){opacity:.6;filter:saturate(.6)}
.ressource.puissance.dispo .jeton{animation:jeton-dispo 1.2s ease-in-out infinite}
@keyframes jeton-dispo{50%{transform:scale(1.12);box-shadow:0 0 0 4px rgba(255,90,69,.45),0 0 18px rgba(255,90,69,.8)}}
.pile-defausse[data-act]{cursor:pointer}
.pile-defausse[data-act]:hover .pile-tas,.pile-defausse[data-act]:focus-visible .pile-tas{filter:brightness(1.15);outline:2px solid var(--bronze);outline-offset:3px;border-radius:6px}
.lien-defausse{background:none;border:none;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
.boite-defausse{max-width:min(980px,94vw)}
.grille-defausse{display:flex;flex-wrap:wrap;gap:8px;max-height:60vh;overflow:auto;padding:4px}
.grille-defausse .carte{--w:118px}
.ressources-autre{display:inline-flex;gap:4px;align-items:center}
.mini-jeton{min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:Cinzel,serif;font-weight:700;font-size:13px;padding:0 3px;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.mini-jeton.or{background:radial-gradient(circle at 35% 30%,#fff1b8,#e0b13d 55%,#8a5f12);color:#2b1a04}
.mini-jeton.puissance{background:radial-gradient(circle at 35% 30%,#ffb8a3,#d0503a 55%,#7a1d10);color:#fff}
.nom-journal{color:var(--or);cursor:help;font-weight:700}
.nom-journal:hover,.nom-journal:focus-visible{text-decoration:underline}
#survol-carte{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .12s}
#survol-carte.montre{opacity:1}
#survol-carte .carte{--w:190px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
body.compact .mini-jeton{min-width:18px;height:18px;font-size:10px}
body.compact .crea.peut::before{width:14px;height:14px;font-size:9px;top:-6px}
@media (prefers-reduced-motion: reduce){.crea.peut,.crea.cible,.medaillon.cible .visage,.ressource.puissance.dispo .jeton{animation:none}}

/* Dévotion */
.devotion-palier{font-size:12px;font-weight:700;color:var(--or);letter-spacing:.04em}
.devotion-deck{display:flex;flex-direction:column;gap:5px;font-size:14px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb, var(--fc) 14%, transparent);border:1px solid color-mix(in srgb, var(--fc) 40%, transparent);margin:8px 0}
.barre-devotion{position:relative;height:8px;border-radius:4px;background:var(--line);overflow:visible}
.barre-devotion > span{display:block;height:100%;border-radius:4px;background:var(--fc)}
.barre-devotion i{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink-2)}
.liste-versions{display:flex;flex-direction:column;gap:6px}
.ligne-version{display:grid;grid-template-columns:auto 110px 1fr auto;align-items:center;gap:10px}
.ligne-version .btn{margin:0}
body.compact .devotion-palier{font-size:9px}

/* Atelier de deck */
.atelier{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;height:calc(100dvh - 96px);min-height:520px}
.onglets-atelier{display:none}
.atelier-collection{display:flex;flex-direction:column;min-height:0;background:var(--zone);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.outils-atelier{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb, var(--zone) 92%, var(--table))}
.ligne-outils{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ligne-outils input[type=search]{flex:1 1 220px;min-width:160px;font:inherit;font-size:15px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ligne-outils select{font:inherit;font-size:14px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.tri-atelier{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.puces-outils{gap:6px}
.puce-filtre{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:13px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:99px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.puce-filtre:hover{border-color:var(--bronze)}
.puce-filtre.actif{background:var(--bronze);border-color:var(--bronze);color:var(--btn-texte);font-weight:700}
.puce-filtre[class*=" f-"].actif{background:var(--fc);border-color:var(--fc);color:#fff}
.puce-filtre .sym{font-size:14px}
.puce-cout{min-width:34px;justify-content:center;padding:5px 8px}
.sep-outils{width:1px;height:22px;background:var(--line);margin:0 4px}
.resultats{margin-left:auto}
.grille-atelier{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px 10px;align-content:start}
.tuile-atelier{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px}
.tuile-atelier .carte{--w:min(100%,150px);transition:transform .12s, box-shadow .12s}
.tuile-atelier .carte:hover{transform:translateY(-3px)}
.tuile-atelier.dans-deck .carte{box-shadow:0 0 0 3px #4fd18b,0 0 12px rgba(79,209,139,.45)}
.tuile-atelier.epuisee .carte{filter:grayscale(.75) brightness(.7)}
.pied-tuile{display:grid;grid-template-columns:26px 1fr 26px;align-items:center;justify-items:center;width:100%;max-width:150px;gap:4px}
.moins-tuile,.moins-vide{width:24px;height:24px}
.moins-tuile{border-radius:50%;border:none;background:#b8402f;color:#fff;font-size:17px;font-weight:700;line-height:1;cursor:pointer;padding:0}
.moins-tuile:hover{filter:brightness(1.15)}
.nb-tuile{min-width:24px;height:22px;border-radius:11px;display:grid;place-items:center;background:#2f9e63;color:#fff;font-weight:700;font-size:12px;padding:0 5px}
.points-copies{display:flex;gap:4px}
.points-copies i{width:9px;height:9px;border-radius:50%}
.points-copies i.plein{background:#4fd18b}
.points-copies i.libre{border:2px solid var(--ink-2)}
.points-copies i.absent{border:2px dashed color-mix(in srgb, var(--ink-2) 45%, transparent)}
.atelier-deck{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;background:var(--zone);border:1px solid var(--line);border-radius:12px;padding:14px}
.nom-atelier{width:100%;box-sizing:border-box;font-family:Cinzel,serif;font-size:19px;font-weight:700;color:var(--ink);background:transparent;border:1px solid transparent;border-bottom-color:var(--line);border-radius:6px;padding:6px 8px}
.nom-atelier:hover,.nom-atelier:focus{border-color:var(--bronze);background:var(--table)}
.compteur-atelier{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--ink-2);margin-top:6px}
.compteur-atelier b{font-family:Cinzel,serif;font-size:30px;line-height:1}
.compteur-atelier.valide b{color:#4fd18b}
.compteur-atelier.invalide b{color:var(--ink)}
.compteur-atelier > span:first-child{font-size:15px}
.barre-compteur{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.barre-compteur span{display:block;height:100%;background:linear-gradient(90deg,var(--bronze),#4fd18b)}
.etat-deck{margin:4px 0 0;font-size:13px}
.etat-deck.valide{color:#4fd18b}
.etat-deck.invalide{color:var(--ink-2)}
.stats-atelier{display:flex;flex-direction:column;gap:10px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.types-deck{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.type-deck{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;align-items:center;column-gap:6px;background:var(--table);border-radius:8px;padding:6px 8px}
.type-deck .sym-type{grid-row:1/3;font-size:20px;color:var(--or)}
.type-deck b{font-family:Cinzel,serif;font-size:20px;line-height:1}
.type-deck span:not(.sym-type):not(.barre-type){font-size:11px;color:var(--ink-2)}
.barre-type{grid-column:1/3;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}
.barre-type span{display:block;height:100%;background:var(--or)}
.t-creature .barre-type span{background:#4fd18b}.t-sort .barre-type span{background:#6aa8ff}.t-arme .barre-type span{background:#d0503a}
.courbe-atelier .colonne{background:none;border:none;padding:0;cursor:pointer;color:inherit;font:inherit}
.courbe-atelier .colonne:hover .b,.courbe-atelier .colonne.actif .b{background:#4fd18b}
.liste-atelier{display:flex;flex-direction:column;gap:10px}
.groupe-deck h3{display:flex;justify-content:space-between;margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-family:inherit}
.groupe-deck ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.ligne-atelier{display:grid;grid-template-columns:24px 10px 1fr auto 26px 26px;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;background:var(--table);font-size:14px}
.ligne-atelier:hover{background:color-mix(in srgb, var(--bronze) 16%, var(--table))}
.ligne-atelier.r-legendaire .nom-ligne{color:#f0b84e;font-weight:700}
.ligne-atelier.r-epique .nom-ligne{color:#c79cf5}
.ligne-atelier.r-rare .nom-ligne{color:#8fc2ff}
.nom-ligne{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne-atelier .pm{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--zone);color:var(--ink);font-size:16px;font-weight:700;line-height:1;cursor:pointer;padding:0}
.ligne-atelier .pm:hover:not(:disabled){border-color:var(--bronze)}
.ligne-atelier .pm:disabled{opacity:.3;cursor:default}
.vide-deck{text-align:center;padding:20px 8px}
.actions-atelier{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}
.actions-atelier .btn{margin:0}
@media (max-width:900px), (max-height:520px){

}

/* Atelier : divinité du deck */
.heros-deck{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;padding:12px;border-radius:10px;
  background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb, var(--fc) 26%, transparent),color-mix(in srgb, var(--fc) 6%, transparent) 70%);border:1px solid color-mix(in srgb, var(--fc) 45%, transparent)}
.heros-deck .medaillon{width:84px;height:84px}
.heros-deck .medaillon{display:grid;place-items:center;position:relative;flex:none}
.heros-deck .medaillon .visage{display:grid;place-items:center;width:68px;height:68px;font-size:32px}
.heros-deck .medaillon-mini{width:52px;height:52px}
.heros-deck .medaillon-mini .visage{width:42px;height:42px;font-size:20px}
.infos-heros-deck{display:flex;flex-direction:column;gap:2px;min-width:0}
.nom-heros-deck{font-family:Cinzel,serif;font-size:22px;line-height:1.1}
.titre-heros-deck{font-size:13px;color:var(--ink-2)}
.pouvoir-heros-deck{font-size:13px;margin-top:4px}
.progres-heros-deck{grid-column:1/3;display:flex;flex-direction:column;gap:5px}
.heros-deck.vide,.heros-deck.egalite{--fc:var(--bronze)}
.heros-deck.vide p,.heros-deck.egalite p{margin:0}
.heros-deck.egalite{grid-template-columns:1fr}
.portraits-egalite{display:flex;gap:16px;justify-content:center}
.choix-egalite{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
body.compact .heros-deck .medaillon{width:60px;height:60px}
body.compact .heros-deck .medaillon .visage{width:48px;height:48px;font-size:22px}
body.compact .nom-heros-deck{font-size:17px}

/* Quêtes du jour et trophées */
.quetes-jour{display:flex;flex-direction:column;gap:8px}
.titre-quetes{font-family:Cinzel,serif;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ligne-quete{display:grid;grid-template-columns:1fr auto auto;grid-template-rows:auto auto;column-gap:10px;row-gap:3px;align-items:center}
.ligne-quete .texte-quete{font-size:14px}
.ligne-quete .barre{grid-column:1/2;grid-row:2;height:6px}
.ligne-quete .progres-quete{grid-row:1/3;grid-column:2;font-size:13px;color:var(--ink-2);min-width:42px;text-align:right}
.ligne-quete > :last-child{grid-row:1/3;grid-column:3}
.ligne-quete.faite .texte-quete{color:var(--ink-2);text-decoration:line-through}
.ligne-quete.faite .progres-quete{color:#4fd18b;font-weight:700}
.btn-quete{margin:0;padding:5px 10px;font-size:13px;animation:jeton-dispo 1.4s ease-in-out infinite}
.pastille-recompense{display:block;width:fit-content;font-size:11px;font-weight:700;color:#fff;background:#b8402f;border-radius:99px;padding:1px 8px;margin-bottom:3px}
.trophee .corps-trophee{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.rangs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:6px}
.rang{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;border-radius:6px;padding:4px 2px;background:var(--table);border:1px solid var(--line);opacity:.6;font-size:11px}
.rang.atteint{opacity:1}
.rang.r1.atteint{border-color:#b07a4a}.rang.r2.atteint{border-color:#b9c3cc}.rang.r3.atteint{border-color:#e0b13d}.rang.r4.atteint{border-color:#9fe3ff;box-shadow:0 0 8px rgba(159,227,255,.4)}
.nom-rang{font-weight:700}
.seuil-rang{color:var(--ink-2)}
.rec-rang{display:block;width:100%;text-align:center;font-size:10px;color:var(--ink-2)}
.rang.recu .rec-rang{color:#4fd18b}
.btn-rang{margin:0;padding:3px 4px;font-size:10px;line-height:1.2;white-space:nowrap;width:100%;box-sizing:border-box;display:flex;justify-content:center;text-align:center}
.trophee.niveau-4 .medaille{background:radial-gradient(circle at 35% 30%,#ffffff,#9fe3ff 55%,#3d7fa0);color:#123}
.paquets-offerts{background:var(--zone);border:1px solid color-mix(in srgb, var(--or) 45%, var(--line));border-radius:12px;padding:12px 16px;margin:10px 0}
.paquets-offerts h2{margin:0 0 4px}
.liste-offerts{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.offert{display:flex;align-items:center;gap:8px;background:var(--table);border:1px solid var(--line);border-left:4px solid var(--fc, var(--or));border-radius:8px;padding:6px 10px}
.offert .btn{margin:0;padding:5px 12px}
.sym-offert{font-size:20px;color:var(--fc, var(--or))}

/* Tutoriel : pages de fin */
.boite-guide{max-width:620px}
.points-guide{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.points-guide i{width:8px;height:8px;border-radius:50%;background:var(--line)}

.boite-guide .tableau{font-size:14px;width:100%;table-layout:fixed}
.boite-guide .tableau th,.boite-guide .tableau td,#regle-heros .tableau th,#regle-heros .tableau td{white-space:normal;vertical-align:top}
.boite-guide .tableau th:first-child,.boite-guide .tableau td:first-child{width:26%}
.defile-tableau{overflow-x:auto}

/* Collection : cartes non possédées floutées, cartes de départ */
.col-item.manque .carte{filter:none;opacity:.9}
.col-item.manque .carte .illu{filter:blur(5px) saturate(.6) brightness(.85);transform:scale(1.12)}
.col-item.manque .carte .art{overflow:hidden}
.carte-ouverte.non-possedee .z-illu{overflow:hidden}

.titre-section-col{font-size:17px;margin:14px 0 4px}
.grille-depart{margin-bottom:6px}
.badge-versions{position:absolute;top:-6px;right:-6px;z-index:3;font-size:11px;font-weight:700;color:var(--btn-texte);background:linear-gradient(180deg,var(--btn-haut),var(--btn-bas));border-radius:99px;padding:1px 8px}

/* Administration : cartes absentes du catalogue */
.alerte-catalogue{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin:10px 0 0;padding:10px 14px;border-radius:10px;
  background:color-mix(in srgb, #b8402f 18%, var(--zone));border:1px solid #b8402f}

.alerte-catalogue .btn{margin:0}

/* Bulles d’aide */
#bulle{position:fixed;z-index:40;max-width:270px;background:var(--ink);color:var(--table);font-size:14px;line-height:1.35;padding:8px 11px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 4px 14px rgba(0,0,0,.3);left:0;top:0}

.aide-mot{text-decoration:underline dotted rgba(242,212,138,.85);text-underline-offset:2px;cursor:help}
.puce[data-aide]{cursor:help}

/* Jeu en ligne */
.code-partie{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:40px;font-weight:700;letter-spacing:.18em;background:var(--table-2);border-radius:12px;padding:14px 20px;text-align:center;margin:8px 0 14px;color:var(--ink)}

.boite h3{font-family:Cinzel,"Times New Roman",serif;font-size:17px;margin:20px 0 8px}
.attente{display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.attente::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--cible);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.attente::before{animation:none}}

/* Phase 4 : accueil, collection, decks, boutique */
.boite.boite-large{max-width:760px}
.ligne-titre{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bourse{display:flex;gap:8px}
.res.encre b{color:var(--encre-c)}
.quete{background:var(--table-2);border-radius:12px;padding:12px 14px;margin:14px 0 4px}
.barre{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.barre span{display:block;height:100%;background:var(--cible)}
.quete-pied{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--ink-2);font-size:14px;flex-wrap:wrap}
.ok,.valide{color:var(--cible)}
.invalide{color:var(--danger)}
.gain{font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:20px;color:var(--bronze)}
.filtres{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.filtres input,.filtres select,.boite select,.panneau input{font:inherit;font-size:15px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.case{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.page-collection{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}

.grille{display:flex;flex-wrap:wrap;gap:14px;padding:6px}

.badge-nb{background:var(--ink);color:var(--table);font-weight:700;font-size:13px;border-radius:99px;padding:1px 10px}
.col-item.manque .badge-nb{opacity:.5}
.panneau{position:sticky;top:12px;background:var(--zone);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panneau .carte{--w:180px;align-self:center;cursor:default}
.panneau p{margin:0}
.liste-decks{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.deck-ligne{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--zone);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.deck-ligne .aide{display:flex;align-items:center;gap:6px;margin:2px 0}
.compteur{font-family:Cinzel,"Times New Roman",serif;font-size:28px;font-weight:700}
.courbe{display:flex;gap:6px;align-items:flex-end;height:96px}

.factions-deck{display:flex;flex-wrap:wrap;gap:6px}
.puce-fac{display:inline-flex;align-items:center;gap:5px;font-size:13px;background:var(--table-2);border-radius:99px;padding:3px 9px}
.liste-deck{list-style:none;margin:0;padding:0;max-height:38vh;overflow:auto}
.liste-deck button{width:100%;display:flex;align-items:center;gap:8px;background:none;border:none;border-radius:6px;padding:5px 6px;cursor:pointer;text-align:left;font-size:14px}
.liste-deck button:hover{background:var(--table-2)}
.prix-mini{width:22px;height:22px;border-radius:50%;background:#f0c64e;color:#3b2a06;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.x-nb{margin-left:auto;color:var(--ink-2)}
.boutique .offres{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}

.paquet-visuel.paquet-faction,.dos[class*="f-"]{background:linear-gradient(135deg,color-mix(in srgb, var(--fc) 85%, white 10%),color-mix(in srgb, var(--fc) 55%, black));color:var(--fci)}
.boutique .ouverture{background:var(--zone);border:1px solid color-mix(in srgb, var(--or) 50%, var(--line));border-radius:10px;padding:14px 16px;margin-top:10px}

.boutique .offre .aide{margin:0 0 12px}
.paquet-visuel,.dos{width:120px;aspect-ratio:63/88;border-radius:8px;background:linear-gradient(135deg,#8a5a1f,#3b2a14);display:grid;place-items:center;color:#f2d48a;font-family:Cinzel,"Times New Roman",serif;font-size:44px;font-weight:700;box-shadow:inset 0 0 0 4px rgba(242,212,138,.5),0 3px 8px rgba(0,0,0,.3);border:none;flex:none}
.revelation{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0 6px}

.dos{width:150px;cursor:pointer;transition:transform .15s ease}
.dos:hover,.dos:focus-visible{transform:translateY(-6px)}
.revele{position:relative}
.revele.anim{animation:retourner .9s ease}

.nouvelle{position:absolute;top:-10px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--cible);color:#fff;font-weight:700;font-size:12px;border-radius:99px;padding:3px 8px;z-index:3}
.btn:disabled{opacity:.45;cursor:default}
@media (max-width:900px){.page-collection,.page-editeur{grid-template-columns:1fr}.panneau{position:static}}
/* Grande vue d’une carte (collection) */
.zoom-fond{position:fixed;inset:0;display:grid;place-items:center;padding:24px;overflow:auto}
.zoom{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:1200px;cursor:default}
.zoom .carte{--w:min(calc(84vh * 63 / 88), 78vw);cursor:default;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.zoom.anim .carte,.zoom.anim .carte-ouverte{animation:agrandir .25s ease}
.carte-ouverte{--fc:var(--neutre);--lis:rgba(0,0,0,.4);width:min(calc((86vh - 210px) * 7 / 9), 78vw);min-width:260px;background:var(--fc);border-radius:12px;padding:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.2);display:flex;flex-direction:column;gap:8px}

.z-illu{position:relative;width:100%;aspect-ratio:7/9;border-radius:6px;overflow:hidden;background:#2a2418;box-shadow:0 0 0 2px var(--lis)}
.z-illu img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.z-illu.sans-image::before{content:"";position:absolute;inset:0;background:var(--fc);opacity:.45}
.z-illu.sans-image::after{content:attr(data-sym);position:absolute;inset:0;display:grid;place-items:center;font-size:140px;color:rgba(255,255,255,.2)}
.z-texte{background:rgba(14,10,6,.93);color:#fff;border-radius:6px;padding:12px 14px;font-size:16px;line-height:1.4;position:relative}
.z-tete{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.z-tete b{font-family:Cinzel,"Times New Roman",serif;font-size:19px}
.z-type{color:#d6c9a8;font-size:14px}
.z-prix{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff4c2,#f0c64e 45%,#a8750f);color:#3b2a06;border:2px solid #7a520a;font-family:Cinzel,serif;font-weight:700}
.z-effets{text-align:center}
.z-effets .symboles{display:inline-flex;gap:.3em}
.z-stats{display:flex;justify-content:space-between;margin-top:8px}
.z-atk,.z-pv,.z-dur{min-width:38px;height:38px;display:grid;place-items:center;font-family:Cinzel,serif;font-weight:700;font-size:19px;padding:0 6px}

.z-pv,.z-dur{padding-bottom:6px;clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}
.z-pv{background:linear-gradient(#e0705c,#a3291b);color:#fff}
.z-dur{background:linear-gradient(#c5ced6,#6f7c88);color:#1d232a}
@keyframes agrandir{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.zoom-info{background:var(--zone);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:22px;width:320px;max-width:90vw;display:flex;flex-direction:column;gap:12px}
.zoom-info h2{font-size:24px;margin:0}

.zoom-nav{display:flex;gap:8px;justify-content:space-between}

.grille .col-item .carte{cursor:zoom-in}

/* Accueil d’un nouveau joueur */
.boite.boite-bienvenue{max-width:1040px}

.boite-bienvenue .intro{font-size:17px;color:var(--ink);margin:0 0 12px}

.etapes span{width:9px;height:9px;border-radius:50%;background:var(--line)}

.cartes-offertes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 0 6px}
.cartes-offertes .carte{--w:104px;cursor:default}
.apparition{animation:apparaitre .45s ease both}
.apparition.rare-plus .carte{box-shadow:0 0 0 2px var(--lis),0 0 14px var(--lis)}
@keyframes apparaitre{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.resume-rarete{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;color:var(--ink-2);margin:6px 0 4px}

.cadeau{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.cadeau .piece-or{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4c2,#f0c64e 45%,#a8750f);border:4px solid #7a520a;color:#3b2a06;display:grid;place-items:center;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:30px;box-shadow:0 3px 10px rgba(0,0,0,.3);flex:none}
