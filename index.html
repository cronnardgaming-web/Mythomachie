    <div class="adm-actions"><button type="button" class="btn" data-act="faction-nouvelle">Ajouter une faction</button></div>
  </div>`;
}

function admDonnees(){
  return `<div class="adm-page">
    <h2>Sauvegarde</h2>
    <p class="aide">Copiez ce texte pour garder une copie de vos réglages ailleurs. Pour restaurer une sauvegarde, collez-la ici puis cliquez sur Importer.</p>
    <p class="aide">Taille actuelle des réglages : ${Math.round(JSON.stringify(CONFIG).length/1024)} Ko sur environ 5 000 possibles dans le navigateur.${ASSETS ? " Les images envoyées sur le serveur du jeu ne comptent presque pas : chacune n’occupe qu’une adresse de quelques caractères." : ""}</p>
    ${(() => { const n = Object.values(CARTES).filter(c => (c.image || "").startsWith("data:")).length;
      return ASSETS && n ? `<p class="aide">${n} image${n>1 ? "s sont encore stockées" : " est encore stockée"} dans le navigateur.</p><div class="adm-actions"><button type="button" class="btn" data-act="images-transfert">Transférer vers le serveur du jeu</button></div>` : ""; })()}
    <textarea id="json-config" rows="16" spellcheck="false" aria-label="Configuration du jeu au format JSON">${esc(JSON.stringify(CONFIG, null, 2))}</textarea>
    <div class="adm-actions">
      <button type="button" class="btn" data-act="json-copier">Copier</button>
      <button type="button" class="btn second" data-act="json-importer">Importer le texte collé</button>
    </div>

function nettoyerCarte(c){
  for(const cle of Object.keys(BLOCS)){
    const e = c[cle];
    if(!e) continue;
    for(const k of Object.keys(e)) if(typeof e[k]==="number" && e[k]<=0) delete e[k];
    if(e.renfort){
      if(!e.renfort.atk && !e.renfort.vie) delete e.renfort;
      else { e.renfort.atk = e.renfort.atk || 0; e.renfort.vie = e.renfort.vie || 0; }
    }
    if(e.invoque && (!e.invoque.id || !e.invoque.n)) delete e.invoque;
    if(!Object.keys(e).length) delete c[cle];
  }
}

function majChemin(chemin, brut, nombre){
  if(chemin.startsWith("cat:")){
    const c = CARTES[chemin.slice(4)];
    delete c.depart; delete c.base; delete c.jeton;
    if(brut!=="marche") c[brut] = true;
    if(brut==="depart" && REGLES.deckDepart[chemin.slice(4)]==null) REGLES.deckDepart[chemin.slice(4)] = 1;
  } else {
    const parts = chemin.split(".");
    let o = CONFIG;
    for(let i=0;i<parts.length-1;i++){
      if(o[parts[i]]==null || typeof o[parts[i]]!=="object") o[parts[i]] = {};
      o = o[parts[i]];
    }
    const k = parts.at(-1);
    let v = brut;
    if(nombre){ v = Math.max(0, Math.floor(Number(brut))); if(!Number.isFinite(v)) v = 0; }
    o[k] = v;
    if(parts[0]==="heros" && CONFIG.heros[parts[1]] && CONFIG.heros[parts[1]].pouvoir){
      const pv = CONFIG.heros[parts[1]].pouvoir;
      if(parts.at(-2)==="invoque" && k==="id" && v && !o.n) o.n = 1;
      nettoyerCarte(pv); if(!pv.effet) pv.effet = {};
    }
    if(parts[0]==="cartes"){
      const c = CARTES[parts[1]];
      if(k==="faction" && !v) delete c.faction;
      if(k==="comboFaction" && !v) delete c.comboFaction;
      if(parts.at(-2)==="invoque" && k==="id" && v && !o.n) o.n = 1;
      if(k==="type"){
        if(v==="creature"){ c.attaque = c.attaque ?? 1; c.vie = c.vie ?? 1; }
        if(v==="arme"){ c.bonus = c.bonus ?? 1; c.durabilite = c.durabilite ?? 1; }
      }
      nettoyerCarte(c);
    }
  }
  sauver(); appliquerConfig();
}

function idUnique(prefixe){
  let n = 1, id;
  do { id = prefixe + "_" + Date.now().toString(36) + n++; } while(CARTES[id] || FACTIONS[id]);
  return id;
}

function actionAdmin(act, id, el){
  if(act.startsWith("srv-")){ actionServeur(act); return; }
  if(act.startsWith("mus-")){ actionMusiques(act, id); return; }
  if(act.startsWith("variante-") || act.startsWith("booster-") || act==="carte-promo"){ actionVariantes(act, id); return; }

    rpc("admin_traiter_alerte", {p_id:a.id, p_traite:!a.traite}).then(() => { a.traite = !a.traite; renderAdmin(); }, e => erreur(e.message));
    return;
  }
  if(act==="stats-res"){
    const j = PROG.adminStats.joueurs.find(x => x.id===id); if(!j) return;
    PROG.adminStats.edition = id; PROG.adminStats.formRes = {or:j.pieces_or || 0, encre:j.encre || 0};
    return renderAdmin();
  }
  if(act==="stats-res-annuler"){ PROG.adminStats.edition = null; return renderAdmin(); }
  if(act==="stats-res-ok"){
    const f = PROG.adminStats.formRes, o = Number(f.or), e = Number(f.encre);
    if(!Number.isInteger(o) || !Number.isInteger(e) || o<0 || e<0) return erreur("L’or et l’encre doivent être des nombres entiers positifs.");
    (async () => {
      try {
        await rpc("admin_modifier_ressources", {p_joueur:id, p_or:o, p_encre:e});
        PROG.adminStats.edition = null;
        if(id===EN.monId) await rafraichir();
        await chargerAdminStats();
        erreur(`Enregistré : ${nf(o)} or et ${nf(e)} encre.`);
      } catch(err) {
        erreur(/function|does not exist|schema cache/i.test(err.message) ? "Exécutez d’abord le script supabase-admin-joueurs.sql dans Supabase." : err.message);
      }
    })();
    return;
  }
  if(act==="stats-tri" || act==="stats-tri-c"){
    const k = act==="stats-tri" ? "tri" : "triCartes", t = PROG.adminStats[k] || {};
    PROG.adminStats[k] = {cle:id, sens: t.cle===id ? -t.sens : (["nom","email","rarete","ecran"].includes(id) ? 1 : -1)};
    return renderAdmin();
  }
  switch(act){
    case "admin": ui.ecran = "admin"; break;
    case "admin-quitter": ui.ecran = "jeu"; S = null; break;
    case "onglet": adm.onglet = id; adm.reset = false; break;
    case "carte-sel": adm.sel = id; adm.suppr = null; break;
    case "carte-nouvelle": {
      const nid = idUnique("carte");
      const f = adm.filtre!=="toutes" && adm.filtre!=="aucune" ? adm.filtre : Object.keys(FACTIONS)[0];
      CARTES[nid] = {nom:"Nouvelle carte", type:"sort", prix:2, rarete:"commune", effet:{or:1}};
      if(f) CARTES[nid].faction = f;
      adm.sel = nid; adm.recherche = ""; sauver(); break;
    }
    case "carte-dupliquer": {
      const nid = idUnique("carte");
      CARTES[nid] = copie(CARTES[id]); CARTES[nid].nom += " (copie)";
      adm.sel = nid; sauver(); break;
    }
    case "image-choisir": { const f = document.querySelector(`[data-image="${id}"]`); if(f) f.click(); return; }
    case "image-suppr": {
      const cib = cibleImage(id), anciens = [cib.obj.image, cib.obj.imageHD];
      delete cib.obj.image; delete cib.obj.imageHD; sauver(); anciens.forEach(liberer); erreur("Image retirée."); break;
    }
    case "images-transfert": if(ASSETS) transfererImages(); return;
    case "image-coller": {
      const repli = () => erreur("Appuyez sur Ctrl+V (Cmd+V sur Mac) pour coller l’image copiée.");
      if(!navigator.clipboard || !navigator.clipboard.read){ repli(); return; }
      navigator.clipboard.read().then(async items => {
        for(const it of items){
          const type = it.types.find(t => t.startsWith("image/"));
          if(type){ const blob = await it.getType(type); chargerImage(id, new File([blob], "image", {type})); return; }
        }
        erreur("Aucune image copiée : faites un clic droit sur l’image du site, puis « Copier l’image ».");
      }, repli);
      return;
    }
    case "carte-suppr": adm.suppr = id; break;
    case "carte-suppr-non": adm.suppr = null; break;
    case "carte-suppr-ok": {
      const imgSuppr = CARTES[id].image;
      delete CARTES[id];
      liberer(imgSuppr);
      delete REGLES.deckDepart[id];
      if(REGLES.carteBase===id) REGLES.carteBase = "";
      Object.values(CARTES).forEach(c => { for(const cle of Object.keys(BLOCS)) if(c[cle] && c[cle].invoque && c[cle].invoque.id===id) delete c[cle].invoque; nettoyerCarte(c); });
      adm.suppr = null; adm.sel = null; sauver(); erreur("Carte supprimée."); break;
    }
    case "faction-nouvelle": {
      const nid = idUnique("fac");
      FACTIONS[nid] = {nom:"Nouvelle faction", f:"nouvelle", m:"nouveau", sym:"✦", couleur:"#7a5c99"};
      if(!CONFIG.heros) CONFIG.heros = {};
      CONFIG.heros[nid] = copie(HEROS_DEFAUT);
      sauver(); appliquerConfig(); break;
    }
    case "faction-suppr":
      if(!Object.values(CARTES).some(c => c.faction===id)){ delete FACTIONS[id]; if(adm.filtre===id) adm.filtre = "toutes"; sauver(); appliquerConfig(); }
      break;
    case "json-copier": {
      const ta = document.getElementById("json-config");
      const fin = () => { ta.select(); try { document.execCommand("copy"); erreur("Texte copié."); } catch(e) { erreur("Texte sélectionné : copiez-le avec Ctrl+C."); } };
      if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(() => erreur("Texte copié."), fin); else fin();
      return;
    }
    case "json-importer": {
      const ta = document.getElementById("json-config");
      let obj;
      try { obj = JSON.parse(ta.value); } catch(e) { return erreur("Ce texte n’est pas une sauvegarde valide : vérifiez qu’il a été collé en entier."); }
      if(!obj || !obj.cartes || !obj.factions || !obj.regles) return erreur("Il manque les cartes, les factions ou les règles dans ce texte.");
      CONFIG = fusionner(obj); appliquerConfig(); sauver(); adm.sel = null; erreur("Sauvegarde importée."); break;
    }
    case "config-telecharger": telechargerConfig(); return;
    case "secours": adm.restaurer = true; break;
    case "secours-non": adm.restaurer = false; break;
    case "secours-ok": {
      const s = lireSecours(); adm.restaurer = false;
      if(s && s.config){
        const images = {}; Object.entries(CONFIG.cartes).forEach(([k,c]) => { if(c.image) images[k] = c.image; });
        CONFIG = fusionner(s.config); CONFIG.repare = 1;
        if(s.sansImages) Object.entries(images).forEach(([k,img]) => { if(CONFIG.cartes[k] && !CONFIG.cartes[k].image) CONFIG.cartes[k].image = img; });
        appliquerConfig(); sauver(); adm.sel = null; erreur("Copie de secours restaurée.");
      }
      break;
    }
    case "reset": adm.reset = true; break;
    case "reset-non": adm.reset = false; break;
    case "reset-ok":
      CONFIG = copie(DEFAUT); appliquerConfig(); sauver(); adm.reset = false; adm.sel = null; erreur("Valeurs d’origine restaurées."); break;
    default: return;
  }
  render();
}

const estServeur = url => typeof url==="string" && url.includes("/_blob/");

function liberer(url){
  if(!url || imageUtilisee(url)) return;
  if(ASSETS && estServeur(url)) ASSETS.delete(url.split("/_blob/")[1]).catch(() => {});
  else if(surSiteAdmin() && url.includes("/storage/v1/object/public/images/"))

function dataVersBlob(data){
  const [entete, b64] = data.split(",");
  const type = entete.match(/data:([^;]+)/)[1];
  const bin = atob(b64), t = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) t[i] = bin.charCodeAt(i);
  return new Blob([t], {type});
}
async function transfererImages(){

    try { const r = await ASSETS.upload(dataVersBlob(CARTES[k].image)); CARTES[k].image = r.url; ok++; sauver(); }

}

let raisonEchec = "";
async function versDataURL(url){
  try {
    const r = await fetch(url, {credentials:"include"});
    if(!r.ok) throw new Error("réponse " + r.status);
    const b = await r.blob();
    const d = await new Promise((ok, ko) => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = ko; f.readAsDataURL(b); });
    return d.replace(/^data:[^;,]*/, m => m.startsWith("data:image/") ? m : "data:image/jpeg");
  } catch(e) {
    raisonEchec = String(e && e.message || e);
    return await new Promise(ok => {
      const i = new Image();
      i.onload = () => {
        const c = document.createElement("canvas"); c.width = i.naturalWidth; c.height = i.naturalHeight;
        c.getContext("2d").drawImage(i, 0, 0);
        try { ok(c.toDataURL("image/jpeg", 0.85)); } catch(err) { raisonEchec += " / " + (err && err.name); ok(null); }
      };
      i.onerror = () => { raisonEchec += " / image illisible"; ok(null); };
      i.src = url;
    });
  }
}
async function telechargerConfig(){
  erreur("Préparation du fichier config.json…");
  const cfg = copie(CONFIG);
  cfg.exporte = Date.now();
  let manquantes = 0, integrees = 0, total = 0;
  raisonEchec = "";
  // Versions HD stockées sur Claude : trop lourdes pour config.json, elles restent sur Claude
  let hdRetirees = 0;
  for(const c of Object.values(cfg.cartes)) if(c.imageHD && estServeur(c.imageHD)){ delete c.imageHD; hdRetirees++; }
  for(const hr of Object.values(cfg.heros || {})){
    if(hr && hr.image && estServeur(hr.image)){ const d = await versDataURL(hr.image); if(d) hr.image = d; else delete hr.image; }
  }
  for(const c of Object.values(cfg.cartes)){
    if(!c.image) continue;
    total++;
    if(estServeur(c.image)){
      erreur(`Préparation des images : ${total}…`);
      const d = await versDataURL(c.image);
      if(d){ c.image = d; integrees++; } else { delete c.image; manquantes++; }
    } else integrees++;
  }
  for(const v of Object.values(cfg.variantes || {})){
    if(v.imageHD && estServeur(v.imageHD)) delete v.imageHD;
    if(v.image && estServeur(v.image)){ const d = await versDataURL(v.image); if(d) v.image = d; else delete v.image; }
  }
  adm.dernierExport = {total, integrees, manquantes, hdRetirees, raison:raisonEchec, quand:new Date().toLocaleTimeString("fr-FR"), ou: window.claude ? "le prototype sur Claude" : "votre site"};
  if(ui.ecran==="admin") renderAdmin();
  const texte = JSON.stringify(cfg);
  CONFIG.exporte = cfg.exporte; sauver();
  const fin = manquantes ? ` ${manquantes} image${manquantes>1 ? "s n’ont" : " n’a"} pas pu être intégrée${manquantes>1 ? "s" : ""}.` : "";
  if(window.claude && typeof window.claude.use==="function"){
    const dl = await window.claude.use("downloads").catch(() => null);
    if(!dl) return erreur("Le téléchargement n’est pas disponible sur cette page.");
    try { await dl.save({filename:"config.json", data:texte}); erreur("Fichier config.json enregistré." + fin); }
    catch(e) { if(!e || e.code!=="declined") erreur("Le téléchargement a échoué : réessayez dans un instant."); }
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([texte], {type:"application/json"}));
    a.download = "config.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    erreur("Fichier config.json téléchargé." + fin);
  }
}

// Une image peut appartenir à une carte (« id » ou « carte:id ») ou à un héros (« heros:egy »).
function cibleImage(cle){
  const i = String(cle).indexOf(":");
  const type = i>0 ? cle.slice(0, i) : "carte", id = i>0 ? cle.slice(i+1) : cle;
  if(type==="variante"){
    const v = CONFIG.variantes && CONFIG.variantes[id];
    return {obj:v, focusY:0.5, formats:[{cle:"imageHD", L:896, H:1152, q:0.9, hd:true}, {cle:"image", L:448, H:576, q:0.85}]};
  }
  if(type==="heros"){
    if(!CONFIG.heros) CONFIG.heros = {};
    if(!CONFIG.heros[id]) CONFIG.heros[id] = copie(HEROS_DEFAUT);
    return {obj:CONFIG.heros[id], focusY:0.3, formats:[{cle:"image", L:600, H:600, q:0.88, hd:true}]};
  }
  // Cartes : une version haute définition (grande vue) et une version légère (jeu), ratio 7:9
  return {obj:CARTES[id], focusY:0.5, formats:[{cle:"imageHD", L:896, H:1152, q:0.9, hd:true}, {cle:"image", L:448, H:576, q:0.85}]};
}
// Recadre au bon ratio sans jamais agrandir, avec une réduction progressive pour garder la netteté
function recadrer(source, L, H, focusY){
  const ratio = L/H, sw = source.width, sh = source.height;
  let cw = sw, ch = sw/ratio;
  if(ch > sh){ ch = sh; cw = sh*ratio; }
  const sx = (sw-cw)/2, sy = (sh-ch)*(focusY ?? 0.5);
  const ow = Math.max(1, Math.round(Math.min(L, cw))), oh = Math.max(1, Math.round(ow/ratio));
  let src = source, x = sx, y = sy, w = cw, hh = ch;
  while(w > ow*2){
    const t = document.createElement("canvas"); t.width = Math.round(w/2); t.height = Math.round(hh/2);
    const c = t.getContext("2d"); c.imageSmoothingQuality = "high"; c.drawImage(src, x, y, w, hh, 0, 0, t.width, t.height);
    src = t; x = 0; y = 0; w = t.width; hh = t.height;
  }
  const cv = document.createElement("canvas"); cv.width = ow; cv.height = oh;
  const ctx = cv.getContext("2d"); ctx.imageSmoothingQuality = "high";
  ctx.fillStyle = "#fbf7ec"; ctx.fillRect(0, 0, ow, oh);
  ctx.drawImage(src, x, y, w, hh, 0, 0, ow, oh);
  return cv;
}
const surSiteAdmin = () => !window.claude && PROG.admin && sbc() && sbc().storage;
async function stockerImage(blob, nom){
  if(ASSETS){ const r = await ASSETS.upload(blob); return r.url; }
  if(surSiteAdmin()){
    const st = sbc().storage.from("images");
    const { error } = await st.upload(nom, blob, {contentType:"image/jpeg", cacheControl:"31536000", upsert:false});
    if(error) throw new Error(/bucket not found/i.test(error.message) ? "le stockage d’images n’est pas encore créé : exécutez supabase-images.sql dans Supabase" : error.message);
    return st.getPublicUrl(nom).data.publicUrl;
  }
  return null;
}
function chargerImage(cle, fichier){
  if(!fichier || !fichier.type || !fichier.type.startsWith("image/")) return erreur("Ce fichier n’est pas une image : choisissez un PNG, un JPG ou un WebP.");
  const cib = cibleImage(cle);
  if(!cib.obj) return;
  const lecteur = new FileReader();
  lecteur.onload = () => {
    const img = new Image();
    img.onload = async () => {
      erreur("Préparation de l’image…");
      // La version légère est calculée à partir de la version HD (réduction exacte, plus nette)
      const versions = []; let hd = null;
      for(const f of cib.formats){
        const cv = recadrer(f.hd || !hd ? img : hd, f.L, f.H, cib.focusY);
        if(f.hd) hd = cv;
        versions.push({cle:f.cle, cv, q:f.q});
      }
      const anciens = Object.fromEntries(cib.formats.map(f => [f.cle, cib.obj[f.cle]]));
      const remettre = () => { for(const [k,v] of Object.entries(anciens)){ if(v) cib.obj[k] = v; else delete cib.obj[k]; } };
      const distant = !!ASSETS || surSiteAdmin();
      try {
        for(const v of versions){
          if(distant){
            erreur(`Envoi de l’image${versions.length>1 ? ` (${v.cle==="imageHD" ? "haute définition" : "version jeu"})` : ""}…`);
            const blob = await new Promise(ok => v.cv.toBlob(ok, "image/jpeg", v.q));
            cib.obj[v.cle] = await stockerImage(blob, `${String(cle).replace(/[^a-z0-9_-]/gi, "-")}-${v.cle}-${Date.now()}.jpg`);
          } else cib.obj[v.cle] = v.cv.toDataURL("image/jpeg", v.q);
        }
      } catch(e) { remettre(); erreur("Envoi de l’image impossible : " + (e.message || e) + "."); return renderAdmin(); }
      let message = distant ? "Image enregistrée sur le serveur, en haute définition." : "Image ajoutée.";
      if(!sauver()){
        // Navigateur plein : on garde au moins la version légère
        if(cib.obj.imageHD && cib.obj.imageHD.startsWith("data:")){ delete cib.obj.imageHD; message = "Image ajoutée, sans la version haute définition : la mémoire du navigateur est pleine."; }
        if(!sauver()){ remettre(); erreur("Mémoire du navigateur pleine : retirez quelques images pour en ajouter d’autres."); return renderAdmin(); }
      }
      Object.values(anciens).forEach(liberer);
      erreur(message);
      renderAdmin();
    };
    img.onerror = () => erreur("Impossible de lire cette image : essayez un autre fichier.");
    img.src = lecteur.result;
  };
  lecteur.readAsDataURL(fichier);
}

// Une file d’écriture par document : une seule écriture à la fois, la plus récente gagne
function fileEcriture(){
  let enCours = false, suivante = null;
  return fn => {
    suivante = fn;
    if(enCours) return;
    enCours = true;
    (async () => {
      while(suivante){ const f = suivante; suivante = null; try { await f(); } catch(e) { console.warn("Écriture refusée", e); } }
      enCours = false;
    })();
  };
}
const ecrirePartie = fileEcriture(), ecrirePrive = fileEcriture(), ecrireOrdres = fileEcriture();

const LETTRES = "abcdefghjkmnpqrstuvwxyz23456789";
const genererCode = () => Array.from({length:5}, () => LETTRES[Math.floor(Math.random()*LETTRES.length)]).join("");
const refPartie = () => EN.db.doc(`parties/${EN.hoteId}/p/${EN.code}`);
const refOrdres = () => EN.db.doc(`ordres/${EN.inviteId}/p/${EN.code}`);
const refPrive = () => EN.db.doc(`data/users/${EN.hoteId}/parties/${EN.code}`);

// Empreinte des règles et des cartes (sans les images) pour vérifier que les deux joueurs ont la même version
function empreinteConfig(cfg){
  const tri = v => Array.isArray(v) ? v.map(tri) : v && typeof v==="object" ? Object.fromEntries(Object.keys(v).sort().map(k => [k, tri(v[k])])) : v;
  const cartes = {};
  for(const [k, c] of Object.entries((cfg && cfg.cartes) || {})){ const { image, imageHD, ...reste } = c || {}; cartes[k] = reste; }
  const s = JSON.stringify(tri({cartes, regles:(cfg && cfg.regles) || {}}));
  let h1 = 0x811c9dc5;
  for(let i=0; i<s.length; i++){ h1 ^= s.charCodeAt(i); h1 = Math.imul(h1, 16777619); }
  return (h1 >>> 0).toString(16) + ":" + s.length;
}
function configPublique(){
  const cartes = copie(CONFIG.cartes);
  // Les images embarquées (data:) sont trop lourdes pour voyager : l’invité reprend celles de son site
  const sansData = o => { for(const k of ["image","imageHD"]) if(o[k] && o[k].startsWith("data:")) delete o[k]; };
  Object.values(cartes).forEach(sansData);
  const heros = copie(CONFIG.heros || {}); Object.values(heros).forEach(sansData);
  return {cartes, factions:CONFIG.factions, heros, mots:CONFIG.mots, termes:CONFIG.termes, regles:CONFIG.regles};
}
// Ce que l’invité a le droit de voir : pas la main de l’hôte, pas l’ordre des decks
function vuePublique(){
  const e = JSON.parse(JSON.stringify(S));
  e.joueurs[0].main = e.joueurs[0].main.length;
  e.joueurs.forEach(j => { j.deck = j.deck.length; });
  e.marcheDeck = e.marcheDeck.length;
  e.journal = e.journal.slice(-12);
  return e;
}
function reconstruire(e){
  e = JSON.parse(JSON.stringify(e));
  const vides = n => Array.from({length:n}, () => null);
  e.joueurs.forEach(j => { if(typeof j.main==="number") j.main = vides(j.main); if(typeof j.deck==="number") j.deck = vides(j.deck); });
  if(typeof e.marcheDeck==="number") e.marcheDeck = vides(e.marcheDeck);
  return e;
}

function publier(){
  if(!enLigne() || EN.role!=="hote") return;
  EN.version++;
  const statut = S.vainqueur!==null ? "terminee" : "en_cours";
  const corps = {etat:vuePublique(), version:EN.version, statut, hote:EN.hoteId, invite:EN.inviteId, config:EN.cfg, maj:Date.now()};
  const prive = {etat:JSON.parse(JSON.stringify(S)), code:EN.code, invite:EN.inviteId, statut, config:EN.cfg, maj:Date.now()};
  const rp = refPartie(), rv = refPrive();
  ecrirePartie(() => rp.set(corps));
  ecrirePrive(() => rv.set(prive));
}

function nettoyerAbonnements(){ EN.desabos.forEach(f => { try { f(); } catch(e) {} }); EN.desabos = []; }
function quitterEnLigne(){

  if(EN.role==="invite") appliquerConfig();
  Object.assign(EN, {ecran:null, code:null, role:null, hoteId:null, inviteId:null, ordres:[], seqEnvoye:0, refusVu:0, enAttente:false, cfg:null});

// ----- Hôte
async function creerPartie(){
  EN.erreurMenu = "";
  let code = genererCode();
  try { if((await EN.db.doc(`salle/${code}`).get()).exists) code = genererCode(); } catch(e) {}
  Object.assign(EN, {code, role:"hote", hoteId:EN.monId, inviteId:null, ecran:"attente", version:0, cfg:configPublique()});
  renderCouche();
  try { await EN.db.doc(`salle/${code}`).set({hote:EN.monId, statut:"attente", cree:Date.now()}); }
  catch(e) { EN.ecran = "choix"; EN.erreurMenu = "Impossible de créer la partie : vérifiez que la page est partagée avec vous comme Contributeur ou Éditeur."; return renderCouche(); }
  EN.desabos.push(EN.db.doc(`salle/${code}`).onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    if(d && d.invite && !EN.inviteId && EN.role==="hote") demarrerHote(d.invite);
  }, () => {}));
}
function deckChoisi(){
  if(!PROG.pret) return null;
  const v = decksValides(), d = v.find(x => x.id===EN.deckId) || v[0];
  return d ? [...d.cartes] : null;
}
function decksEnLigne(){
  const ok = a => Array.isArray(a) && a.length>0 && a.every(id => typeof id==="string" && estCollectionnable(CARTES[id]));
  if(!ok(EN.deckHote) && !ok(EN.deckInvite)) return undefined;
  return [ok(EN.deckHote) ? EN.deckHote : deckConstruit(), ok(EN.deckInvite) ? EN.deckInvite.slice(0, 60) : deckConstruit()];
}
function nommerJoueurs(){
  S.joueurs[0].nom = "Hôte"; S.joueurs[1].nom = "Invité";
  S.joueurs[0].pseudo = (PROG.profil && PROG.profil.pseudo) || null;
  S.joueurs[1].pseudo = typeof EN.pseudoInvite==="string" ? EN.pseudoInvite.slice(0, 20) : null;
}
function demarrerHote(inviteId){
  EN.inviteId = inviteId;
  nouvellePartie("enligne", decksEnLigne(), [prefVariantes(), EN.variantesInvite || null]); nommerJoueurs();
  S.seqTraite = 0; S.journal = [`${S.joueurs[S.courant].nom} commence.`];
  EN.ecran = null; ui.ecran = "jeu";
  Object.assign(ui, {attaquant:null, armeEnAttente:null, choixPierre:null, couvert:false, aiEnCours:false});
  ecouterOrdres(); publier(); render();
}
function revancheHote(){
  const seq = S.seqTraite || 0;
  nouvellePartie("enligne", decksEnLigne(), [prefVariantes(), EN.variantesInvite || null]); nommerJoueurs();
  S.seqTraite = seq; S.journal = [`Revanche ! ${S.joueurs[S.courant].nom} commence.`];
  Object.assign(ui, {attaquant:null, armeEnAttente:null, choixPierre:null});
  publier(); render();
}
function ecouterOrdres(){
  EN.desabos.push(refOrdres().onSnapshot(snap => {
    if(!snap.exists || !enLigne()) return;
    const liste = [...(snap.data().ordres || [])].sort((a,b) => a.seq-b.seq);
    let fait = false;
    for(const o of liste){
      if(o.seq > (S.seqTraite || 0)){ S.seqTraite = o.seq; executerOrdre(o); fait = true; }
    }
    if(fait){ publier(); render(); }
  }, () => {}));
}
function executerOrdre(o){
  const c = o.cmd || {};
  if(S.vainqueur!==null || S.courant!==1){ S.refus = {seq:o.seq, msg:"Ce n’est pas votre tour."}; return; }
  EN.capture = true; EN.refusCapture = null;
  try {
    switch(c.type){
      case "jouer": jouer(c.id, c.opts || {}); break;
      case "attaquer": attaquer(c.att, c.cible); break;
      case "combat": utiliserCombat(c.cible); break;
      case "acheter": acheter(c.k); break;
      case "sacrifier": sacrifier(c.id); break;
      case "bannir": bannir(c.id); break;
      case "bannirStop": S.bannirEnAttente = 0; break;
      case "fin": finTour(); break;
      case "pouvoir": activerPouvoir(); break;
    }
  } finally { EN.capture = false; }
  if(EN.refusCapture) S.refus = {seq:o.seq, msg:EN.refusCapture};
}
async function chargerReprises(){
  EN.reprises = [];
  try {
    const q = await EN.db.collection(`data/users/${EN.monId}/parties`).where("statut","==","en_cours").limit(5).get();
    EN.reprises = q.docs.map(d => d.data()).filter(d => d && d.etat).sort((a,b) => b.maj-a.maj);
  } catch(e) {}
  if(EN.ecran==="choix") renderCouche();
}
function reprendre(code){
  const r = EN.reprises.find(x => x.code===code);
  if(!r) return;
  Object.assign(EN, {code, role:"hote", hoteId:EN.monId, inviteId:r.invite, ecran:null, version:0, cfg:r.config || configPublique()});
  S = JSON.parse(JSON.stringify(r.etat));
  ui.ecran = "jeu"; Object.assign(ui, {attaquant:null, armeEnAttente:null, choixPierre:null, couvert:false, aiEnCours:false});
  ecouterOrdres(); publier(); render();
}

// ----- Invité
async function rejoindre(){
  EN.erreurMenu = "";
  const code = (EN.saisie || "").trim().toLowerCase();
  if(!/^[a-z0-9]{5}$/.test(code)){ EN.erreurMenu = "Le code fait 5 caractères (lettres et chiffres)."; return renderCouche(); }
  EN.ecran = "connexion"; renderCouche();
  const echec = msg => { EN.ecran = "choix"; EN.erreurMenu = msg; renderCouche(); };
  let d;
  try { const s = await EN.db.doc(`salle/${code}`).get(); d = s.exists ? s.data() : null; }
  catch(e) { return echec("Connexion impossible pour le moment. Réessayez dans un instant."); }
  if(!d || d.statut==="annulee") return echec("Aucune partie ne correspond à ce code.");
  if(d.hote===EN.monId) return echec("C’est votre propre partie : votre adversaire doit la rejoindre depuis son compte.");
  if(d.invite && d.invite!==EN.monId) return echec("Cette partie a déjà deux joueurs.");
  Object.assign(EN, {code, role:"invite", hoteId:d.hote, inviteId:EN.monId});
  try {
    if(!d.invite) await EN.db.doc(`salle/${code}`).update({invite:EN.monId});
    const o = await refOrdres().get();
    EN.ordres = o.exists ? [...(o.data().ordres || [])] : [];
    EN.seqEnvoye = EN.ordres.reduce((m,x) => Math.max(m, x.seq), 0);
  } catch(e) { EN.role = null; return echec("Impossible de rejoindre : la page doit être partagée avec vous comme Contributeur ou Éditeur."); }
  let premier = true;
  EN.desabos.push(refPartie().onSnapshot(snap => {
    if(!snap.exists || EN.role!=="invite") return;
    const p = snap.data();
    if(p.invite!==EN.monId) return;
    if(p.config) appliquerConfig(p.config);
    S = reconstruire(p.etat);
    EN.ecran = null; ui.ecran = "jeu";
    if(S.refus && S.refus.seq > EN.refusVu){ if(!premier) erreur(S.refus.msg); EN.refusVu = S.refus.seq; }
    if((S.seqTraite || 0) >= EN.seqEnvoye) EN.enAttente = false;
    if(S.courant!==1){ ui.attaquant = null; ui.armeEnAttente = null; ui.choixPierre = null; }
    premier = false;
    render();
  }, () => {}));
}
function envoyer(cmd){
  EN.seqEnvoye++;
  EN.ordres = [...EN.ordres, {seq:EN.seqEnvoye, cmd}].slice(-30);
  EN.enAttente = true;
  const data = {ordres:EN.ordres}, ref = refOrdres();
  ecrireOrdres(() => ref.set(data));
  return true;
}

function actionEnLigne(act, id){
  switch(act){
    case "en-ligne": EN.ecran = "choix"; EN.erreurMenu = ""; if(EN.db) chargerReprises(); break;
    case "en-retour": quitterEnLigne(); break;
    case "en-creer": creerPartie(); return;
    case "en-rejoindre": rejoindre(); return;
    case "en-reprendre": reprendre(id); return;
    case "en-copier":
      if(navigator.clipboard) navigator.clipboard.writeText(EN.code).then(() => erreur("Code copié."), () => erreur(`Code : ${EN.code}`));
      else erreur(`Code : ${EN.code}`);
      return;
    case "en-annuler":
      if(EN.role==="hote" && EN.code && !EN.inviteId) EN.db.doc(`salle/${EN.code}`).set({hote:EN.monId, statut:"annulee", cree:Date.now()}).catch(() => {});
      quitterEnLigne(); EN.ecran = "choix"; if(EN.db) chargerReprises(); break;
  }
  renderCouche();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(act==="mode-ia" || act==="mode-duo"){
    nouvellePartie(act==="mode-ia" ? "ia" : "duo");
    Object.assign(ui, {attaquant:null, armeEnAttente:null, choixPierre:null, aiEnCours:false, couvert: act==="mode-duo"});
    return apresAction();
  }
  if(act==="nouvelle"){ if(enLigne() || EN.role) quitterEnLigne(); S = null; ui.couvert = false; ui.aiEnCours = false; return render(); }
  if(act.startsWith("en-")) return actionEnLigne(act, id);
  if(act==="son"){ basculerSon(); return render(); }
  if(act==="reglages-ouvrir" || act==="reglages-fermer"){ PROG.reglagesOuverts = act==="reglages-ouvrir"; return render(); }
  if(act==="tuto") return lancerTuto();
  if(act==="regles"){ if(tutoActif()) S = null; ui.ecran = "regles"; window.scrollTo(0, 0); return render(); }
  if(act==="regles-retour"){ ui.ecran = "jeu"; return render(); }
  if(act==="credits"){ if(tutoActif()) S = null; ui.ecran = "credits"; window.scrollTo(0, 0); return render(); }
  if(act==="tuto-quitter"){ S = null; ui.ecran = "jeu"; const p = document.getElementById("tuto-panneau"); if(p) p.remove(); return render(); }
  if(act==="tuto-suivant"){ TUTO.etape++; return render(); }
  if(act==="tuto-page"){ TUTO.finPage = Number(id) || 0; return renderCouche(); }
  if(act==="admin" && !accesAdmin()) return erreur("L’administration est réservée à l’administrateur du jeu.");
  if(ui.ecran==="admin" && !accesAdmin()){ ui.ecran = "jeu"; return render(); }
  if(ui.ecran==="admin" || act==="admin"){ return actionAdmin(act, id, el); }
  if(actionProg(act, id)) return;
  if(act==="rejouer" && enLigne()){ if(EN.role==="hote") revancheHote(); return; }
  if(act==="rejouer" && S && est2v2()) return lancer2v2(S.deck0);
  if(act==="mode-2v2") return lancer2v2(null);
  if(act==="rejouer"){
    const mode = S.mode;
    nouvellePartie(mode);
    Object.assign(ui, {attaquant:null, armeEnAttente:null, choixPierre:null, aiEnCours:false, couvert: mode==="duo"});
    return apresAction();
  }
  if(act==="commencer"){ ui.couvert = false; return render(); }
  if(!S) return;
  if(act==="voir-defausse"){ ui.voirDefausse = Number(id); return renderCouche(); }
  if(act==="fermer-defausse"){ ui.voirDefausse = null; return renderCouche(); }
  // 2 contre 2 : bénéficiaire choisi des soins et renforts
  if(est2v2()) S.choixBenef = ui.benef==="moi" ? 0 : ui.benef==="allie" ? 2 : null;
  if(act==="ban"){ M().bannir(id); return apresAction(); }
  if(act==="ban-stop"){ if(enLigne() && EN.role==="invite") S.bannirEnAttente = 0; M().bannirStop(); return apresAction(); }
  if(act==="annuler"){ ui.attaquant = null; ui.armeEnAttente = null; ui.choixPierre = null; return render(); }
  if(act==="pierre-or" || act==="pierre-sac"){
    M().jouer(ui.choixPierre, {sacrifierDirect: act==="pierre-sac"}); ui.choixPierre = null; return apresAction();
  }
  if(!interactif()) return;
  if(tutoActif() && !tutoAutorise(act, id)){
    const e = etapesTuto()[TUTO.etape];
    return erreur(e ? `Pour l’instant, suivez l’étape « ${e.titre} » : l’élément à utiliser brille.` : "Suivez les étapes du tutoriel.");
  }
  if(est2v2() && clic2v2(act, id)) return apresAction();
  const j = S.joueurs[S.courant];
  switch(act){
    case "main": {
      const c = j.main.find(x => x.uid===id); if(!c) break;
      const d = def(c);
      ui.attaquant = null;
      if(d.type==="arme"){
        if(!j.plateau.length){ if(REGLES.armesHeros) M().jouer(id, {}); else erreur("Posez d’abord une créature à équiper."); }
        else ui.armeEnAttente = id;
      } else if(d.choixSacrifice) ui.choixPierre = id;
      else M().jouer(id);
      break;
    }
    case "own": {
      if(ui.armeEnAttente){ M().jouer(ui.armeEnAttente, {cible:id}); ui.armeEnAttente = null; break; }
      const c = j.plateau.find(x => x.uid===id); if(!c) break;
      if(c.peutAttaquer && !c.aAttaque) ui.attaquant = ui.attaquant===id ? null : id;
      else erreur(c.aAttaque ? "Cette créature a déjà attaqué ce tour." : "Une créature ne peut pas attaquer le tour où elle arrive, sauf avec Rapidité.");
      break;
    }
    case "enemy": case "face": {
      const cible = act==="face" ? "face" : id;
      if(ui.attaquant){
        const t = cibles(S.courant);
        if(cible==="face" ? !t.face : !t.creatures.has(cible)) erreur(raisonRefus(S.courant, cible));
        else M().attaquer(ui.attaquant, cible);
        ui.attaquant = null;
      }
      else if(j.combat>0){
        const t = cibles(S.courant);
        if(cible==="face" ? !t.face : !t.creatures.has(cible)) erreur(raisonRefus(S.courant, cible));
        else M().utiliserCombat(cible);
      }
      else erreur("Sélectionnez une de vos créatures prêtes, ou gagnez de la puissance avec vos cartes pour que votre héros attaque.");
      break;
    }
    case "marche": {
      const c = S.marche[Number(id)];
      if(c && j.or < def(c).prix) erreur(`Il vous faut ${def(c).prix} or pour acheter ${def(c).nom}.`);
      else M().acheter(Number(id));
      break;
    }
    case "base": {
      const b = CARTES[REGLES.carteBase];
      if(b && j.or < (b.prix || 0)) erreur(`Il vous faut ${b.prix} or pour ${b.nom}.`);
      else M().acheter("base");
      break;
    }
    case "sac": M().sacrifier(id); break;
    case "pouvoir": M().activerPouvoir(); break;
    case "fin":
      ui.attaquant = null; ui.armeEnAttente = null;
      M().finTour();
      if(S.mode==="duo") ui.couvert = true;
      break;
  }
  apresAction();
});

// Site autonome (GitHub Pages) : un fichier config.json placé à côté du jeu
// devient la configuration de tous les joueurs.
let CONFIG_SITE = null, CONFIG_SITE_PRET = false;
async function chargerFichierConfig(){
  if(window.claude) return;
  try {
    const r = await fetch("config.json", {cache:"no-store"});
    if(!r.ok){ CONFIG_SITE_PRET = true; return; }
    const fichier = await r.json();
    CONFIG_SITE = fichier; CONFIG_SITE_PRET = true;
    let local = null;
    try { local = JSON.parse(localStorage.getItem(CLE_STOCKAGE)); } catch(e) { local = null; }
    // repare : les navigateurs touchés par l’erreur de mise à jour (héros) rechargent config.json une fois
    if(!local || (fichier.exporte || 0) > (local.exporte || 0) || !local.repare){
      sauvegarderAvantChangement(local);
      CONFIG = fusionner(fichier); CONFIG.repare = 1; appliquerConfig(); sauver();
      if(!S) render();
    }
  } catch(e) { CONFIG_SITE_PRET = true; /* pas de config.json : on garde les cartes d’origine */ }
}

/* ============================================================
   JEU EN LIGNE SUR LE SITE AUTONOME (Supabase)
   Même principe que sur Claude : l’hôte fait tourner les règles,
   l’invité envoie ses actions. Les messages passent par Supabase
   Realtime ; la partie de l’hôte est sauvegardée dans la table
   « parties » pour pouvoir la reprendre.
   ============================================================ */
const SUPA = {url:"https://vwjgmahvojijrzhviwsb.supabase.co", cle:"sb_publishable_JSOSlATS-TPx6s5icOZk3g_ck9Brlx3",
              script:"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"};
if(!window.claude && SUPA.url){
  let sb = null, canal = null, minuteurs = [];
  const sessionHote = Math.random().toString(36).slice(2, 10);
  const ecrireSupa = fileEcriture();

  const chargerScript = src => new Promise((ok, ko) => {
    const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s);
    setTimeout(() => ko(new Error("délai dépassé")), 15000);
  });
  async function initSupabase(){
    if(sb) return true;
    EN.chargement = true; renderCouche();
    try {
      if(!window.supabase) await chargerScript(SUPA.script);
      sb = window.supabase.createClient(SUPA.url, SUPA.cle, {auth:{flowType:"implicit", detectSessionInUrl:true, persistSession:true, autoRefreshToken:true}});
      const { data } = await sb.auth.getSession();
      const session = data && data.session;
      // Plus de joueur invité : sans session, le joueur passe par l’écran de connexion
      if(session){ EN.db = "supabase"; EN.monId = session.user.id; }
      EN.erreurMenu = "";
      return true;
    } catch(e) {
      console.warn("Supabase", e); sb = null;
      EN.erreurMenu = "Connexion au serveur de jeu impossible pour le moment. Vérifiez votre connexion internet, puis réessayez.";
      return false;
    } finally { EN.chargement = false; }
  }

  window.__supa = {init:initSupabase, client:() => sb};
  function fermerCanal(){
    minuteurs.forEach(m => clearInterval(m)); minuteurs = [];
    if(canal && sb){ try { sb.removeChannel(canal); } catch(e) {} }
    canal = null;
  }
  function ouvrirCanal(code, gestion){
    fermerCanal();
    canal = sb.channel(`partie-${code}`, {config:{broadcast:{self:false}}});
    for(const [ev, f] of Object.entries(gestion)) canal.on("broadcast", {event:ev}, msg => f((msg && msg.payload) || {}));
    return new Promise(ok => {
      const delai = setTimeout(() => ok(false), 10000);
      canal.subscribe(statut => { if(statut==="SUBSCRIBED"){ clearTimeout(delai); ok(true); } });
    });
  }
  const emettre = (ev, payload) => { if(canal) Promise.resolve(canal.send({type:"broadcast", event:ev, payload})).catch(() => {}); };

  // ----- Hôte
  function sauverPartie(statut){
    if(!sb || EN.role!=="hote" || !EN.code) return;
    const ligne = {code:EN.code, hote:EN.hoteId, invite:EN.inviteId, statut,
                   etat:S ? JSON.parse(JSON.stringify(S)) : null, config:EN.cfg, maj:new Date().toISOString()};
    ecrireSupa(async () => { const { error } = await sb.from("parties").upsert(ligne); if(error) throw error; });
  }
  function envoyerEtat(avecConfig){
    if(!enLigne() || EN.role!=="hote") return;
    emettre("etat", {session:sessionHote, version:EN.version, invite:EN.inviteId, etat:vuePublique(), ...(avecConfig ? {config:EN.cfg} : {})});
  }
  function gestionHote(){
    return {
      rejoindre: p => {
        if(!p.id) return;
        if(!EN.inviteId && !EN.verifInvite){
          EN.verifInvite = true; EN.pseudoInvite = p.pseudo || null;
          EN.variantesInvite = p.variantes && typeof p.variantes==="object" ? Object.fromEntries(Object.entries(p.variantes).slice(0, 200).filter(([k, v]) => typeof v==="string")) : null;
          (async () => {
            let ok = true;
            try { ok = await rpc("deck_invite_valide", {p_invite:p.id, p_cartes:p.deck || []}); } catch(e) { ok = !/schema cache|does not exist/i.test(e.message) ? false : true; }
            EN.deckInvite = ok ? (p.deck || null) : null;
            EN.verifInvite = false;
            demarrerHote(p.id);
            if(!ok && S){ S.journal.push("Le deck de l’invité n’a pas été validé par le serveur : un deck au hasard le remplace."); publier(); render(); }
          })();
        }
        else if(p.id===EN.inviteId) envoyerEtat(true);
        else emettre("complet", {id:p.id});
      },
      bonjour: p => { if(p.id===EN.inviteId) envoyerEtat(true); },
      ordres: p => {
        if(p.id!==EN.inviteId || !enLigne()) return;
        let fait = false;
        for(const o of [...(p.ordres || [])].sort((a,b) => a.seq-b.seq)){
          if(o.seq > (S.seqTraite || 0)){ S.seqTraite = o.seq; executerOrdre(o); fait = true; }
        }
        if(fait){ publier(); render(); } else envoyerEtat();
      }
    };
  }
  const minuteurHote = () => minuteurs.push(setInterval(() => envoyerEtat(), 8000));

  creerPartie = async function(){
    EN.erreurMenu = "";
    if(PROG.pret && !deckChoisi()) return erreur(`Il vous faut un deck complet de ${REGLES.tailleDeck} cartes pour jouer en ligne.`);
    EN.deckHote = deckChoisi(); EN.deckInvite = null;
    Object.assign(EN, {code:genererCode(), role:"hote", hoteId:EN.monId, inviteId:null, ecran:"attente", version:0, cfg:configPublique()});
    renderCouche();
    const ok = await ouvrirCanal(EN.code, gestionHote());
    if(!ok){ fermerCanal(); EN.role = null; EN.ecran = "choix"; EN.erreurMenu = "Le serveur de jeu ne répond pas. Réessayez dans un instant."; return renderCouche(); }
    minuteurHote();
    sauverPartie("attente");
  };
  ecouterOrdres = function(){};
  publier = function(){
    if(!enLigne() || EN.role!=="hote") return;
    EN.version++;
    envoyerEtat(EN.version===1);
    sauverPartie(S.vainqueur!==null ? "terminee" : "en_cours");
  };
  chargerReprises = async function(){
    EN.reprises = [];
    try {
      const { data } = await sb.from("parties").select("code,invite,etat,config,maj,statut")
        .eq("hote", EN.monId).eq("statut", "en_cours").order("maj", {ascending:false}).limit(5);
      EN.reprises = (data || []).filter(d => d.etat).map(d => ({...d, maj:Date.parse(d.maj)}));
    } catch(e) {}
    if(EN.ecran==="choix") renderCouche();
  };
  reprendre = async function(code){
    const r = EN.reprises.find(x => x.code===code);
    if(!r) return;
    Object.assign(EN, {code, role:"hote", hoteId:EN.monId, inviteId:r.invite, ecran:null, version:0, cfg:r.config || configPublique()});
    S = JSON.parse(JSON.stringify(r.etat));
    ui.ecran = "jeu"; Object.assign(ui, {attaquant:null, armeEnAttente:null, choixPierre:null, couvert:false, aiEnCours:false});
    await ouvrirCanal(code, gestionHote());
    minuteurHote(); publier(); render();
  };

  // ----- Invité
  function appliquerConfigInvite(cfg){
    const c = copie(cfg);
    // Les images ne voyagent pas : chaque joueur reprend celles du site (config.json)
    for(const [k, carte] of Object.entries(c.cartes || {})){
      if(!carte.image && CONFIG.cartes[k] && CONFIG.cartes[k].image) carte.image = CONFIG.cartes[k].image;
      if(!carte.imageHD && CONFIG.cartes[k] && CONFIG.cartes[k].imageHD) carte.imageHD = CONFIG.cartes[k].imageHD;
    }
    for(const [k, hr] of Object.entries(c.heros || {})){
      if(!hr.image && CONFIG.heros && CONFIG.heros[k] && CONFIG.heros[k].image) hr.image = CONFIG.heros[k].image;
    }
    appliquerConfig(c);
  }
  function recevoirEtat(p){
    if(p.config && !EN.cfgRecu){
      if(!window.claude && CONFIG_SITE_PRET){
        // Sur le site, chaque joueur utilise les cartes officielles : une configuration différente est refusée
        if(empreinteConfig(p.config)!==empreinteConfig(CONFIG)){
          quitterEnLigne(); S = null;
          EN.erreurMenu = "Partie refusée : l’hôte n’utilise pas la même version des cartes que vous. Rechargez la page tous les deux, puis recommencez.";
          EN.ecran = "menu"; render(); return;
        }
        EN.cfgRecu = true;
      } else { appliquerConfigInvite(p.config); EN.cfgRecu = true; }
    }
    if(!EN.cfgRecu){ emettre("bonjour", {id:EN.monId}); return; }
    if(p.session!==EN.sessionVue){ EN.sessionVue = p.session; EN.versionRecue = 0; }
    if(p.version <= (EN.versionRecue || 0)) return;
    EN.versionRecue = p.version;
    const premier = !S || !enLigne();
    S = reconstruire(p.etat);
    EN.ecran = null; ui.ecran = "jeu";
    if((S.seqTraite || 0) > EN.seqEnvoye) EN.seqEnvoye = S.seqTraite;
    if(S.refus && S.refus.seq > EN.refusVu){ if(!premier) erreur(S.refus.msg); EN.refusVu = S.refus.seq; }
    if((S.seqTraite || 0) >= EN.seqEnvoye) EN.enAttente = false;
    if(S.courant!==1){ ui.attaquant = null; ui.armeEnAttente = null; ui.choixPierre = null; }
    render();
  }
  rejoindre = async function(){
    EN.erreurMenu = "";
    if(PROG.pret && !deckChoisi()) return erreur(`Il vous faut un deck complet de ${REGLES.tailleDeck} cartes pour jouer en ligne.`);
    const monDeck = deckChoisi();
    const code = (EN.saisie || "").trim().toLowerCase();
    if(!/^[a-z0-9]{5}$/.test(code)){ EN.erreurMenu = "Le code fait 5 caractères (lettres et chiffres)."; return renderCouche(); }
    Object.assign(EN, {code, role:"invite", inviteId:EN.monId, hoteId:null, ordres:[], seqEnvoye:0, refusVu:0,
                       cfgRecu:false, sessionVue:null, versionRecue:0, enAttente:false, ecran:"connexion"});
    renderCouche();
    let repondu = false;
    const echec = msg => { fermerCanal(); EN.role = null; EN.ecran = "choix"; EN.erreurMenu = msg; renderCouche(); };
    const ok = await ouvrirCanal(code, {
      etat: p => { if(p.invite!==EN.monId || EN.role!=="invite") return; repondu = true; recevoirEtat(p); },
      complet: p => { if(p.id===EN.monId && !repondu) echec("Cette partie a déjà deux joueurs."); }
    });
    if(!ok) return echec("Le serveur de jeu ne répond pas. Réessayez dans un instant.");
    const monPseudo = (PROG.profil && PROG.profil.pseudo) || null;
    const mesVariantes = typeof prefVariantes==="function" && PROG.pret ? prefVariantes() : {};
    emettre("rejoindre", {id:EN.monId, deck:monDeck, pseudo:monPseudo, variantes:mesVariantes});
    minuteurs.push(setInterval(() => {
      if(EN.role!=="invite") return;
      if(!repondu) emettre("rejoindre", {id:EN.monId, deck:monDeck, pseudo:monPseudo, variantes:mesVariantes});
      else if(EN.enAttente) emettre("ordres", {id:EN.monId, ordres:EN.ordres.filter(o => o.seq > ((S && S.seqTraite) || 0))});
    }, 2500));
    setTimeout(() => {
      if(!repondu && EN.role==="invite" && EN.ecran==="connexion")
        echec("Aucune partie trouvée avec ce code. Vérifiez-le, et que votre adversaire garde la page de la partie ouverte.");
    }, 15000);
  };
  envoyer = function(cmd){
    EN.seqEnvoye++;
    EN.ordres = [...EN.ordres, {seq:EN.seqEnvoye, cmd}].slice(-30);
    EN.enAttente = true;
    emettre("ordres", {id:EN.monId, ordres:EN.ordres});
    return true;
  };

  // ----- Navigation
  const quitterBase = quitterEnLigne;
  quitterEnLigne = function(){ fermerCanal(); quitterBase(); };
  const actionBase = actionEnLigne;
  actionEnLigne = function(act, id){
    if(act==="en-ligne"){
      EN.ecran = "choix"; EN.erreurMenu = "";
      initSupabase().then(ok => { if(ok) chargerReprises(); renderCouche(); });
      return renderCouche();
    }
    if(act==="en-annuler"){
      if(EN.role==="hote" && EN.code && !EN.inviteId && sb){ const c = EN.code; sb.from("parties").delete().eq("code", c).then(() => {}, () => {}); }
      quitterEnLigne(); EN.ecran = "choix"; if(sb) chargerReprises(); return renderCouche();
    }
    return actionBase(act, id);
  };
}

const PROG = {actif:false, pret:false, erreur:"", profil:null, collection:{}, decks:[], eco:null, admin:false,

  paquet:null, choixDeck:null, dernierGain:null, ecoEdit:null, bienvenue:false, occupe:false,
  recompensees:new Set((() => { try { return JSON.parse(localStorage.getItem("parties-recompensees")) || []; } catch(e) { return []; } })())};
const QUETES = [
  {texte:"Jouer 10 créatures", cle:"creatures", but:10},
  {texte:"Acheter 8 cartes au marché", cle:"achats", but:8},
  {texte:"Infliger 40 dégâts à l’adversaire", cle:"degats", but:40},
  {texte:"Gagner 2 parties", cle:"victoires", but:2},
  {texte:"Jouer 3 parties", cle:"parties", but:3},
  {texte:"Jouer 15 sorts", cle:"sorts", but:15}
];
const jourISO = () => new Date().toISOString().slice(0, 10);
const queteDuJour = () => QUETES[Math.floor(Date.now()/86400000) % QUETES.length];
function progresQuete(){ try { return JSON.parse(localStorage.getItem("quete-" + jourISO())) || {}; } catch(e) { return {}; } }
function ajouterProgresQuete(st, victoire){
  const p = progresQuete();
  for(const k of ["creatures","achats","degats","sorts"]) p[k] = (p[k] || 0) + ((st && st[k]) || 0);

async function rpc(nom, args){

const accesAdmin = () => !!window.claude || PROG.admin || PROG.adminExiste===false;

const maxCopies = id => CARTES[id] && CARTES[id].rarete==="legendaire" ? REGLES.copiesLegendaire : REGLES.copiesMax;
const compter = ids => ids.reduce((m, i) => (m[i] = (m[i] || 0) + 1, m), {});
function problemesDeck(ids){
  const p = [], t = REGLES.tailleDeck, n = ids.length;
  if(n < t) p.push(`Il manque ${t-n} carte${t-n>1 ? "s" : ""}.`);
  if(n > t) p.push(`Il y a ${n-t} carte${n-t>1 ? "s" : ""} en trop.`);
  for(const [id, k] of Object.entries(compter(ids))){
    const d = CARTES[id];
    if(!estCollectionnable(d)){ p.push(`${d ? d.nom : id} n’est plus disponible.`); continue; }
    if(k > maxCopies(id)) p.push(`Trop d’exemplaires de ${d.nom} (${k} sur ${maxCopies(id)} autorisés).`);
    if(k > (PROG.collection[id] || 0)) p.push(`Vous ne possédez que ${PROG.collection[id] || 0} ${d.nom}.`);
  }
  return p;
}
const decksValides = () => PROG.decks.filter(d => problemesDeck(d.cartes || []).length===0);

async function rafraichir(){
  const c = sbc();
  const [p, col, dk, eco, adm, existe] = await Promise.all([
    c.from("profils").select("*").maybeSingle(),
    c.from("collection").select("carte,nb"),
    c.from("decks").select("*").order("maj", {ascending:false}),
    c.from("economie").select("reglages").maybeSingle(),
    c.rpc("est_admin"),
    c.rpc("admin_existe")
  ]);
  for(const r of [p, col, dk, eco]) if(r.error) throw new Error(r.error.message);
  PROG.profil = p.data;
  PROG.collection = Object.fromEntries((col.data || []).filter(r => r.nb > 0).map(r => [r.carte, r.nb]));
  PROG.decks = dk.data || [];
  PROG.eco = eco.data ? eco.data.reglages : null;
  PROG.admin = !!adm.data;
  PROG.adminExiste = existe.error ? null : !!existe.data;
  try { const vr = await c.from("variantes_joueur").select("variante,choisie"); PROG.variantes = vr.error ? {} : Object.fromEntries((vr.data || []).map(x => [x.variante, {choisie:x.choisie}])); } catch(e) { PROG.variantes = {}; }
  // Les joueurs utilisent toujours les cartes officielles du site, jamais une copie modifiée dans leur navigateur
  if(!window.claude && !PROG.admin && CONFIG_SITE_PRET){
    const officielle = CONFIG_SITE ? fusionner(CONFIG_SITE) : copie(DEFAUT);
    if(JSON.stringify(officielle.cartes)!==JSON.stringify(CONFIG.cartes)) sauvegarderAvantChangement(CONFIG);
    CONFIG = officielle; CONFIG.repare = 1;
    appliquerConfig(); sauver();
  }
}

async function verifierRecompense(){
  if(!PROG.pret || !S || S.vainqueur===null || !S.idPartie || S.tuto || est2v2()) return;
  if(PROG.recompensees.has(S.idPartie)) return;
  const cle = S.idPartie;
  PROG.recompensees.add(cle);
  try { localStorage.setItem("parties-recompensees", JSON.stringify([...PROG.recompensees].slice(-60))); } catch(e) {}
  const ticket = S.ticket, hoteOuSeul = !(S.mode==="enligne" && EN.role!=="hote");
  if(S.mode==="duo"){ if(ticket) enregistrerDuel().catch(() => {}); return; }
  try {
    if(!ticket) throw new Error(S.ticketErreur || "Ticket de partie manquant.");
    if(hoteOuSeul) await enregistrerDuel();
    // L’invité attend que l’hôte ait enregistré la partie
    let gain = null;
    for(let essai=0; ; essai++){
      try { const r = await rpc("fin_partie_ticket", {p_ticket:ticket}); if(r && r.erreur) throw new Error(r.erreur); gain = r ? r.gain : 0; break; }
      catch(e) { if(/pas encore enregistrée/.test(e.message) && essai<5){ await new Promise(r => setTimeout(r, 1500*(essai+1))); continue; } throw e; }
    }
    PROG.dernierGain = {cle, gain};
    await rafraichir();
    chargerMesStats(true);
  } catch(e) { PROG.dernierGain = {cle, gain:0, erreur:messageServeur(e.message)}; }
  if(S && S.idPartie===cle) renderCouche();
}
function htmlGainFin(){
  if(PROG.actif && S && S.mode==="duo") return `<p class="aide">Les parties à deux sur le même écran ne comptent pas pour les quêtes, les trophées et les récompenses.</p>`;
  if(!PROG.actif || !S || S.mode==="duo") return "";
  const g = PROG.dernierGain;
  if(!g || g.cle!==S.idPartie) return `<p class="attente">Calcul des récompenses…</p>`;
  if(g.erreur) return `<p class="avertissement">Pas de récompense : ${esc(String(g.erreur).replace(/\.+$/, ""))}.</p>`;
  const st = S.stats ? S.stats[vue()] : null;

}

function filtrerCartes(seulementPossedees){
  const f = PROG.filtres;
  return trierCartesProg(Object.keys(CARTES).filter(id => {
    const d = CARTES[id];
    if(!estCollectionnable(d)) return false;
    if((seulementPossedees || f.possedees) && !PROG.collection[id]) return false;
    if(f.fac!=="toutes" && d.faction!==f.fac) return false;
    if(f.rar!=="toutes" && (d.rarete || "commune")!==f.rar) return false;
    if(f.type!=="tous" && d.type!==f.type) return false;
    if(f.cout && coutTranche(id)!==f.cout) return false;
    return !f.rech || d.nom.toLowerCase().includes(f.rech.toLowerCase());
  }));
}
function trierCartesProg(ids){
  const fac = Object.keys(FACTIONS), rar = ["commune","rare","epique","legendaire"];
  const tri = (PROG.filtres && PROG.filtres.tri) || "pantheon";
  return ids.sort((a,b) => {
    const A = CARTES[a], B = CARTES[b];
    if(tri==="cout") return ((A.prix||0) - (B.prix||0)) || (fac.indexOf(A.faction) - fac.indexOf(B.faction)) || A.nom.localeCompare(B.nom, "fr");
    if(tri==="cout-desc") return ((B.prix||0) - (A.prix||0)) || (fac.indexOf(A.faction) - fac.indexOf(B.faction)) || A.nom.localeCompare(B.nom, "fr");
    if(tri==="nom") return A.nom.localeCompare(B.nom, "fr");
    if(tri==="rarete") return (rar.indexOf(B.rarete) - rar.indexOf(A.rarete)) || ((A.prix||0) - (B.prix||0)) || A.nom.localeCompare(B.nom, "fr");
    return (fac.indexOf(A.faction) - fac.indexOf(B.faction)) || (rar.indexOf(A.rarete) - rar.indexOf(B.rarete)) || ((A.prix||0) - (B.prix||0)) || A.nom.localeCompare(B.nom, "fr");
  });
}

function renderProg(){
  const app = document.getElementById("app");
  const actif = document.activeElement;
  const cle = actif && actif.dataset && actif.dataset.prog ? actif.dataset.prog : null;
  let pos = null; try { pos = actif.selectionStart; } catch(e) {}
  const pages = {collection:pageCollection, decks:pageDecks, editeur:pageEditeur, boutique:pageBoutique, profil:pageProfil};
  const defil = {}; app.querySelectorAll(".grille-atelier, .liste-atelier, .atelier-deck").forEach(el => { defil[el.className.split(" ")[0]] = el.scrollTop; });
  const yPage = window.scrollY;
  app.innerHTML = PROG.pret ? pages[ui.ecran]() : `${entete(NOM_JEU)}<p class="attente">Chargement…</p>`;
  app.querySelectorAll(".grille-atelier, .liste-atelier, .atelier-deck").forEach(el => { const v = defil[el.className.split(" ")[0]]; if(v) el.scrollTop = v; });
  if(ui.ecran!=="boutique" && Math.abs(window.scrollY - yPage)>1) window.scrollTo(0, yPage);
  signaler();
  if(PROG.paquet) PROG.paquet.anim = new Set();
  document.getElementById("couche").innerHTML = ui.ecran==="collection" && PROG.zoom ? htmlZoom() : "";
  if(cle){ const el = app.querySelector(`[data-prog="${cle}"]`); if(el){ el.focus(); if(pos!=null) try { el.setSelectionRange(pos, pos); } catch(e) {} } }
}

function actionProg(act, id){
  if(act.startsWith("compte-")) return actionCompte(act);
  if(act.startsWith("porte-")) return actionPorte(act);
  switch(act){
    case "prog-reessayer": chargerProgression(); return true;
    case "prog-accueil": ui.ecran = "jeu"; S = null; PROG.paquet = null; PROG.sel = null; PROG.zoom = false; break;
    case "prog-collection": ui.ecran = "collection"; PROG.sel = null; PROG.zoom = false; PROG.choixDeck = null; break;
    case "prog-decks": ui.ecran = "decks"; PROG.deckEdit = null; PROG.supprDeck = null; PROG.choixDeck = null; break;
    case "prog-boutique": ui.ecran = "boutique"; PROG.paquet = null; break;
    case "reglages-ouvrir": PROG.reglagesOuverts = true; break;
    case "reglages-fermer": PROG.reglagesOuverts = false; break;
    case "prog-profil": ui.ecran = "profil"; PROG.formPseudo = null; chargerMesStats(false).then(() => { if(ui.ecran==="profil") renderProg(); }); break;
    case "pseudo-sauver": {
      const v = (PROG.formPseudo ?? (PROG.profil && PROG.profil.pseudo) ?? "").trim();
      action(async () => { await rpc("definir_pseudo", {p:v}); PROG.formPseudo = null; }, "Pseudo enregistré.");
      return true;
    }
    case "jouer-ia": case "jouer-duo": PROG.choixDeck = {mode: act==="jouer-ia" ? "ia" : "duo"}; break;
    case "jouer-2v2": if(!mode2v2Visible()) return true; PROG.choixDeck = {mode:"2v2"}; break;
    case "choix-retour": PROG.choixDeck = null; break;
    case "bienvenue-suite": PROG.accueilEtape = Math.min(3, (PROG.accueilEtape || 1) + 1); PROG.accueilAnimer = true; break;
    case "bienvenue-fermer": PROG.accueilEtape = null; break;
    case "bienvenue-boutique": PROG.accueilEtape = null; ui.ecran = "boutique"; PROG.paquet = null; break;
    case "bienvenue-jouer": PROG.accueilEtape = null; PROG.choixDeck = {mode:"ia"}; break;
    case "bienvenue-tuto": PROG.accueilEtape = null; lancerTuto(); return true;
    case "choix-lancer": lancerAvecDecks(); return true;
    case "quete-reclamer": action(async () => {
      const g = await rpc("reclamer_quete");
      if(g===-1) throw new Error("La quête du jour n’est pas encore terminée.");
      if(g===-2) throw new Error("La quête du jour a déjà été récompensée.");
      await chargerQuete(); return g;
    }, g => `+${g} or : quête du jour réussie !`); return true;
    case "col-sel": PROG.zoomV = undefined; PROG.zoomVersion = null; PROG.sel = id; PROG.zoom = true; PROG.zoomAnim = true; break;
    case "zoom-rien": return true;
    case "zoom-fermer": PROG.zoom = false; break;
    case "zoom-prec": case "zoom-suiv": {
      const l = filtrerCartes(false), i = l.indexOf(PROG.sel);
      if(l.length) PROG.sel = l[(i + (act==="zoom-suiv" ? 1 : -1) + l.length) % l.length];
      break;
    }
    case "col-fabriquer": action(() => rpc("fabriquer", {c:id}), `${CARTES[id].nom} ajoutée à votre collection.`); return true;
    case "col-recycler": action(() => rpc("recycler", {c:id}), g => `+${g} encre.`); return true;
    case "deck-nouveau": PROG.deckEdit = {id:null, nom:"Nouveau deck", cartes:[]}; ui.ecran = "editeur"; break;
    case "deck-modifier": { const d = PROG.decks.find(x => x.id===id); if(d){ PROG.deckEdit = {id:d.id, nom:d.nom, cartes:[...(d.cartes || [])]}; ui.ecran = "editeur"; } break; }
    case "deck-dupliquer": { const d = PROG.decks.find(x => x.id===id); if(d) action(async () => { const { error } = await sbc().from("decks").insert({nom:d.nom + " (copie)", cartes:d.cartes}); if(error) throw new Error(error.message); }, "Deck dupliqué."); return true; }
    case "deck-suppr": PROG.supprDeck = id; break;
    case "deck-suppr-non": PROG.supprDeck = null; break;
    case "deck-suppr-ok": PROG.supprDeck = null; action(async () => { const { error } = await sbc().from("decks").delete().eq("id", id); if(error) throw new Error(error.message); }, "Deck supprimé."); return true;
    case "deck-ajouter": {
      const e = PROG.deckEdit, n = compter(e.cartes)[id] || 0, d = CARTES[id];
      if(e.cartes.length >= REGLES.tailleDeck) erreur(`Le deck contient déjà ${REGLES.tailleDeck} cartes.`);
      else if(n >= maxCopies(id)) erreur(d.rarete==="legendaire" ? "Une seule légendaire de chaque sorte par deck." : `${maxCopies(id)} exemplaires au maximum par carte.`);
      else if(n >= (PROG.collection[id] || 0)) erreur(`Vous ne possédez que ${PROG.collection[id] || 0} ${d.nom}.`);
      else e.cartes.push(id);
      break;
    }
    case "filtre": {
      const [k, v] = String(id).split(":");
      if(k==="cout") PROG.filtres.cout = PROG.filtres.cout===Number(v) ? null : Number(v);
      else PROG.filtres[k] = PROG.filtres[k]===v ? (k==="type" ? "tous" : "toutes") : v;
      break;
    }
    case "filtre-masquer": PROG.filtres.masquerMax = !PROG.filtres.masquerMax; break;
    case "filtres-raz": Object.assign(PROG.filtres, {fac:"toutes", rar:"toutes", type:"tous", rech:"", cout:null}); break;
    case "edit-onglet": PROG.ongletEditeur = id; break;
    case "deck-completer": completerDeck(); break;
    case "deck-vider": if(confirm("Retirer toutes les cartes de ce deck ?")) PROG.deckEdit.cartes = []; break;
    case "deck-retirer": { const e = PROG.deckEdit, i = e.cartes.lastIndexOf(id); if(i>=0) e.cartes.splice(i, 1); break; }
    case "deck-sauver": {
      const e = PROG.deckEdit, nom = (e.nom || "").trim() || "Deck sans nom";
      action(async () => {
        const c = sbc();
        const r0 = await rpc("sauver_deck", {p_id:e.id || null, p_nom:nom, p_cartes:e.cartes});
        const r = r0 && r0.erreur ? {error:{message:r0.erreur}} : {error:null};
        if(r.error) throw new Error(r.error.message);
        ui.ecran = "decks"; PROG.deckEdit = null;
      }, "Deck enregistré.");
      return true;
    }
    case "paquet-acheter": {
      const avant = {...PROG.collection}, f = id && FACTIONS[id] ? id : null;
      const bid = id && String(id).startsWith("b:") ? String(id).slice(2) : null, bs = bid && CONFIG.boosters ? CONFIG.boosters[bid] : null;
      action(async () => {
        const cartes = await rpc("ouvrir_paquet", bid ? {p_booster:bid} : f ? {p_faction:f} : {});
        PROG.paquet = {cartes, faction:f, titre: bs ? (bs.nom || "Booster spécial") : f ? `Paquet ${FACTIONS[f].m}` : "Paquet classique",
                       reveles:new Set(), anim:new Set(), nouvelles:new Set(cartes.filter(c => !avant[c]))};
        try { window.scrollTo({top:0, behavior:"auto"}); } catch(e) {}
      });
      return true;
    }
    case "quete-jour-reclamer": action(async () => { const r = await rpc("reclamer_quete_jour", {p_id:id}); if(r && r.erreur) throw new Error(r.erreur); await chargerQuete(); await rafraichir(); return r.gain; }, g => `+${g} or : quête réussie !`); return true;
    case "quete-remplacer": action(async () => { const r = await rpc("remplacer_quete", {p_id:id}); if(r && r.erreur) throw new Error(r.erreur); await chargerQuete(); }, "Quête remplacée."); return true;
    case "trophee-reclamer": {
      const [t, p] = String(id).split("|");
      action(async () => { const r = await rpc("reclamer_trophee", {p_trophee:t, p_palier:Number(p)}); if(r && r.erreur) throw new Error(r.erreur); await Promise.all([chargerTrophees(), chargerPaquetsOfferts(), rafraichir()]); return r; },
             r => r.or ? `+${r.or} or !` : `${(r.paquets || []).map(NOM_PAQUET).join(" et ")} offert${(r.paquets || []).length>1 ? "s" : ""} : à ouvrir dans la boutique !`);
      return true;
    }
    case "paquet-offert": {
      const avant = {...PROG.collection}, f = id && FACTIONS[id] ? id : null;
      action(async () => {
        const cartes = await rpc("ouvrir_paquet", {p_faction:f, p_offert:true});
        PROG.paquet = {cartes, faction:f, titre:`${NOM_PAQUET(id)} (offert)`, reveles:new Set(), anim:new Set(), nouvelles:new Set(cartes.filter(c => !avant[c]))};
        await chargerPaquetsOfferts();
        try { window.scrollTo({top:0, behavior:"auto"}); } catch(e) {}
      });
      return true;
    }
    case "col-variante-voir": PROG.zoomV = id || null; break;
    case "col-version-voir": PROG.zoomVersion = id || null; break;
    case "col-variante-choisir": {
      const [carte, vid] = String(id).split("|");
      action(async () => { await rpc("choisir_variante", {p_carte:carte, p_variante:vid || null}); PROG.zoomV = undefined; }, "Illustration mise à jour.");
      return true;
    }
    case "paquet-reveler": if(PROG.paquet){ PROG.paquet.anim = new Set([Number(id)]); PROG.paquet.reveles.add(Number(id)); } break;
    case "paquet-tout": if(PROG.paquet){ PROG.paquet.anim = new Set(PROG.paquet.cartes.map((_, i) => i).filter(i => !PROG.paquet.reveles.has(i))); PROG.paquet.cartes.forEach((_, i) => PROG.paquet.reveles.add(i)); } break;
    case "paquet-fermer": PROG.paquet = null; break;
    default: return false;
  }
  render();
  return true;
}
document.addEventListener("input", e => {
  const el = e.target, k = el.dataset && el.dataset.prog;
  if(!k) return;
  if(k==="d1" || k==="d2"){ if(PROG.choixDeck) PROG.choixDeck[k] = el.value; return; }
  if(k==="deckEnLigne"){ EN.deckId = el.value; return; }
  if(k==="nomDeck"){ if(PROG.deckEdit) PROG.deckEdit.nom = el.value; return; }
  if(k==="pseudo"){ PROG.formPseudo = el.value; return; }
  if(k==="possedees") return;
  if(k in PROG.filtres){ PROG.filtres[k] = el.value; renderProg(); }
});
document.addEventListener("keydown", e => {
  if(!PROG.zoom || ui.ecran!=="collection") return;
  if(e.key==="Escape") actionProg("zoom-fermer");
  else if(e.key==="ArrowRight") actionProg("zoom-suiv");
  else if(e.key==="ArrowLeft") actionProg("zoom-prec");
});
document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset && el.dataset.prog==="possedees"){ PROG.filtres.possedees = el.checked; renderProg(); }
});

function traduireErreur(m){
  const t = String(m || "");
  if(/invalid login credentials/i.test(t)) return "Adresse e-mail ou mot de passe incorrect.";
  if(/already (been )?registered|already exists|email_exists|user_already_exists/i.test(t)) return "Un compte existe déjà avec cette adresse : connectez-vous, ou utilisez « Mot de passe oublié ».";
  if(/rate limit|too many/i.test(t)) return "Trop d’e-mails envoyés pour le moment : réessayez un peu plus tard.";
  if(/at least \d+ characters|weak|password should/i.test(t)) return "Mot de passe trop faible : utilisez au moins 8 caractères, avec des lettres et des chiffres.";
  if(/not confirmed/i.test(t)) return "Confirmez d’abord votre adresse avec le lien reçu par e-mail.";
  if(/invalid.*email|email.*invalid/i.test(t)) return "Cette adresse e-mail n’est pas valide.";
  if(/not authorized|address not authorized/i.test(t)) return "Le serveur d’e-mails du jeu n’est pas encore configuré pour cette adresse. Prévenez l’administrateur du jeu.";
  if(/same.*password|different from the old/i.test(t)) return "Le nouveau mot de passe doit être différent de l’ancien.";
  return t || "Une erreur est survenue. Réessayez.";
}

async function actionCompteAsync(act){
  const sb = sbc(), f = PROG.formCompte;
  const email = (f.email || "").trim().toLowerCase();
  const tenter = async fn => {
    PROG.occupe = true; renderCouche();
    try { await fn(); } catch(e) { erreur(traduireErreur(e && e.message)); }
    finally { PROG.occupe = false; renderCouche(); }
  };
  switch(act){
    case "compte-envoyer-lien": case "compte-renvoyer": {
      const adresse = act==="compte-renvoyer" ? (PROG.user && PROG.user.new_email) : email;
      if(!emailValide(adresse || "")) return erreur("Cette adresse e-mail n’est pas valide.");
      return tenter(async () => {
        const { error } = await sb.auth.updateUser({email:adresse}, {emailRedirectTo:urlRetour()});
        if(error) throw error;
        await chargerUtilisateur();
        if(PROG.user && PROG.user.email) PROG.compteVue = "mdp";
        else { PROG.compteVue = "info"; PROG.infoEmail = adresse; }
      });
    }
    case "compte-login":
      if(!emailValide(email)) return erreur("Cette adresse e-mail n’est pas valide.");
      if(!f.mdp) return erreur("Indiquez votre mot de passe.");
      return tenter(async () => {
        const { data, error } = await sb.auth.signInWithPassword({email, password:f.mdp});
        if(error) throw error;
        EN.monId = data.user.id;
        await chargerUtilisateur();
        await rpc("initialiser_joueur");
        await rafraichir();
        PROG.compteVue = null; PROG.formCompte = {email:"", mdp:"", mdp2:""};
        erreur("Connexion réussie : votre progression est chargée.");
        render();
      });
    case "compte-envoyer-oubli":
      if(!emailValide(email)) return erreur("Cette adresse e-mail n’est pas valide.");
      return tenter(async () => {
        const { error } = await sb.auth.resetPasswordForEmail(email, {redirectTo:urlRetour()});
        if(error) throw error;
        PROG.compteVue = "info"; PROG.infoEmail = email;
      });
    case "compte-definir-mdp":
      if((f.mdp || "").length < 8 || !/[a-z]/i.test(f.mdp) || !/\d/.test(f.mdp)) return erreur("Utilisez au moins 8 caractères, avec des lettres et des chiffres.");
      if(f.mdp!==f.mdp2) return erreur("Les deux mots de passe ne sont pas identiques.");
      return tenter(async () => {
        const { error } = await sb.auth.updateUser({password:f.mdp, data:{mdp:true}});
        if(error) throw error;
        await chargerUtilisateur();
        PROG.compteVue = null; PROG.recuperation = false; PROG.formCompte = {email:"", mdp:"", mdp2:""};
        erreur("Mot de passe enregistré : votre progression est sauvegardée en ligne.");
        render();
      });
    case "compte-deco-ok":
      return tenter(async () => { await sb.auth.signOut(); location.reload(); });
  }
}
function actionCompte(act){
  switch(act){
    case "compte-sauver": PROG.compteVue = "sauver"; break;
    case "compte-connexion": PROG.compteVue = "connexion"; break;
    case "compte-oubli": PROG.compteVue = "oubli"; break;
    case "compte-choisir-mdp": PROG.compteVue = "mdp"; break;

// Présence : un signal toutes les 45 secondes, et à chaque changement d’écran
let dernierEcranSignale = null, minuteurSignal = null;
function signaler(force){
  if(!PROG.pret || document.hidden) return;
  const e = ecranActuel();
  if(!force && e===dernierEcranSignale) return;
  dernierEcranSignale = e;

}

// ----- Enregistrement d’une partie terminée
// ----- Sécurité : chaque partie est ouverte par le serveur, qui lui donne un ticket
function assurerTicket(){
  if(!PROG.pret || !S || est2v2() || S.tuto || S.ticket || S.ticketDemande || S.vainqueur!==null) return;
  if(S.mode==="enligne" && EN.role!=="hote") return;   // l’hôte demande le ticket pour les deux joueurs
  S.ticketDemande = true;
  const id = S.idPartie;
  rpc("commencer_partie", S.mode==="enligne" ? {p_mode:"enligne", p_invite:EN.inviteId} : {p_mode:S.mode})
    .then(t => { if(!(S && S.idPartie===id)) return; if(!t){ S.ticketErreur = "le serveur a refusé d’ouvrir la partie (trop de parties en une heure ?)"; return; } S.ticket = t; if(enLigne() && EN.role==="hote") publier(); })
    .catch(e => { if(S && S.idPartie===id) S.ticketErreur = e.message; });
}
const messageServeur = m => /trop courte/i.test(m) ? "partie trop courte (moins de 2 minutes) : elle n’est pas comptée"
  : /Trop de parties/i.test(m) ? "trop de parties commencées en une heure"
  : /ticket|Ticket/.test(m) ? "partie non enregistrée par le serveur" : m;
// Une partie = deux camps, enregistrés ensemble et une seule fois :
// contre l’ordinateur, le joueur enregistre son camp et celui de l’ordinateur ;
// en ligne, l’hôte enregistre les deux joueurs ; à deux sur un écran, les deux camps sont « locaux ».
// Les versions de dévotion comptent comme leur carte de base dans les statistiques envoyées au serveur
function versionsVersBase(o){
  const r = {};
  for(const [k, n] of Object.entries(o || {})){ const b = (CARTES[k] && CARTES[k].versionDe) || k; r[b] = (r[b] || 0) + n; }
  return r;
}
async function enregistrerDuel(){
  if(!S.ticket) throw new Error(S.ticketErreur || "Ticket de partie manquant.");
  const camp = i => {
    const st = (S.stats && S.stats[i]) || {};
    return {heros:S.joueurs[i].heros || null,
            degats:st.degats || 0, soins:st.soins || 0, creatures:st.creatures || 0, sorts:st.sorts || 0,
            achats:st.achats || 0, pouvoirs:st.pouvoirs || 0, jouees:versionsVersBase(st.jouees), achetees:versionsVersBase(st.achetees)};
  };
  const nomV = S.vainqueur, v = nomV===S.joueurs[0].nom ? 0 : nomV===S.joueurs[1].nom ? 1 : null;
  const d = {id_partie:S.ticket, mode:S.mode, vainqueur:v, tours:S.tour, cotes:[camp(0), camp(1)]};
  for(let essai=0; ; essai++){
    try { const refus = await rpc("enregistrer_duel", {d}); if(refus) throw new Error(refus); return; }
    catch(e) { if(essai>=2 || /ticket|Ticket|courte|invalides|mode|expiré|Connexion/.test(e.message)) throw e; await new Promise(r => setTimeout(r, 1500*(essai+1))); }
  }
}

  const nouveaux = [];
  for(const t of TROPHEES){

function messageScriptManquant(msg){
  const t = String(msg || "");
  if(!/function|does not exist|schema cache/i.test(t)) return t;
  const m = t.match(/function\s+(?:public\.)?(\w+)/i);
  const nom = m ? m[1] : null, script = nom && SCRIPTS_FONCTIONS[nom];
  return script ? `Il manque la fonction « ${nom} » sur le serveur : exécutez ${script} dans Supabase (SQL Editor, puis Run). Détail : ${t}`
                : `Une fonction manque sur le serveur. Détail : ${t}`;
}

  if(!date) return "jamais";
  const s = Math.max(0, Math.round((Date.now() - Date.parse(date))/1000));
  if(s < 60) return `il y a ${s} s`;
  if(s < 3600) return `il y a ${Math.round(s/60)} min`;
  if(s < 86400) return `il y a ${Math.round(s/3600)} h`;
  return `il y a ${Math.round(s/86400)} j`;
}

async function entrerJeu(){
  PROG.porte = false; PROG.erreur = ""; render();
  try {
    const { data } = await sbc().auth.getSession();
    const s = data && data.session;
    if(s){ EN.db = "supabase"; EN.monId = s.user.id; }
    await chargerUtilisateur();
    const init = await rpc("initialiser_joueur");
    await rafraichir();
    if(init && init.nouveau){
      PROG.cartesOffertes = Object.entries(PROG.collection).flatMap(([id, n]) => Array(n).fill(id));
      await creerDeckDepart(); await rafraichir();
      PROG.accueilEtape = 1; PROG.accueilAnimer = true;
    }
    // Pseudo choisi à l’inscription
    const ps = PROG.user && PROG.user.user_metadata && PROG.user.user_metadata.pseudo;
    if(ps && PROG.profil && !PROG.profil.pseudo){
      try { await rpc("definir_pseudo", {p:ps}); await rafraichir(); }
      catch(e) { setTimeout(() => erreur(`Le pseudo « ${ps} » est déjà pris : choisissez-en un autre dans votre profil.`), 1500); }
