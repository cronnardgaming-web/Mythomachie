    <div class="actions" style="margin-top:20px">${retour}</div></div>`;
}
function actionEnLigne(act, id){
  switch(act){
    case "en-ligne": EN.ecran = "choix"; EN.erreurMenu = ""; if(EN.db) chargerReprises(); break;
    case "en-retour": quitterEnLigne(); break;
    case "en-creer": creerPartie(); return;
    case "en-rejoindre": rejoindre(); return;
    case "en-reprendre": reprendre(id); return;
    case "en-copier":
      if(navigator.clipboard) navigator.clipboard.writeText(EN.code).then(() => erreur("Code copié."), () => erreur(`Code : ${EN.code}`));
      else erreur(`Code : ${EN.code}`);
      return;
    case "en-annuler":
      if(EN.role==="hote" && EN.code && !EN.inviteId) EN.db.doc(`salle/${EN.code}`).set({hote:EN.monId, statut:"annulee", cree:Date.now()}).catch(() => {});
      quitterEnLigne(); EN.ecran = "choix"; if(EN.db) chargerReprises(); break;
  }
  renderCouche();
}
document.addEventListener("input", e => {
  if(e.target.dataset && e.target.dataset.en==="code") EN.saisie = e.target.value;
});
document.addEventListener("keydown", e => {
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.en==="code"){ EN.saisie = e.target.value; rejoindre(); }
});

/* Bulles d’aide au survol */
let bulleCible = null;
function cacherBulle(){ bulleCible = null; document.getElementById("bulle").classList.remove("visible"); }
document.addEventListener("mouseover", e => {
  const el = e.target.closest && e.target.closest("[data-aide]");
  if(el===bulleCible) return;
  if(!el){ cacherBulle(); return; }
  bulleCible = el;
  const b = document.getElementById("bulle");
  const texte = el.dataset.aide==="carte" ? el.dataset.texte : TEXTES_AIDE[el.dataset.aide];
  if(!texte){ cacherBulle(); return; }
  b.innerHTML = `<b>${esc(el.dataset.titre || "")}</b>${esc(texte)}`;
  const r = el.getBoundingClientRect(), w = b.offsetWidth, hb = b.offsetHeight;
  let top = r.top - hb - 8; if(top < 8) top = r.bottom + 8;
  const left = Math.min(Math.max(8, r.left + r.width/2 - w/2), window.innerWidth - w - 8);
  b.style.transform = `translate(${Math.round(left)}px, ${Math.round(top)}px)`;
  b.classList.add("visible");
});
document.addEventListener("scroll", cacherBulle, true);
document.addEventListener("pointerdown", cacherBulle, true);

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(act==="mode-ia" || act==="mode-duo"){
    nouvellePartie(act==="mode-ia" ? "ia" : "duo");
    Object.assign(ui, {attaquant:null, armeEnAttente:null, choixPierre:null, aiEnCours:false, couvert: act==="mode-duo"});
    return apresAction();
  }
  if(act==="nouvelle"){ if(enLigne() || EN.role) quitterEnLigne(); S = null; ui.couvert = false; ui.aiEnCours = false; return render(); }
  if(act.startsWith("en-")) return actionEnLigne(act, id);
  if(ui.ecran==="admin" || act==="admin"){ return actionAdmin(act, id, el); }
  if(actionProg(act, id)) return;
  if(act==="rejouer" && enLigne()){ if(EN.role==="hote") revancheHote(); return; }
  if(act==="rejouer"){
    const mode = S.mode;
    nouvellePartie(mode);
    Object.assign(ui, {attaquant:null, armeEnAttente:null, choixPierre:null, aiEnCours:false, couvert: mode==="duo"});
    return apresAction();
  }
  if(act==="commencer"){ ui.couvert = false; return render(); }
  if(!S) return;
  if(act==="ban"){ M().bannir(id); return apresAction(); }
  if(act==="ban-stop"){ if(enLigne() && EN.role==="invite") S.bannirEnAttente = 0; M().bannirStop(); return apresAction(); }
  if(act==="annuler"){ ui.attaquant = null; ui.armeEnAttente = null; ui.choixPierre = null; return render(); }
  if(act==="pierre-or" || act==="pierre-sac"){
    M().jouer(ui.choixPierre, {sacrifierDirect: act==="pierre-sac"}); ui.choixPierre = null; return apresAction();
  }
  if(!interactif()) return;
  const j = S.joueurs[S.courant];
  switch(act){
    case "main": {
      const c = j.main.find(x => x.uid===id); if(!c) break;
      const d = def(c);
      ui.attaquant = null;
      if(d.type==="arme"){
        if(!j.plateau.length) erreur("Posez d’abord une créature à équiper.");
        else ui.armeEnAttente = id;
      } else if(d.choixSacrifice) ui.choixPierre = id;
      else M().jouer(id);
      break;
    }
    case "own": {
      if(ui.armeEnAttente){ M().jouer(ui.armeEnAttente, {cible:id}); ui.armeEnAttente = null; break; }
      const c = j.plateau.find(x => x.uid===id); if(!c) break;
      if(c.peutAttaquer && !c.aAttaque) ui.attaquant = ui.attaquant===id ? null : id;
      else erreur(c.aAttaque ? "Cette créature a déjà attaqué ce tour." : "Une créature ne peut pas attaquer le tour où elle arrive, sauf avec Rapidité.");
      break;
    }
    case "enemy": case "face": {
      const cible = act==="face" ? "face" : id;
      if(ui.attaquant){
        const t = cibles(S.courant);
        if(cible==="face" ? !t.face : !t.creatures.has(cible)) erreur(raisonRefus(S.courant, cible));
        else M().attaquer(ui.attaquant, cible);
        ui.attaquant = null;
      }
      else if(j.combat>0){
        const t = cibles(S.courant);
        if(cible==="face" ? !t.face : !t.creatures.has(cible)) erreur(raisonRefus(S.courant, cible));
        else M().utiliserCombat(cible);
      }
      else erreur("Sélectionnez une de vos créatures prêtes, ou gagnez de la puissance avec vos cartes pour que votre héros attaque.");
      break;
    }
    case "marche": {
      const c = S.marche[Number(id)];
      if(c && j.or < def(c).prix) erreur(`Il vous faut ${def(c).prix} or pour acheter ${def(c).nom}.`);
      else M().acheter(Number(id));
      break;
    }
    case "base": {
      const b = CARTES[REGLES.carteBase];
      if(b && j.or < (b.prix || 0)) erreur(`Il vous faut ${b.prix} or pour ${b.nom}.`);
      else M().acheter("base");
      break;
    }
    case "sac": M().sacrifier(id); break;
    case "pouvoir": M().activerPouvoir(); break;
    case "fin":
      ui.attaquant = null; ui.armeEnAttente = null;
      M().finTour();
      if(S.mode==="duo") ui.couvert = true;
      break;
  }
  apresAction();
});

// Site autonome (GitHub Pages) : un fichier config.json placé à côté du jeu
// devient la configuration de tous les joueurs.
async function chargerFichierConfig(){
  if(window.claude) return;
  try {
    const r = await fetch("config.json", {cache:"no-store"});
    if(!r.ok) return;
    const fichier = await r.json();
    let local = null;
    try { local = JSON.parse(localStorage.getItem(CLE_STOCKAGE)); } catch(e) { local = null; }
    // repare : les navigateurs touchés par l’erreur de mise à jour (héros) rechargent config.json une fois
    if(!local || (fichier.exporte || 0) > (local.exporte || 0) || !local.repare){
      sauvegarderAvantChangement(local);
      CONFIG = fusionner(fichier); CONFIG.repare = 1; appliquerConfig(); sauver();
      if(!S) render();
    }
  } catch(e) { /* pas de config.json : on garde les cartes d’origine */ }
}

const QUETES = [

  {texte:"Infliger 40 dégâts à l’adversaire", cle:"degats", but:40},

function progresQuete(){ try { return JSON.parse(localStorage.getItem("quete-" + jourISO())) || {}; } catch(e) { return {}; } }
function ajouterProgresQuete(st, victoire){
  const p = progresQuete();
  for(const k of ["creatures","achats","degats","sorts"]) p[k] = (p[k] || 0) + ((st && st[k]) || 0);
  p.parties = (p.parties || 0) + 1;

const sbc = () => window.__supa && window.__supa.client();
async function rpc(nom, args){
  const { data, error } = await sbc().rpc(nom, args || {});
  if(error) throw new Error(error.message);
  return data;
}
const estCollectionnable = d => !!d && !d.depart && !d.base && !d.jeton;
const maxCopies = id => CARTES[id] && CARTES[id].rarete==="legendaire" ? REGLES.copiesLegendaire : REGLES.copiesMax;
const compter = ids => ids.reduce((m, i) => (m[i] = (m[i] || 0) + 1, m), {});
function problemesDeck(ids){
  const p = [], t = REGLES.tailleDeck, n = ids.length;
  if(n < t) p.push(`Il manque ${t-n} carte${t-n>1 ? "s" : ""}.`);
  if(n > t) p.push(`Il y a ${n-t} carte${n-t>1 ? "s" : ""} en trop.`);
  for(const [id, k] of Object.entries(compter(ids))){
    const d = CARTES[id];
    if(!estCollectionnable(d)){ p.push(`${d ? d.nom : id} n’est plus disponible.`); continue; }
    if(k > maxCopies(id)) p.push(`Trop d’exemplaires de ${d.nom} (${k} sur ${maxCopies(id)} autorisés).`);
    if(k > (PROG.collection[id] || 0)) p.push(`Vous ne possédez que ${PROG.collection[id] || 0} ${d.nom}.`);
  }
  return p;
}
const decksValides = () => PROG.decks.filter(d => problemesDeck(d.cartes || []).length===0);

async function rafraichir(){
  const c = sbc();
  const [p, col, dk, eco, adm] = await Promise.all([
    c.from("profils").select("*").maybeSingle(),
    c.from("collection").select("carte,nb"),
    c.from("decks").select("*").order("maj", {ascending:false}),
    c.from("economie").select("reglages").maybeSingle(),
    c.rpc("est_admin")
  ]);
  for(const r of [p, col, dk, eco]) if(r.error) throw new Error(r.error.message);
  PROG.profil = p.data;
  PROG.collection = Object.fromEntries((col.data || []).filter(r => r.nb > 0).map(r => [r.carte, r.nb]));
  PROG.decks = dk.data || [];
  PROG.eco = eco.data ? eco.data.reglages : null;
  PROG.admin = !!adm.data;
}
async function creerDeckDepart(){
  const ids = [];
  for(const [id, n] of Object.entries(PROG.collection)) for(let i=0; i<Math.min(n, maxCopies(id)); i++) ids.push(id);
  const { error } = await sbc().from("decks").insert({nom:"Deck de départ", cartes:ids.slice(0, REGLES.tailleDeck)});
  if(error) throw new Error(error.message);
}
async function chargerProgression(){
  if(window.claude || !window.__supa) return;
  PROG.actif = true; PROG.erreur = ""; render();
  const ok = await window.__supa.init();
  if(!ok){ PROG.erreur = "Connexion au serveur de jeu impossible. Vérifiez votre connexion internet, puis réessayez."; return render(); }
  try {
    await suiviCompte();
    const init = await rpc("initialiser_joueur");
    await rafraichir();
    if(init && init.nouveau){
      PROG.cartesOffertes = Object.entries(PROG.collection).flatMap(([id, n]) => Array(n).fill(id));
      await creerDeckDepart(); await rafraichir();
      PROG.accueilEtape = 1; PROG.accueilAnimer = true;
    }
    PROG.pret = true;
  } catch(e) {
    PROG.erreur = /function|relation|does not exist|schema cache/i.test(e.message)
      ? "Le serveur n’est pas encore prêt : exécutez le script supabase-phase4.sql dans Supabase."
      : e.message;
  }
  render();
}
async function action(fn, succes){
  if(PROG.occupe) return;

  finally { PROG.occupe = false; render(); }
}

function filtrerCartes(seulementPossedees){
  const f = PROG.filtres;
  return trierCartesProg(Object.keys(CARTES).filter(id => {
    const d = CARTES[id];
    if(!estCollectionnable(d)) return false;
    if((seulementPossedees || f.possedees) && !PROG.collection[id]) return false;
    if(f.fac!=="toutes" && d.faction!==f.fac) return false;
    if(f.rar!=="toutes" && (d.rarete || "commune")!==f.rar) return false;
    if(f.type!=="tous" && d.type!==f.type) return false;
    return !f.rech || d.nom.toLowerCase().includes(f.rech.toLowerCase());
  }));
}
function trierCartesProg(ids){
  const fac = Object.keys(FACTIONS), rar = ["commune","rare","epique","legendaire"];
  return ids.sort((a,b) => {
    const A = CARTES[a], B = CARTES[b];
    return (fac.indexOf(A.faction) - fac.indexOf(B.faction)) || (rar.indexOf(A.rarete) - rar.indexOf(B.rarete)) || ((A.prix||0) - (B.prix||0)) || A.nom.localeCompare(B.nom, "fr");
  });
}

    <select data-prog="fac" aria-label="Faction"><option value="toutes">Toutes les factions</option>${Object.entries(FACTIONS).map(([k,x]) => `<option value="${k}" ${f.fac===k ? "selected" : ""}>${esc(x.nom)}</option>`).join("")}</select>
    <select data-prog="rar" aria-label="Rareté"><option value="toutes">Toutes les raretés</option>${RARETES.map(([k,l]) => `<option value="${k}" ${f.rar===k ? "selected" : ""}>${l}</option>`).join("")}</select>
    <select data-prog="type" aria-label="Type"><option value="tous">Tous les types</option>${[["creature","Créatures"],["sort","Sorts"],["arme","Armes"]].map(([k,l]) => `<option value="${k}" ${f.type===k ? "selected" : ""}>${l}</option>`).join("")}</select>

function actionProg(act, id){
  if(act.startsWith("compte-")) return actionCompte(act);
  switch(act){
    case "prog-reessayer": chargerProgression(); return true;
    case "prog-accueil": ui.ecran = "jeu"; S = null; PROG.paquet = null; PROG.sel = null; PROG.zoom = false; break;
    case "prog-collection": ui.ecran = "collection"; PROG.sel = null; PROG.zoom = false; PROG.choixDeck = null; break;
    case "prog-decks": ui.ecran = "decks"; PROG.deckEdit = null; PROG.supprDeck = null; PROG.choixDeck = null; break;
    case "prog-boutique": ui.ecran = "boutique"; PROG.paquet = null; break;
    case "jouer-ia": case "jouer-duo": PROG.choixDeck = {mode: act==="jouer-ia" ? "ia" : "duo"}; break;
    case "choix-retour": PROG.choixDeck = null; break;
    case "bienvenue-suite": PROG.accueilEtape = Math.min(3, (PROG.accueilEtape || 1) + 1); PROG.accueilAnimer = true; break;
    case "bienvenue-fermer": PROG.accueilEtape = null; break;
    case "bienvenue-boutique": PROG.accueilEtape = null; ui.ecran = "boutique"; PROG.paquet = null; break;
    case "bienvenue-jouer": PROG.accueilEtape = null; PROG.choixDeck = {mode:"ia"}; break;
    case "choix-lancer": lancerAvecDecks(); return true;
    case "quete-reclamer": action(() => rpc("reclamer_quete"), g => `+${g} or : quête du jour réussie !`); return true;
    case "col-sel": PROG.sel = id; PROG.zoom = true; PROG.zoomAnim = true; break;
    case "zoom-rien": return true;
    case "zoom-fermer": PROG.zoom = false; break;
    case "zoom-prec": case "zoom-suiv": {
      const l = filtrerCartes(false), i = l.indexOf(PROG.sel);
      if(l.length) PROG.sel = l[(i + (act==="zoom-suiv" ? 1 : -1) + l.length) % l.length];
      break;
    }
    case "col-fabriquer": action(() => rpc("fabriquer", {c:id}), `${CARTES[id].nom} ajoutée à votre collection.`); return true;
    case "col-recycler": action(() => rpc("recycler", {c:id}), g => `+${g} encre.`); return true;
    case "deck-nouveau": PROG.deckEdit = {id:null, nom:"Nouveau deck", cartes:[]}; ui.ecran = "editeur"; break;
    case "deck-modifier": { const d = PROG.decks.find(x => x.id===id); if(d){ PROG.deckEdit = {id:d.id, nom:d.nom, cartes:[...(d.cartes || [])]}; ui.ecran = "editeur"; } break; }
    case "deck-dupliquer": { const d = PROG.decks.find(x => x.id===id); if(d) action(async () => { const { error } = await sbc().from("decks").insert({nom:d.nom + " (copie)", cartes:d.cartes}); if(error) throw new Error(error.message); }, "Deck dupliqué."); return true; }
    case "deck-suppr": PROG.supprDeck = id; break;
    case "deck-suppr-non": PROG.supprDeck = null; break;
    case "deck-suppr-ok": PROG.supprDeck = null; action(async () => { const { error } = await sbc().from("decks").delete().eq("id", id); if(error) throw new Error(error.message); }, "Deck supprimé."); return true;
    case "deck-ajouter": {
      const e = PROG.deckEdit, n = compter(e.cartes)[id] || 0, d = CARTES[id];
      if(e.cartes.length >= REGLES.tailleDeck) erreur(`Le deck contient déjà ${REGLES.tailleDeck} cartes.`);
      else if(n >= maxCopies(id)) erreur(d.rarete==="legendaire" ? "Une seule légendaire de chaque sorte par deck." : `${maxCopies(id)} exemplaires au maximum par carte.`);
      else if(n >= (PROG.collection[id] || 0)) erreur(`Vous ne possédez que ${PROG.collection[id] || 0} ${d.nom}.`);
      else e.cartes.push(id);
      break;
    }
    case "deck-retirer": { const e = PROG.deckEdit, i = e.cartes.lastIndexOf(id); if(i>=0) e.cartes.splice(i, 1); break; }
    case "deck-sauver": {
      const e = PROG.deckEdit, nom = (e.nom || "").trim() || "Deck sans nom";
      action(async () => {
        const c = sbc();
        const r = e.id ? await c.from("decks").update({nom, cartes:e.cartes, maj:new Date().toISOString()}).eq("id", e.id)
                       : await c.from("decks").insert({nom, cartes:e.cartes});
        if(r.error) throw new Error(r.error.message);
        ui.ecran = "decks"; PROG.deckEdit = null;
      }, "Deck enregistré.");
      return true;
    }
    case "paquet-acheter": {
      const avant = {...PROG.collection};
      action(async () => {
        const cartes = await rpc("ouvrir_paquet");
        PROG.paquet = {cartes, reveles:new Set(), anim:new Set(), nouvelles:new Set(cartes.filter(c => !avant[c]))};
      });
      return true;
    }
    case "paquet-reveler": if(PROG.paquet){ PROG.paquet.anim = new Set([Number(id)]); PROG.paquet.reveles.add(Number(id)); } break;
    case "paquet-tout": if(PROG.paquet){ PROG.paquet.anim = new Set(PROG.paquet.cartes.map((_, i) => i).filter(i => !PROG.paquet.reveles.has(i))); PROG.paquet.cartes.forEach((_, i) => PROG.paquet.reveles.add(i)); } break;
    case "paquet-fermer": PROG.paquet = null; break;
    default: return false;
  }
  render();
  return true;
}
document.addEventListener("input", e => {
  const el = e.target, k = el.dataset && el.dataset.prog;
  if(!k) return;
  if(k==="d1" || k==="d2"){ if(PROG.choixDeck) PROG.choixDeck[k] = el.value; return; }
  if(k==="deckEnLigne"){ EN.deckId = el.value; return; }
  if(k==="nomDeck"){ if(PROG.deckEdit) PROG.deckEdit.nom = el.value; return; }
  if(k==="possedees") return;
  if(k in PROG.filtres){ PROG.filtres[k] = el.value; renderProg(); }
});
document.addEventListener("keydown", e => {
  if(!PROG.zoom || ui.ecran!=="collection") return;
  if(e.key==="Escape") actionProg("zoom-fermer");
  else if(e.key==="ArrowRight") actionProg("zoom-suiv");
  else if(e.key==="ArrowLeft") actionProg("zoom-prec");
});
document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset && el.dataset.prog==="possedees"){ PROG.filtres.possedees = el.checked; renderProg(); }
});

async function actionServeur(act){
  switch(act){
    case "srv-copier": { const t = document.getElementById("sql-admin"); t.select(); try { await navigator.clipboard.writeText(t.value); erreur("Ligne copiée."); } catch(e) { document.execCommand("copy"); erreur("Ligne copiée."); } return; }
    case "srv-catalogue": try { const n = await rpc("admin_maj_catalogue", {cartes:CARTES}); erreur(`Catalogue envoyé : ${n} cartes.`); } catch(e) { erreur(e.message); } return;
    case "srv-eco": {
      const e = PROG.ecoEdit, s = Object.values(e.probabilites || {}).reduce((a,b) => a + Number(b||0), 0);
      if(Math.abs(s - 1) > 0.001) return erreur(`Le total des chances fait ${Math.round(s*100)} % : il doit faire 100 %.`);
      e.copies_max = REGLES.copiesMax; e.copies_legendaire = REGLES.copiesLegendaire;
      try { await rpc("admin_maj_economie", {r:e}); await rafraichir(); PROG.ecoEdit = null; erreur("Économie enregistrée."); } catch(err) { erreur(err.message); }
      return renderAdmin();
    }
    case "srv-eco-annuler": PROG.ecoEdit = null; return renderAdmin();
    case "srv-crediter": try { await rpc("admin_crediter", {p_or:1000, p_encre:1000}); await rafraichir(); erreur("+1 000 or et +1 000 encre."); } catch(e) { erreur(e.message); } return;
  }
}
document.addEventListener("input", e => {
  const el = e.target, ch = el.dataset && el.dataset.eco;
  if(!ch || !PROG.ecoEdit || el.value==="") return;
  const parts = ch.split("."); let o = PROG.ecoEdit;
  for(let i=0; i<parts.length-1; i++){ o[parts[i]] = o[parts[i]] || {}; o = o[parts[i]]; }
  o[parts.at(-1)] = ch.startsWith("probabilites") ? Number(el.value) : Math.max(0, Math.floor(Number(el.value)));
});

/* ============================================================
   COMPTES JOUEURS (site autonome)
   Un joueur commence en invité (anonyme). Pour garder sa progression
   et la retrouver ailleurs, il relie une adresse e-mail (confirmée par
   un lien), puis choisit un mot de passe. Il garde le même identifiant :
   sa collection, ses decks, son or et son encre restent les mêmes.
   ============================================================ */
PROG.user = null; PROG.compteVue = null; PROG.formCompte = {email:"", mdp:"", mdp2:""};
const urlRetour = () => location.origin + location.pathname;
async function chargerUtilisateur(){
  try { const { data } = await sbc().auth.getUser(); PROG.user = data ? data.user : null; } catch(e) { PROG.user = null; }
}
function compteEtat(){
  const u = PROG.user;
  if(!u) return "inconnu";
  if(u.email && u.user_metadata && u.user_metadata.mdp) return "complet";
  if(u.email) return "mdp";
  if(u.new_email) return "attente";
  return "invite";
}
function traduireErreur(m){
  const t = String(m || "");
  if(/invalid login credentials/i.test(t)) return "Adresse e-mail ou mot de passe incorrect.";
  if(/already (been )?registered|already exists|email_exists/i.test(t)) return "Cette adresse est déjà utilisée par un compte : connectez-vous plutôt avec « J’ai déjà un compte ».";
  if(/rate limit|too many/i.test(t)) return "Trop d’e-mails envoyés pour le moment : réessayez un peu plus tard.";
  if(/at least \d+ characters|weak|password should/i.test(t)) return "Mot de passe trop faible : utilisez au moins 8 caractères, avec des lettres et des chiffres.";
  if(/not confirmed/i.test(t)) return "Confirmez d’abord votre adresse avec le lien reçu par e-mail.";
  if(/invalid.*email|email.*invalid/i.test(t)) return "Cette adresse e-mail n’est pas valide.";
  if(/not authorized|address not authorized/i.test(t)) return "Le serveur d’e-mails du jeu n’est pas encore configuré pour cette adresse. Prévenez l’administrateur du jeu.";
  if(/same.*password|different from the old/i.test(t)) return "Le nouveau mot de passe doit être différent de l’ancien.";
  return t || "Une erreur est survenue. Réessayez.";
}
const emailValide = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);

function htmlCompte(){
  const e = compteEtat(), u = PROG.user || {};
  if(e==="complet") return `<div class="compte ok-compte"><div><b>Connecté : ${esc(u.email)}</b><p class="aide">Votre progression est sauvegardée en ligne et vous suit sur tous vos appareils.</p></div>
    <div class="actions"><button type="button" class="btn second" data-act="compte-deco">Se déconnecter</button></div></div>`;
  if(e==="mdp") return `<div class="compte alerte"><div><b>Adresse confirmée : ${esc(u.email)}</b><p class="aide">Dernière étape : choisissez un mot de passe pour pouvoir vous connecter sur un autre appareil.</p></div>
    <div class="actions"><button type="button" class="btn" data-act="compte-choisir-mdp">Choisir mon mot de passe</button></div></div>`;
  if(e==="attente") return `<div class="compte alerte"><div><b>Confirmation en attente</b><p class="aide">Un e-mail a été envoyé à <b>${esc(u.new_email)}</b>. Cliquez sur le lien qu’il contient pour confirmer votre adresse (pensez à regarder dans les courriers indésirables).</p></div>
    <div class="actions"><button type="button" class="btn second" data-act="compte-renvoyer">Renvoyer l’e-mail</button><button type="button" class="btn second" data-act="compte-sauver">Changer d’adresse</button></div></div>`;
  return `<div class="compte"><div><b>Compte invité</b><p class="aide">Votre progression n’est enregistrée que dans ce navigateur. Sauvegardez-la pour la retrouver sur un autre appareil.</p></div>
    <div class="actions"><button type="button" class="btn" data-act="compte-sauver">Sauvegarder ma progression</button><button type="button" class="btn second" data-act="compte-connexion">J’ai déjà un compte</button></div></div>`;
}
function htmlFormCompte(){
  const v = PROG.compteVue, f = PROG.formCompte, occ = PROG.occupe ? "disabled" : "";
  const champ = (cle, label, type, auto) => `<label class="champ"><span>${label}</span><input type="${type}" data-compte="${cle}" autocomplete="${auto}" value="${type==="password" ? "" : esc(f[cle] || "")}"></label>`;
  const boite = (titre, contenu) => `<div class="boite" role="dialog" aria-label="${titre}"><h2>${titre}</h2>${contenu}</div>`;
  if(v==="sauver") return boite("Sauvegarder ma progression", `
    <p>Reliez votre progression à une adresse e-mail : collection, decks, or et encre. Vous pourrez ensuite vous connecter sur n’importe quel appareil.</p>
    <ol class="etapes-liste"><li>Indiquez votre adresse e-mail.</li><li>Cliquez sur le lien de confirmation reçu par e-mail.</li><li>De retour dans le jeu, choisissez un mot de passe.</li></ol>
    ${champ("email", "Adresse e-mail", "email", "email")}
    <div class="actions" style="margin-top:14px"><button type="button" class="btn" data-act="compte-envoyer-lien" ${occ}>Envoyer le lien de confirmation</button><button type="button" class="btn second" data-act="compte-fermer">Annuler</button></div>`);
  if(v==="connexion"){
    const aDesCartes = Object.keys(PROG.collection).length > 0 && compteEtat()==="invite";
    return boite("Se connecter", `
      ${aDesCartes ? `<p class="avertissement">Sur ce navigateur, la progression actuelle de l’invité sera remplacée par celle de votre compte.</p>` : ""}
      ${champ("email", "Adresse e-mail", "email", "email")}
      <div style="height:10px"></div>${champ("mdp", "Mot de passe", "password", "current-password")}
      <div class="actions" style="margin-top:14px"><button type="button" class="btn" data-act="compte-login" ${occ}>Se connecter</button><button type="button" class="btn second" data-act="compte-fermer">Annuler</button></div>
      <p class="aide" style="margin-top:12px"><button type="button" class="lien" data-act="compte-oubli">Mot de passe oublié ?</button></p>`);
  }
  if(v==="oubli") return boite("Mot de passe oublié", `
    <p>Indiquez l’adresse de votre compte : vous recevrez un lien pour choisir un nouveau mot de passe.</p>
    ${champ("email", "Adresse e-mail", "email", "email")}
    <div class="actions" style="margin-top:14px"><button type="button" class="btn" data-act="compte-envoyer-oubli" ${occ}>Envoyer le lien</button><button type="button" class="btn second" data-act="compte-connexion">Retour</button></div>`);
  if(v==="mdp") return boite(PROG.recuperation ? "Nouveau mot de passe" : "Choisir un mot de passe", `
    <p>${PROG.recuperation ? "Choisissez votre nouveau mot de passe." : `Dernière étape pour sauvegarder votre progression sur <b>${esc((PROG.user && PROG.user.email) || "")}</b>.`} Au moins 8 caractères, avec des lettres et des chiffres.</p>
    ${champ("mdp", "Mot de passe", "password", "new-password")}
    <div style="height:10px"></div>${champ("mdp2", "Confirmez le mot de passe", "password", "new-password")}
    <div class="actions" style="margin-top:14px"><button type="button" class="btn" data-act="compte-definir-mdp" ${occ}>Enregistrer</button><button type="button" class="btn second" data-act="compte-fermer">Plus tard</button></div>`);
  if(v==="info") return boite("Vérifiez vos e-mails", `
    <p>Un e-mail vient d’être envoyé à <b>${esc(PROG.infoEmail || "")}</b>. Ouvrez-le et cliquez sur le lien : vous reviendrez dans le jeu automatiquement.</p>
    <p class="aide">Rien reçu après quelques minutes ? Regardez dans les courriers indésirables, puis réessayez.</p>
    <div class="actions"><button type="button" class="btn" data-act="compte-fermer">Compris</button></div>`);
  if(v==="deconnexion") return boite("Se déconnecter", `
    <p>Votre progression reste sauvegardée sur votre compte. Sur cet appareil, le jeu redémarrera avec un nouveau joueur invité, jusqu’à ce que vous vous reconnectiez.</p>
    <div class="actions"><button type="button" class="btn danger" data-act="compte-deco-ok" ${occ}>Se déconnecter</button><button type="button" class="btn second" data-act="compte-fermer">Annuler</button></div>`);
  return "";
}
async function actionCompteAsync(act){
  const sb = sbc(), f = PROG.formCompte;
  const email = (f.email || "").trim().toLowerCase();
  const tenter = async fn => {
    PROG.occupe = true; renderCouche();
    try { await fn(); } catch(e) { erreur(traduireErreur(e && e.message)); }
    finally { PROG.occupe = false; renderCouche(); }
  };
  switch(act){
    case "compte-envoyer-lien": case "compte-renvoyer": {
      const adresse = act==="compte-renvoyer" ? (PROG.user && PROG.user.new_email) : email;
      if(!emailValide(adresse || "")) return erreur("Cette adresse e-mail n’est pas valide.");
      return tenter(async () => {
        const { error } = await sb.auth.updateUser({email:adresse}, {emailRedirectTo:urlRetour()});
        if(error) throw error;
        await chargerUtilisateur();
        if(PROG.user && PROG.user.email) PROG.compteVue = "mdp";
        else { PROG.compteVue = "info"; PROG.infoEmail = adresse; }
      });
    }
    case "compte-login":
      if(!emailValide(email)) return erreur("Cette adresse e-mail n’est pas valide.");
      if(!f.mdp) return erreur("Indiquez votre mot de passe.");
      return tenter(async () => {
        const { data, error } = await sb.auth.signInWithPassword({email, password:f.mdp});
        if(error) throw error;
        EN.monId = data.user.id;
        await chargerUtilisateur();
        await rpc("initialiser_joueur");
        await rafraichir();
        PROG.compteVue = null; PROG.formCompte = {email:"", mdp:"", mdp2:""};
        erreur("Connexion réussie : votre progression est chargée.");
        render();
      });
    case "compte-envoyer-oubli":
      if(!emailValide(email)) return erreur("Cette adresse e-mail n’est pas valide.");
      return tenter(async () => {
        const { error } = await sb.auth.resetPasswordForEmail(email, {redirectTo:urlRetour()});
        if(error) throw error;
        PROG.compteVue = "info"; PROG.infoEmail = email;
      });
    case "compte-definir-mdp":
      if((f.mdp || "").length < 8 || !/[a-z]/i.test(f.mdp) || !/\d/.test(f.mdp)) return erreur("Utilisez au moins 8 caractères, avec des lettres et des chiffres.");
      if(f.mdp!==f.mdp2) return erreur("Les deux mots de passe ne sont pas identiques.");
      return tenter(async () => {
        const { error } = await sb.auth.updateUser({password:f.mdp, data:{mdp:true}});
        if(error) throw error;
        await chargerUtilisateur();
        PROG.compteVue = null; PROG.recuperation = false; PROG.formCompte = {email:"", mdp:"", mdp2:""};
        erreur("Mot de passe enregistré : votre progression est sauvegardée en ligne.");
        render();
      });
    case "compte-deco-ok":
      return tenter(async () => { await sb.auth.signOut(); location.reload(); });
  }
}
function actionCompte(act){
  switch(act){
    case "compte-sauver": PROG.compteVue = "sauver"; break;
    case "compte-connexion": PROG.compteVue = "connexion"; break;
    case "compte-oubli": PROG.compteVue = "oubli"; break;
    case "compte-choisir-mdp": PROG.compteVue = "mdp"; break;
    case "compte-deco": PROG.compteVue = "deconnexion"; break;
    case "compte-fermer": PROG.compteVue = null; PROG.recuperation = false; break;
    default: actionCompteAsync(act); return true;
  }
  render();
  return true;
}
// Retour depuis un lien reçu par e-mail
async function suiviCompte(){
  const sb = sbc();
  if(typeof sb.auth.onAuthStateChange==="function") sb.auth.onAuthStateChange(ev => {
    if(ev==="PASSWORD_RECOVERY"){ PROG.recuperation = true; PROG.compteVue = "mdp"; if(!S) render(); }
  });
  await chargerUtilisateur();
  const hsh = new URLSearchParams((HASH_INITIAL || "").replace(/^#/, ""));
  if(hsh.get("error_description")) erreur("Lien invalide ou expiré : " + hsh.get("error_description").replace(/\+/g, " ") + ". Demandez un nouveau lien.");
  else if(hsh.get("type")==="recovery"){ PROG.recuperation = true; PROG.compteVue = "mdp"; }
  else if(/email_change|signup/.test(hsh.get("type") || "") || /confirm/i.test(hsh.get("message") || "")){
    if(compteEtat()==="mdp") PROG.compteVue = "mdp";
    erreur("Adresse e-mail confirmée.");
  }
  if(HASH_INITIAL) try { history.replaceState(null, "", urlRetour()); } catch(e) {}
}
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.compte;
  if(k) PROG.formCompte[k] = e.target.value;
});
document.addEventListener("keydown", e => {
  const k = e.target.dataset && e.target.dataset.compte;
  if(e.key!=="Enter" || !k) return;
  PROG.formCompte[k] = e.target.value;
  const v = PROG.compteVue;
  actionCompte(v==="sauver" ? "compte-envoyer-lien" : v==="connexion" ? "compte-login" : v==="oubli" ? "compte-envoyer-oubli" : v==="mdp" ? "compte-definir-mdp" : "");
});


chargerConfig();
render();
chargerFichierConfig().then(chargerProgression);
