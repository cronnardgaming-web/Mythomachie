<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype de combat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --table:#e7e0d0; --table-2:#d9cfb9; --zone:#efe9dc;
  --ink:#2b2416; --ink-2:#615741; --line:#c3b69a; --bronze:#8a5a1f;
  --parchemin:#fbf7ec; --encre-carte:#2b2416; --bord-carte:#b9a982;
  --cible:#1f8a5b; --choix:#8a5a1f; --danger:#b3261e;
  --egy:#d4a017; --egy-ink:#2b2416;
  --hin:#c8402a; --hin-ink:#ffffff;
  --nor:#6e7b88; --nor-ink:#ffffff;
  --gre:#2d5fbf; --gre-ink:#ffffff;
  --neutre:#9a8b6c; --neutre-ink:#ffffff;
  --voile:rgba(43,36,22,.55);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --table:#1c2030; --table-2:#262b3f; --zone:#232838;
    --ink:#ede6d4; --ink-2:#b5ad99; --line:#3a4058; --bronze:#d9a35a;
    --parchemin:#f3ead5; --encre-carte:#2b2416; --bord-carte:#8f7f5c;
    --cible:#4cc38a; --choix:#e0b061; --danger:#ff7a6e;
    --voile:rgba(8,10,18,.72);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --table:#1c2030; --table-2:#262b3f; --zone:#232838;
  --ink:#ede6d4; --ink-2:#b5ad99; --line:#3a4058; --bronze:#d9a35a;
  --parchemin:#f3ead5; --encre-carte:#2b2416; --bord-carte:#8f7f5c;
  --cible:#4cc38a; --choix:#e0b061; --danger:#ff7a6e;
  --voile:rgba(8,10,18,.72);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--table);color:var(--ink);font-family:"Alegreya Sans","Gill Sans","Trebuchet MS",sans-serif;font-size:16px;line-height:1.35}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--choix);outline-offset:2px}
h1,h2{font-family:Cinzel,"Trajan Pro","Times New Roman",serif;font-weight:700;margin:0}

#app{max-width:1280px;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px}
.entete{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.entete h1{font-size:20px;letter-spacing:.02em}
.entete .mode,.entete .tour-info{color:var(--ink-2);font-size:15px}
.entete .tour-info{margin-left:auto}
.btn-discret{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn-discret:hover{border-color:var(--bronze)}

.camp{background:var(--zone);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px}
.bandeau{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.portrait{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:10px;align-items:baseline;background:var(--table-2);border:2px solid transparent;border-radius:12px;padding:8px 14px;text-align:left}
button.portrait{cursor:pointer}
.portrait .pnom{grid-column:1/3;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:15px}
.portrait .ppv{font-family:Cinzel,"Times New Roman",serif;font-size:32px;font-weight:700;line-height:1}
.portrait .plabel{color:var(--ink-2);font-size:14px}
.compteurs{display:flex;gap:14px;color:var(--ink-2);font-size:15px}
.ressources{display:flex;gap:10px}
.res{background:var(--table-2);border-radius:999px;padding:6px 14px;font-size:15px}
.res b{font-family:Cinzel,"Times New Roman",serif;font-size:22px;margin-right:4px}
.res.or b{color:var(--bronze)}
.fin{margin-left:auto;background:var(--bronze);color:var(--parchemin);border:none;border-radius:10px;padding:12px 20px;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:16px;cursor:pointer}
.fin:disabled{opacity:.45;cursor:default}

.rangee{display:flex;gap:10px;min-height:166px;align-items:center;overflow-x:auto;padding:4px}
.vide{color:var(--ink-2);font-style:italic;padding:0 8px}

.centre{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}
.marche,.journal{background:var(--zone);border:1px solid var(--line);border-radius:14px;padding:12px}
.marche h2,.journal h2{font-size:16px;margin-bottom:10px;display:flex;align-items:baseline;gap:12px}
.reste{font-family:"Alegreya Sans",sans-serif;font-weight:400;color:var(--ink-2);font-size:14px}
.marche-cartes{display:flex;gap:10px;overflow-x:auto;padding:4px;align-items:flex-start}
.separateur{width:1px;align-self:stretch;background:var(--line);margin:0 4px;flex:none}
.journal ol{list-style:none;margin:0;padding:0;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.journal li:first-child{color:var(--ink)}

/* Cartes : format TCG 63 × 88 mm, illustration 7:9 en pleine largeur */
.carte,.crea{--fc:var(--neutre);--fci:var(--neutre-ink);--lis:rgba(0,0,0,.4);--gem:transparent;container-type:inline-size;flex:none;aspect-ratio:63/88;position:relative;padding:0;border:none;background:var(--fc);color:#fff;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.28);transition:transform .15s ease, box-shadow .15s ease}
.carte{--w:160px;width:var(--w);border-radius:8px;cursor:pointer}
.crea{width:112px;border-radius:6px;cursor:default}
.cadre{position:absolute;inset:0;padding:4.5cqw;display:flex;flex-direction:column;border-radius:inherit;box-shadow:inset 0 0 0 .7cqw rgba(255,255,255,.2)}
.art{position:relative;display:block;width:100%;aspect-ratio:7/9;border-radius:2.5cqw;overflow:hidden;background:#2a2418;box-shadow:0 0 0 .9cqw var(--lis)}
.art.sans-image::before{content:"";position:absolute;inset:0;background:var(--fc);opacity:.45}
.art.sans-image::after{content:attr(data-sym);position:absolute;inset:0;display:grid;place-items:center;font-size:42cqw;color:rgba(255,255,255,.2)}
.art .illu{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nom-bande{position:absolute;left:0;right:0;top:0;z-index:1;padding:2.6cqw 20cqw 8cqw 3.5cqw;text-align:left;background:linear-gradient(rgba(12,9,5,.9),rgba(12,9,5,.6) 55%,rgba(12,9,5,0));font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:7.4cqw;line-height:1.12;color:#fff;text-shadow:0 1px 2px #000;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.carte .texte{position:absolute;left:0;right:0;bottom:0;z-index:1;max-height:64%;overflow:hidden;padding:10cqw 4cqw 6cqw;font-size:6.5cqw;line-height:1.28;color:#fff;background:linear-gradient(to top,rgba(12,9,5,.94),rgba(12,9,5,.84) 70%,rgba(12,9,5,0));text-shadow:0 1px 2px #000}
.carte .texte .mots-cles{color:#f2d48a;font-weight:700}
.pied{flex:1;display:flex;align-items:center;justify-content:center;gap:2cqw;min-width:0;padding:0 15cqw;font-size:6.2cqw;letter-spacing:.03em;color:var(--fci);white-space:nowrap}
.pied .type{overflow:hidden;text-overflow:ellipsis}
.gemme{flex:none;width:3.6cqw;height:3.6cqw;transform:rotate(45deg);background:var(--gem);box-shadow:0 0 0 .5cqw rgba(0,0,0,.35)}
.prix{position:absolute;z-index:2;top:2.4cqw;right:2.4cqw;width:16cqw;height:16cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4c2,#f0c64e 45%,#a8750f);color:#3b2a06;border:.8cqw solid #7a520a;display:grid;place-items:center;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:8.5cqw;box-shadow:0 1px 3px rgba(0,0,0,.55)}
.atk,.pv,.dur{position:absolute;z-index:2;bottom:1.6cqw;width:15cqw;height:15cqw;display:grid;place-items:center;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:8cqw;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.atk{left:2cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe6b3,#d9a14a 55%,#8a5a1f);color:#2b1a04;border:.7cqw solid #5e3b10}
.pv,.dur{right:2cqw;padding-bottom:2cqw;clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}
.pv{background:linear-gradient(#e0705c,#a3291b);color:#fff}
.pv.blesse{background:linear-gradient(#8f1f14,#4e0d07)}
.dur{background:linear-gradient(#c5ced6,#6f7c88);color:#1d232a}
.crea .atk,.crea .pv{width:19cqw;height:19cqw;font-size:10cqw}
.crea .nom-bande{font-size:9cqw;padding-right:3.5cqw}
.crea .puces{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:9cqw 3cqw 9cqw;display:flex;flex-wrap:wrap;gap:1.5cqw;justify-content:center;background:linear-gradient(to top,rgba(12,9,5,.85),rgba(12,9,5,0))}
.puce{font-size:7.5cqw;line-height:1.2;background:rgba(12,9,5,.75);border:1px solid rgba(242,212,138,.55);color:#f2d48a;border-radius:99px;padding:.6cqw 2.6cqw}
.carte .illimite{position:absolute;z-index:2;left:4.5cqw;top:30%;background:var(--bronze);color:#fff;font-size:5.6cqw;padding:1cqw 3cqw;border-radius:0 2cqw 2cqw 0}
.r-commune{--gem:#ece6d6}
.r-rare{--lis:#d9dee4;--gem:#9fc3e6}
.r-epique{--lis:#b48ae6;--gem:#b48ae6}
.r-legendaire{--lis:#f2c14e;--gem:#f2c14e;box-shadow:0 0 0 1px #f2c14e,0 0 12px rgba(242,193,78,.55)}
.main{display:flex;gap:10px;overflow-x:auto;padding:12px 4px 4px;min-height:244px;align-items:flex-start}
.marche .carte{--w:146px}
.choix-cartes .carte{--w:130px}
.adm-apercu .carte{--w:220px}
.main .carte.jouable:hover,.main .carte.jouable:focus-visible{transform:translateY(-8px)}
.carte.achetable{box-shadow:0 0 0 3px var(--cible),0 2px 6px rgba(0,0,0,.28)}
.carte:not(.achetable):not(.jouable){cursor:default}
.marche .carte:not(.achetable){opacity:.82}

/* Créatures sur le plateau */
.crea.peut{box-shadow:0 0 0 3px var(--choix);cursor:pointer}
.crea.choisie{box-shadow:0 0 0 4px var(--choix);transform:translateY(-6px)}
.crea.cible,.portrait.cible{box-shadow:0 0 0 3px var(--cible);cursor:pointer}
.portrait.cible{border-color:var(--cible)}

.joues{display:flex;gap:8px;flex-wrap:wrap}
.joue{display:flex;align-items:center;gap:6px;background:var(--table-2);border-left:5px solid var(--fc,var(--neutre));border-radius:6px;padding:4px 8px;font-size:14px}
.btn-sac{background:none;border:1px solid var(--bronze);color:var(--ink);border-radius:5px;padding:2px 8px;font-size:13px;cursor:pointer}
.consigne{color:var(--ink-2);font-size:15px;min-height:22px;display:flex;align-items:center;gap:10px}
.consigne button{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:14px}


/* Administration */
.onglets{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.onglet{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:15px;color:var(--ink-2)}
.onglet[aria-selected="true"]{border-bottom-color:var(--bronze);color:var(--ink)}
.adm-cartes{display:grid;grid-template-columns:260px minmax(0,1fr) 240px;gap:16px;align-items:start}
.adm-liste,.adm-form,.adm-page{background:var(--zone);border:1px solid var(--line);border-radius:14px;padding:14px}
.adm-page{max-width:900px}
.adm-page h2,.adm-form h2,.adm-apercu h2{font-size:18px;margin:4px 0 12px}
.adm-page h2:not(:first-child){margin-top:24px}
.adm-outils{display:flex;flex-direction:column;gap:8px}
.adm-compte{color:var(--ink-2);font-size:14px;margin:10px 0 6px}
.adm-items{list-style:none;margin:0;padding:0;max-height:62vh;overflow:auto}
.adm-item{width:100%;display:flex;gap:8px;align-items:center;background:none;border:none;border-radius:6px;padding:7px 8px;cursor:pointer;text-align:left;font-size:15px}
.adm-item:hover{background:var(--table-2)}
.adm-item.actif{background:var(--table-2);font-weight:700}
.pastille{width:11px;height:11px;border-radius:50%;background:var(--fc);flex:none;display:inline-block}
.adm-item-info{margin-left:auto;color:var(--ink-2);font-size:14px}
.adm-groupe{display:flex;align-items:center;gap:8px;font-family:Cinzel,"Times New Roman",serif;font-weight:700;font-size:15px;padding:14px 8px 4px;border-bottom:1px solid var(--line)}
.adm-groupe:first-child{padding-top:4px}
.adm-sous{font-size:13px;color:var(--ink-2);padding:8px 8px 2px;font-weight:700;letter-spacing:.02em}
.champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px}
.champs.petits{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.champ{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2);min-width:0}
.champ input,.champ select{min-width:0}
.champ input,.champ select,.adm-outils input,.adm-outils select,.adm-page textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.champ input[type=color]{padding:2px;height:36px}
.adm-page textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.4}
.adm-form fieldset,.adm-page fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:14px 0 0}
.adm-form legend,.adm-page legend{font-family:Cinzel,"Times New Roman",serif;font-weight:700;padding:0 6px;color:var(--ink);display:flex;align-items:center;gap:8px}
.mots{display:flex;flex-wrap:wrap;gap:8px 18px}
.mots label{display:flex;gap:6px;align-items:center}
details.effet{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px}
details.effet summary{cursor:pointer;font-family:Cinzel,"Times New Roman",serif;font-weight:700}
details.effet summary span{font-family:"Alegreya Sans",sans-serif;font-weight:400;color:var(--ink-2);margin-left:8px}
details.effet .champs{margin-top:10px}
.aide{color:var(--ink-2);font-size:14px;margin:8px 0 0}
.adm-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn.danger{background:var(--danger);color:#fff}
.adm-apercu{position:sticky;top:12px}
.adm-apercu .carte{cursor:default}
fieldset.survol{border-color:var(--cible);border-style:dashed;border-width:2px}
.adm-illu{display:block;width:100%;max-width:220px;aspect-ratio:7/9;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
@media (max-width:980px){.adm-cartes{grid-template-columns:1fr}.adm-apercu{position:static}}

/* Bulles d’aide */
#bulle{position:fixed;z-index:40;max-width:270px;background:var(--ink);color:var(--table);font-size:14px;line-height:1.35;padding:8px 11px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 4px 14px rgba(0,0,0,.3);left:0;top:0}
#bulle.visible{opacity:1}
#bulle b{display:block;font-family:Cinzel,"Times New Roman",serif;margin-bottom:3px}
.aide-mot{text-decoration:underline dotted rgba(242,212,138,.85);text-underline-offset:2px;cursor:help}
.puce[data-aide]{cursor:help}

/* Jeu en ligne */
.code-partie{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:40px;font-weight:700;letter-spacing:.18em;background:var(--table-2);border-radius:12px;padding:14px 20px;text-align:center;margin:8px 0 14px;color:var(--ink)}
.ligne-code{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ligne-code input{font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.12em;text-transform:lowercase;width:9ch;flex:none;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.boite h3{font-family:Cinzel,"Times New Roman",serif;font-size:17px;margin:20px 0 8px}
.attente{display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.attente::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--cible);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.attente::before{animation:none}}

/* Couches */
#couche:empty{display:none}
#couche{position:fixed;inset:0;background:var(--voile);display:grid;place-items:center;padding:24px;z-index:20;overflow:auto}
.boite{background:var(--zone);color:var(--ink);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;padding:28px}
.boite h2{font-size:26px;margin-bottom:10px}
.boite p{margin:0 0 16px;color:var(--ink-2)}
.boite .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--bronze);color:var(--parchemin);border:none;border-radius:10px;padding:12px 18px;font-family:Cinzel,"Times New Roman",serif;font-weight:700;cursor:pointer}
.btn.second{background:none;color:var(--ink);border:1px solid var(--line)}
.boite details{margin-top:18px;color:var(--ink-2)}
.boite summary{cursor:pointer;color:var(--ink)}
.boite ul{padding-left:20px;margin:10px 0 0}
.boite li{margin-bottom:6px}
.choix-cartes{display:flex;gap:10px;flex-wrap:wrap;max-height:60vh;overflow:auto;padding:4px;margin-bottom:12px}
.groupe-titre{width:100%;font-size:14px;color:var(--ink-2)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--table);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
#toast.visible{opacity:1}

@media (max-width:820px){
  .centre{grid-template-columns:1fr}
  .journal ol{max-height:120px;overflow:auto}
  .fin{margin-left:0}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important}
  .main .carte.jouable:hover,.crea.choisie{transform:none}
}
</style>
</head>
<body>
<style id="styles-factions"></style>
<main id="app"></main>
<div id="couche"></div>
<div id="toast" role="status"></div>
<div id="bulle" role="tooltip"></div>

<script>
/* ============================================================
   CONFIGURATION DU JEU
   Valeurs d’origine. Le panneau d’administration les modifie
   et enregistre la version modifiée dans ce navigateur.
   ============================================================ */
const DEFAUT = {
  version:2,
  regles:{pvDepart:30, mainDepart:5, piocheParTour:5, tailleMarche:5, plateauMax:7,
          tailleDeck:30, copiesMax:2, copiesLegendaire:1, carteBase:"pierre",
          deckDepart:{piece:7, rubis:1, dague:1, epee:1}},
  mots:{provocation:"Provocation", rapidite:"Rapidité", resistance:"Résistance", ethere:"Ethéré"},
  termes:{conjuration:"Conjuration", echo:"Echo", allie:"Allié", sacrifice:"Sacrifice"},
  factions:{
    egy:{nom:"Égyptiens", f:"égyptienne", m:"égyptien", sym:"☥", couleur:"#d4a017"},
    hin:{nom:"Hindous", f:"hindoue", m:"hindou", sym:"✿", couleur:"#c8402a"},
    nor:{nom:"Nordiques", f:"nordique", m:"nordique", sym:"⚔", couleur:"#6e7b88"},
    gre:{nom:"Grecs", f:"grecque", m:"grec", sym:"Ω", couleur:"#2d5fbf"}
  },
  cartes:{
    // Deck de départ et carte de base
    piece:{nom:"Pièce d’or", type:"sort", depart:true, effet:{or:1}},
    rubis:{nom:"Rubis", type:"sort", depart:true, effet:{or:2}},
    dague:{nom:"Dague", type:"sort", depart:true, effet:{combat:1}},
    epee:{nom:"Épée courte", type:"sort", depart:true, effet:{combat:2}},
    pierre:{nom:"Pierre de feu", type:"sort", base:true, prix:2, effet:{or:2}, choixSacrifice:{combat:3}},

    // Égyptiens : soin, créatures solides, Provocation (17 créatures, 11 sorts, 2 équipements)

const CLE_STOCKAGE = "prototype-combat-config-v1";
const copie = o => JSON.parse(JSON.stringify(o));
let CONFIG, CARTES, FACTIONS, MOTS, TERMES, REGLES;

function fusionner(obj){
  const d = copie(DEFAUT);
  if(!obj || typeof obj!=="object" || !obj.cartes || !obj.factions) return d;
  let cartesFinales = obj.cartes;
  if((obj.version || 1) < d.version){
    // Nouveau jeu de cartes : on garde les cartes créées dans l’admin et les images déjà ajoutées
    cartesFinales = copie(d.cartes);
    for(const [k,c] of Object.entries(obj.cartes)){
      if(k.startsWith("carte_")) cartesFinales[k] = c;
      else if(cartesFinales[k] && c.image) cartesFinales[k].image = c.image;
    }
  }
  return {version:d.version, exporte:obj.exporte || 0, cartes:cartesFinales, factions:obj.factions,
          regles:{...d.regles, ...(obj.regles||{}), deckDepart:{...((obj.regles && obj.regles.deckDepart) || d.regles.deckDepart)}},
          mots:{...d.mots, ...(obj.mots||{})}, termes:{...d.termes, ...(obj.termes||{})}};
}
function chargerConfig(){
  let brut = null;
  try { brut = JSON.parse(localStorage.getItem(CLE_STOCKAGE)); } catch(e) { brut = null; }
  CONFIG = fusionner(brut);
  appliquerConfig();
}
function sauver(){
  try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify(CONFIG)); return true; } catch(e) { return false; }
}
function encre(hex){
  const n = parseInt((hex||"#888888").slice(1), 16);
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  return (0.299*r + 0.587*g + 0.114*b)/255 > 0.6 ? "#2b2416" : "#ffffff";
}
function appliquerConfig(cfg){
  const c = cfg || CONFIG;
  CARTES = c.cartes; FACTIONS = c.factions; MOTS = c.mots; TERMES = c.termes; REGLES = c.regles;
  const css = Object.entries(FACTIONS).map(([k,f]) => `.f-${k}{--fc:${f.couleur};--fci:${encre(f.couleur)}}`).join("\n");
  const el = document.getElementById("styles-factions");
  if(el) el.textContent = css;
}

/* ============================================================
   TEXTES DES CARTES (générés à partir des données)
   ============================================================ */
function decrire(e){
  const p = [];
  if(e.or) p.push(`+${e.or} or`);
  if(e.combat) p.push(`+${e.combat} combat`);
  if(e.soin) p.push(`+${e.soin} soin`);
  if(e.pioche) p.push(`piochez ${e.pioche} carte${e.pioche>1?"s":""}`);
  if(e.bannir) p.push(`bannissez ${e.bannir} carte de votre main ou défausse`);
  if(e.degatsTous) p.push(`${e.degatsTous} dégâts à chaque créature adverse`);
  if(e.degatsHasard) p.push(`${e.degatsHasard} dégâts à une créature adverse au hasard`);
  if(e.renfort) p.push(`vos créatures gagnent +${e.renfort.atk}/+${e.renfort.vie}`);
  if(e.invoque) p.push(`invoque ${e.invoque.n} ${CARTES[e.invoque.id] ? CARTES[e.invoque.id].nom : "?"}`);
  const s = p.join(", ");
  if(!s) return "Aucun effet.";
  return s.charAt(0).toUpperCase() + s.slice(1) + ".";
}
function texteCarte(d){
  const l = [];
  if(d.type==="creature" && d.mots && d.mots.length) l.push(d.mots.map(m=>MOTS[m] || m).join(", ") + ".");
  if(d.type==="sort" && d.effet) l.push(decrire(d.effet));
  if(d.type==="arme") l.push(`Équipe une de vos créatures : +${d.bonus} attaque pendant ${d.durabilite} attaques.`);
  if(d.type==="creature" && d.conjuration) l.push(TERMES.conjuration + " : " + decrire(d.conjuration));
  if(d.type==="creature" && d.echo) l.push(TERMES.echo + " : " + decrire(d.echo));
  if(d.allie) l.push(TERMES.allie + " : " + decrire(d.allie));
  if(d.sacrifice) l.push(TERMES.sacrifice + " : " + decrire(d.sacrifice));
  if(d.choixSacrifice) l.push("Ou " + TERMES.sacrifice.toLowerCase() + " : " + decrire(d.choixSacrifice));
  return l;
}
function typeLigne(d){
  if(d.depart) return "Carte de départ";
  if(d.base) return "Carte de base";
  const f = d.faction && FACTIONS[d.faction] ? FACTIONS[d.faction] : null;
  if(d.type==="creature") return "Créature" + (f ? " " + f.f : "");
  if(d.type==="arme") return "Arme" + (f ? " " + f.f : "");
  return "Sort" + (f ? " " + f.m : "");
}

/* ============================================================
   MOTEUR DE RÈGLES (aucun affichage ici)
   ============================================================ */
let S = null;          // état de la partie
let compteurUid = 0;
const uid = () => "c" + (++compteurUid);
const inst = id => ({uid:uid(), id});
const def = c => CARTES[c.id];

function melange(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function deckConstruit(){
  // Prototype : deck de 30 cartes tiré au hasard dans toutes les factions
  const copies = [];
  for(const [id,d] of Object.entries(CARTES)){
    if(d.depart || d.base || d.jeton) continue;
    const n = d.rarete==="legendaire" ? REGLES.copiesLegendaire : REGLES.copiesMax;
    for(let i=0;i<n;i++) copies.push(id);
  }
  return melange(copies).slice(0, REGLES.tailleDeck);
}
function deckDepart(){
  const ids = [];
  for(const [id,n] of Object.entries(REGLES.deckDepart)) if(CARTES[id]) for(let i=0;i<n;i++) ids.push(id);
  return melange(ids.map(inst));
}
function nouveauJoueur(nom){
  return {nom, pv:REGLES.pvDepart, deck:deckDepart(), main:[], defausse:[], bannies:[], plateau:[], joues:[], tour:[], or:0, combat:0};
}
function log(t){ if(S) S.journal.push(t); }

function nouvellePartie(mode){
  compteurUid = 0;
  S = {mode, joueurs:[nouveauJoueur("Joueur 1"), nouveauJoueur(mode==="ia" ? "Ordinateur" : "Joueur 2")],
       courant: Math.random()<0.5 ? 0 : 1, tour:1, journal:[], vainqueur:null,
       marcheDeck:[], marche:[], bannirEnAttente:0};
  S.marcheDeck = melange([...deckConstruit(), ...deckConstruit()].map(inst));
  for(let i=0;i<REGLES.tailleMarche && S.marcheDeck.length;i++) S.marche.push(S.marcheDeck.pop());
  S.joueurs.forEach(j => piocher(j, REGLES.mainDepart, true));
  S.joueurs[S.courant].plateau.forEach(c => c.peutAttaquer = true);
  log(`${S.joueurs[S.courant].nom} commence.`);
}

function piocher(j, n, silencieux){
  for(let i=0;i<n;i++){
    if(!j.deck.length){
      if(!j.defausse.length) return;
      j.deck = melange(j.defausse); j.defausse = [];
      if(!silencieux) log(`${j.nom} mélange sa défausse pour reformer son deck.`);
    }
    j.main.push(j.deck.pop());
  }
}

function creature(c){
  const d = def(c), mots = d.mots || [];
  return {uid:c.uid, id:c.id, deg:0, vieMax:d.vie, atk:d.attaque,
          bouclier:mots.includes("resistance"), peutAttaquer:mots.includes("rapidite"),
          aAttaque:false, revele:false, arme:null};
}
const atkTotal = c => c.atk + (c.arme ? CARTES[c.arme.id].bonus : 0);
const vieRestante = c => c.vieMax - c.deg;
const aMot = (c,m) => (CARTES[c.id].mots || []).includes(m);
const adversaire = i => S.joueurs[1-i];

// Qui peut-on viser ? Les créatures Ethérées non révélées sont intouchables.
// Il faut détruire toutes les créatures visibles avant de viser le joueur.
// Parmi les créatures, celles avec Provocation doivent être visées en premier.
function cibles(i){
  const opp = adversaire(i);
  const visibles = opp.plateau.filter(c => !(aMot(c,"ethere") && !c.revele));
  const prov = visibles.filter(c => aMot(c,"provocation"));
  return {face: visibles.length===0, creatures: new Set((prov.length ? prov : visibles).map(c => c.uid))};
}
function raisonRefus(i, cible){
  const opp = adversaire(i);
  if(cible==="face") return "Détruisez d’abord toutes les créatures adverses visibles.";
  const c = opp.plateau.find(x => x.uid===cible);
  if(c && aMot(c,"ethere") && !c.revele) return "Cette créature est Ethérée : impossible de la viser tant qu’elle n’a pas attaqué.";
  return "Une créature avec Provocation doit être visée en premier.";
}

function blesser(c, n){
  if(n<=0) return;
  if(c.bouclier){ c.bouclier = false; return; }
  c.deg += n;
}

function appliquer(i, e){
  if(!e) return;
  const j = S.joueurs[i], opp = adversaire(i);
  if(e.or) j.or += e.or;
  if(e.combat) j.combat += e.combat;
  if(e.soin) j.pv += e.soin;
  if(e.pioche) piocher(j, e.pioche);
  if(e.degatsTous) opp.plateau.forEach(c => blesser(c, e.degatsTous));
  if(e.degatsHasard && opp.plateau.length){
    const c = opp.plateau[Math.floor(Math.random()*opp.plateau.length)];
    blesser(c, e.degatsHasard);
    log(`${def(c).nom} subit ${e.degatsHasard} dégâts.`);
  }
  if(e.renfort) j.plateau.forEach(c => { c.atk += e.renfort.atk; c.vieMax += e.renfort.vie; });
  if(e.invoque){
    if(CARTES[e.invoque.id]) for(let k=0;k<e.invoque.n && j.plateau.length<REGLES.plateauMax;k++) j.plateau.push(creature(inst(e.invoque.id)));
  }
  if(e.bannir && i===S.courant) S.bannirEnAttente += e.bannir;
  nettoyer();
}

// Retire les créatures mortes, les envoie à la défausse et déclenche leur Echo
function nettoyer(){
  S.joueurs.forEach((j, idx) => {
    const morts = j.plateau.filter(c => vieRestante(c) <= 0);
    if(!morts.length) return;
    j.plateau = j.plateau.filter(c => vieRestante(c) > 0);
    morts.forEach(c => {
      const d = def(c);
      if(!d.jeton) j.defausse.push({uid:c.uid, id:c.id});
      if(c.arme) j.defausse.push({uid:c.arme.uid, id:c.arme.id});
      log(`${d.nom} est détruit${d.jeton ? "e" : ""}.`);
      if(d.echo){ log(`Echo de ${d.nom}.`); appliquer(idx, d.echo); }
    });
  });
}

function verifierVictoire(){
  const [a,b] = S.joueurs;
  if(a.pv<=0 && b.pv<=0) S.vainqueur = "egalite";
  else if(a.pv<=0) S.vainqueur = b.nom;
  else if(b.pv<=0) S.vainqueur = a.nom;
}

function verifierAllies(i){
  const j = S.joueurs[i];
  let encore = true;
  while(encore){
    encore = false;
    for(const t of j.tour){
      const d = CARTES[t.id];
      if(!d.allie || t.allieFait || !d.faction) continue;
      if(j.tour.some(o => o!==t && CARTES[o.id].faction===d.faction)){
        t.allieFait = true; encore = true;
        log(`Allié : ${d.nom} (${decrire(d.allie)})`);
        appliquer(i, d.allie);
      }
    }
  }
}

function jouer(id, opts={}){
  const i = S.courant, j = S.joueurs[i];
  const k = j.main.findIndex(c => c.uid===id);
  if(k<0) return false;
  const c = j.main[k], d = def(c);
  if(d.type==="creature" && j.plateau.length>=REGLES.plateauMax) return erreur(`Votre plateau est plein (${REGLES.plateauMax} créatures).`);
  if(d.type==="arme"){
    const cible = j.plateau.find(x => x.uid===opts.cible);
    if(!cible) return erreur("Choisissez une de vos créatures à équiper.");
    j.main.splice(k,1);
    if(cible.arme) j.defausse.push({uid:cible.arme.uid, id:cible.arme.id});
    cible.arme = {uid:c.uid, id:c.id, dur:d.durabilite};
    log(`${j.nom} équipe ${def(cible).nom} de ${d.nom}.`);
  } else if(d.type==="creature"){
    j.main.splice(k,1);
    j.plateau.push(creature(c));
    log(`${j.nom} invoque ${d.nom}.`);
    if(d.conjuration) appliquer(i, d.conjuration);
  } else {
    j.main.splice(k,1);
    if(opts.sacrifierDirect && d.choixSacrifice){
      j.bannies.push(c);
      log(`${j.nom} sacrifie ${d.nom} (${decrire(d.choixSacrifice)})`);
      appliquer(i, d.choixSacrifice);
    } else {
      j.joues.push(c);
      log(`${j.nom} joue ${d.nom}.`);
      appliquer(i, d.effet);
    }
  }
  j.tour.push({uid:c.uid, id:c.id, allieFait:false});
  verifierAllies(i);
  verifierVictoire();
  return true;
}

function sacrifier(id){
  const j = S.joueurs[S.courant];
  const k = j.joues.findIndex(c => c.uid===id);
  if(k<0) return;
  const c = j.joues[k], d = def(c);
  if(!d.sacrifice) return;
  j.joues.splice(k,1); j.bannies.push(c);
  log(`${j.nom} sacrifie ${d.nom} (${decrire(d.sacrifice)})`);
  appliquer(S.courant, d.sacrifice);
  verifierVictoire();
}

function bannir(id){
  const j = S.joueurs[S.courant];
  for(const zone of ["main","defausse"]){
    const k = j[zone].findIndex(c => c.uid===id);
    if(k>=0){
      const [c] = j[zone].splice(k,1);
      j.bannies.push(c);
      log(`${j.nom} bannit ${def(c).nom}.`);
      S.bannirEnAttente = Math.max(0, S.bannirEnAttente-1);
      return;
    }
  }
}

function acheter(k){
  const j = S.joueurs[S.courant];
  if(k==="base"){
    const b = CARTES[REGLES.carteBase];
    if(!b) return false;
    if(j.or<(b.prix||0)) return erreur(`Il vous faut ${b.prix} or pour ${b.nom}.`);
    j.or -= (b.prix||0); j.defausse.push(inst(REGLES.carteBase));
    log(`${j.nom} achète ${b.nom}.`);
    return true;
  }
  const c = S.marche[k];
  if(!c) return false;
  const d = def(c);
  if(j.or<d.prix) return erreur(`Il vous faut ${d.prix} or pour acheter ${d.nom}.`);
  j.or -= d.prix; j.defausse.push(c);
  S.marche.splice(k, 1, ...(S.marcheDeck.length ? [S.marcheDeck.pop()] : []));
  log(`${j.nom} achète ${d.nom}.`);
  return true;
}

function attaquer(idAtt, cible){
  const i = S.courant, j = S.joueurs[i], opp = adversaire(i);
  const att = j.plateau.find(x => x.uid===idAtt);
  if(!att || !att.peutAttaquer || att.aAttaque) return erreur("Cette créature ne peut pas attaquer maintenant.");
  const t = cibles(i);
  if(cible==="face"){
    if(!t.face) return erreur(raisonRefus(i,"face"));
    opp.pv -= atkTotal(att);
    log(`${def(att).nom} inflige ${atkTotal(att)} dégâts à ${opp.nom}.`);
  } else {
    if(!t.creatures.has(cible)) return erreur(raisonRefus(i,cible));
    const v = opp.plateau.find(x => x.uid===cible);
    const a1 = atkTotal(att), a2 = atkTotal(v);
    blesser(v, a1); blesser(att, a2);
    log(`${def(att).nom} attaque ${def(v).nom}.`);
  }
  att.aAttaque = true; att.revele = true;
  if(att.arme){
    att.arme.dur--;
    if(att.arme.dur<=0){
      j.defausse.push({uid:att.arme.uid, id:att.arme.id});
      log(`${CARTES[att.arme.id].nom} se brise.`);
      att.arme = null;
    }
  }
  nettoyer(); verifierVictoire();
  return true;
}

function utiliserCombat(cible){
  const i = S.courant, j = S.joueurs[i], opp = adversaire(i);
  if(j.combat<=0) return false;
  const t = cibles(i);
  if(cible==="face"){
    if(!t.face) return erreur(raisonRefus(i,"face"));
    log(`${j.nom} inflige ${j.combat} dégâts à ${opp.nom}.`);
    opp.pv -= j.combat; j.combat = 0;
  } else {
    if(!t.creatures.has(cible)) return erreur(raisonRefus(i,cible));
    const v = opp.plateau.find(x => x.uid===cible);
    if(v.bouclier){
      v.bouclier = false; j.combat -= 1;
      log(`${j.nom} brise la Résistance de ${def(v).nom} (1 combat).`);
    } else {
      const n = Math.min(j.combat, vieRestante(v));
      v.deg += n; j.combat -= n;
      log(`${j.nom} inflige ${n} dégâts à ${def(v).nom}.`);
    }
  }
  nettoyer(); verifierVictoire();
  return true;
}

function finTour(){
  const j = S.joueurs[S.courant];
  j.defausse.push(...j.main, ...j.joues);
  j.main = []; j.joues = []; j.tour = []; j.or = 0; j.combat = 0;
  S.bannirEnAttente = 0;
  piocher(j, REGLES.piocheParTour);
  S.courant = 1 - S.courant; S.tour++;
  const n = S.joueurs[S.courant];
  n.plateau.forEach(c => { c.peutAttaquer = true; c.aAttaque = false; });
  log(`Tour de ${n.nom}.`);
}

/* ============================================================
   ADVERSAIRE ORDINATEUR (très simple)
   ============================================================ */
const pause = ms => new Promise(r => setTimeout(r, ms));
function iaBannir(j){
  while(S.bannirEnAttente>0){
    const c = j.defausse.find(x => def(x).depart) || j.main.find(x => def(x).depart);
    if(!c){ S.bannirEnAttente = 0; break; }
    bannir(c.uid);
  }
}
async function tourIA(){
  ui.aiEnCours = true; render();
  await pause(700);
  const i = S.courant, j = S.joueurs[i];
  let progres = true;
  while(progres && S.vainqueur===null){
    progres = false;
    for(const c of [...j.main]){
      const d = def(c);
      if(d.type==="creature" && j.plateau.length<REGLES.plateauMax){ jouer(c.uid); progres = true; break; }
      if(d.type==="sort"){ jouer(c.uid); progres = true; break; }
      if(d.type==="arme" && j.plateau.length){
        const cible = [...j.plateau].sort((a,b) => atkTotal(b)-atkTotal(a))[0];
        jouer(c.uid, {cible:cible.uid}); progres = true; break;
      }
    }
    if(S.bannirEnAttente>0) iaBannir(j);
    if(progres){ render(); await pause(420); }
  }
  while(S.vainqueur===null){
    const options = S.marche.map((c,k) => ({k, p:def(c).prix})).filter(o => o.p<=j.or).sort((a,b) => b.p-a.p);
    if(options.length) acheter(options[0].k);
    else if(CARTES[REGLES.carteBase] && j.or>=(CARTES[REGLES.carteBase].prix||0) && (CARTES[REGLES.carteBase].prix||0)>0) acheter("base");
    else break;
    render(); await pause(420);
  }
  for(const c of [...j.plateau]){
    if(S.vainqueur!==null) break;
    if(!j.plateau.includes(c) || !c.peutAttaquer || c.aAttaque) continue;
    const t = cibles(i);
    let cible = null;
    if(t.face) cible = "face";
    else {
      const cand = adversaire(i).plateau.filter(v => t.creatures.has(v.uid));
      const tuables = cand.filter(v => !v.bouclier && vieRestante(v)<=atkTotal(c)).sort((a,b) => atkTotal(b)-atkTotal(a));
      const choix = tuables[0] || cand.sort((a,b) => vieRestante(a)-vieRestante(b))[0];
      cible = choix ? choix.uid : null;
    }
    if(!cible) continue;
    attaquer(c.uid, cible); render(); await pause(520);
  }
  let garde = 30;
  while(j.combat>0 && S.vainqueur===null && garde--){
    const t = cibles(i);
    if(t.face) utiliserCombat("face");
    else {
      const cand = adversaire(i).plateau.filter(v => t.creatures.has(v.uid)).sort((a,b) => vieRestante(a)-vieRestante(b));
      if(!cand.length) break;
      utiliserCombat(cand[0].uid);
    }
    render(); await pause(420);
  }
  if(S.vainqueur===null) finTour();
  ui.aiEnCours = false; render();
}

   INTERFACE

const ui = {ecran:"jeu", attaquant:null, armeEnAttente:null, choixPierre:null, couvert:false, aiEnCours:false, regles:false};
let minuteToast = null;
function erreur(msg){
  if(EN.capture){ EN.refusCapture = msg; return false; }
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("visible");
  clearTimeout(minuteToast);
  minuteToast = setTimeout(() => t.classList.remove("visible"), 2600);
  return false;
}
function interactif(){
  return S && S.vainqueur===null && !ui.couvert && !ui.aiEnCours && (S.mode==="duo" || S.courant===vue()) && !(enLigne() && EN.enAttente);
}
const vue = () => S.mode==="ia" ? 0 : S.mode==="enligne" ? (EN.role==="hote" ? 0 : 1) : S.courant;
const enLigne = () => !!S && S.mode==="enligne";
const nomAffiche = j => !enLigne() ? j.nom : (j===S.joueurs[vue()] ? "Vous" : "Adversaire");

const NOMS_RARETE = {commune:"Commune", rare:"Rare", epique:"Épique", legendaire:"Légendaire"};
const TEXTES_AIDE = {
  provocation:"Les attaques et le combat adverses doivent viser cette créature avant les autres.",
  rapidite:"Peut attaquer dès le tour où elle est posée.",
  resistance:"Ignore entièrement les premiers dégâts subis, puis disparaît.",
  ethere:"Ne peut pas être visée tant qu’elle n’a pas attaqué. Elle ne protège pas son joueur.",
  conjuration:"Effet déclenché quand la créature arrive en jeu.",
  echo:"Effet déclenché quand la créature meurt.",
  allie:"Bonus déclenché si une autre carte de la même faction a été jouée ce tour.",
  sacrifice:"Retirez la carte de la partie pour obtenir cet effet. Elle ne reviendra plus dans votre deck.",
  bannir:"Retirez définitivement une carte de votre main ou de votre défausse : votre deck s’allège et vous piochez plus souvent vos meilleures cartes."
};
function avecAides(txt){
  const termes = [...Object.entries(MOTS), ...Object.entries(TERMES)].filter(([k,l]) => l && TEXTES_AIDE[k]).sort((a,b) => b[1].length-a[1].length);
  const echap = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const motif = new RegExp(`(?<!\\p{L})(${[...termes.map(([,l]) => echap(l)), "bannissez"].join("|")})(?!\\p{L})`, "giu");
  return txt.replace(motif, m => {
    const t = termes.find(([,l]) => l.toLowerCase()===m.toLowerCase());
    const k = t ? t[0] : "bannir";
    return `<span class="aide-mot" data-aide="${k}" data-titre="${esc(t ? t[1] : "Bannir")}">${m}</span>`;
  });
}
function htmlCarte(c, o={}){
  const d = def(c), f = d.faction && FACTIONS[d.faction] ? d.faction : "neutre";
  const sym = f!=="neutre" ? FACTIONS[f].sym : "";
  const lignes = texteCarte(d);
  const texte = lignes.map((l,i) => i===0 && d.type==="creature" && d.mots && d.mots.length ? `<span class="mots-cles">${avecAides(l)}</span>` : avecAides(l)).join("<br>");
  const stats = d.type==="creature"
    ? `<span class="atk" title="Attaque">${d.attaque}</span><span class="pv" title="Points de vie">${d.vie}</span>`
    : d.type==="arme"
      ? `<span class="atk" title="Bonus d’attaque">+${d.bonus}</span><span class="dur" title="Nombre d’attaques">${d.durabilite}</span>` : "";
  const act = o.act ? `data-act="${o.act}" data-id="${o.id ?? c.uid}"` : "";
  return `<button type="button" class="carte f-${f} r-${d.rarete || "base"} ${o.classes || ""}" ${act}>
    <span class="cadre">
      <span class="art ${d.image ? "" : "sans-image"}" data-sym="${sym}">${d.image ? `<img class="illu" src="${d.image}" alt="">` : ""}<span class="nom-bande">${d.nom}</span>${lignes.length ? `<span class="texte">${texte}</span>` : ""}</span>
      <span class="pied" title="${typeLigne(d)}"><span aria-hidden="true">${sym}</span><span class="type">${d.depart ? "Départ" : d.base ? "Base" : d.jeton ? "Jeton" : {creature:"Créature", sort:"Sort", arme:"Arme"}[d.type]}</span>${NOMS_RARETE[d.rarete] && !d.depart && !d.base && !d.jeton ? `<span class="gemme" title="${NOMS_RARETE[d.rarete]}"></span>` : ""}</span>
      ${d.prix!=null && !d.depart ? `<span class="prix" title="Prix en or">${d.prix}</span>` : ""}
      ${stats}${o.extra || ""}
    </span></button>`;
}
function htmlCrea(c, act, classes){
  const d = def(c), f = d.faction && FACTIONS[d.faction] ? d.faction : "neutre";
  const sym = f!=="neutre" ? FACTIONS[f].sym : "";
  const puces = [];
  const puce = k => `<span class="puce" data-aide="${k}" data-titre="${esc(MOTS[k])}">${MOTS[k]}</span>`;
  if(aMot(c,"provocation")) puces.push(puce("provocation"));
  if(aMot(c,"rapidite")) puces.push(puce("rapidite"));
  if(c.bouclier) puces.push(puce("resistance"));
  if(aMot(c,"ethere") && !c.revele) puces.push(puce("ethere"));
  if(c.arme) puces.push(`<span class="puce">⚔ ${CARTES[c.arme.id].nom} (${c.arme.dur})</span>`);
  const detail = texteCarte(d).join(" ").replace(/"/g,"");
  return `<button type="button" class="crea f-${f} r-${d.rarete || "base"} ${classes}" data-act="${act}" data-id="${c.uid}" data-aide="carte" data-titre="${esc(d.nom)}" data-texte="${esc(detail)}">
    <span class="cadre">
      <span class="art ${d.image ? "" : "sans-image"}" data-sym="${sym}">${d.image ? `<img class="illu" src="${d.image}" alt="">` : ""}<span class="nom-bande">${d.nom}</span>${puces.length ? `<span class="puces">${puces.join("")}</span>` : ""}</span>
      <span class="pied"></span>
      <span class="atk" title="Attaque">${atkTotal(c)}</span><span class="pv ${c.deg>0 ? "blesse" : ""}" title="Points de vie">${vieRestante(c)}</span>
    </span></button>`;
}
function htmlJoue(c, inter){
  const d = def(c);
  const sac = d.sacrifice && inter ? `<button type="button" class="btn-sac" data-act="sac" data-id="${c.uid}">Sacrifier : ${decrire(d.sacrifice)}</button>` : "";
  return `<span class="joue f-${d.faction || "neutre"}" style="border-left-color:var(--fc)">${d.nom}${sac}</span>`;
}
function consigne(inter, moi){
  if(!S || S.vainqueur!==null) return "";
  if(ui.aiEnCours) return "L’ordinateur joue son tour…";
  if(!inter && enLigne()) return `<span class="attente">${EN.enAttente ? "Envoi de votre action…" : "Tour de votre adversaire…"}</span>`;
  if(!inter) return "";
  if(ui.armeEnAttente) return `Choisissez la créature à équiper. <button type="button" data-act="annuler">Annuler</button>`;
  if(ui.attaquant){
    const c = moi.plateau.find(x => x.uid===ui.attaquant);
    return `Choisissez la cible de ${c ? def(c).nom : "votre créature"} (contour vert). <button type="button" data-act="annuler">Annuler</button>`;
  }
  if(moi.combat>0) return "Cliquez sur une cible au contour vert pour y dépenser vos points de combat.";
  if(moi.main.length) return "Cliquez sur vos cartes pour les jouer, achetez au marché, puis finissez le tour.";
  return "Achetez au marché, attaquez avec vos créatures, puis finissez le tour.";
}

const adm = {onglet:"cartes", sel:null, recherche:"", filtre:"toutes", tri:"faction", suppr:null, reset:false, ouverts:new Set()};
const ORDRE_RARETE = [["commune","Communes"],["rare","Rares"],["epique","Épiques"],["legendaire","Légendaires"],["base","Départ et base"],["jeton","Jetons"]];
const ORDRE_TYPE = {creature:0, sort:1, arme:2};
const groupeRarete = d => d.jeton ? "jeton" : (d.depart || d.base) ? "base" : (d.rarete || "commune");
function trierCartes(ids){
  const fac = Object.keys(FACTIONS);
  const rangF = d => d.faction && fac.includes(d.faction) ? fac.indexOf(d.faction) : fac.length;
  const rangR = d => ORDRE_RARETE.findIndex(([k]) => k===groupeRarete(d));
  const parNom = (a,b) => CARTES[a].nom.localeCompare(CARTES[b].nom, "fr");
  const parPrix = (a,b) => (CARTES[a].prix ?? 0) - (CARTES[b].prix ?? 0);
  const parType = (a,b) => (ORDRE_TYPE[CARTES[a].type] ?? 3) - (ORDRE_TYPE[CARTES[b].type] ?? 3);
  const t = [...ids];
  if(adm.tri==="nom") return t.sort(parNom);
  if(adm.tri==="prix") return t.sort((a,b) => parPrix(a,b) || parNom(a,b));
  if(adm.tri==="creation") return t;
  return t.sort((a,b) => rangF(CARTES[a])-rangF(CARTES[b]) || rangR(CARTES[a])-rangR(CARTES[b]) || parType(a,b) || parPrix(a,b) || parNom(a,b));
}
function listeCartes(ids){
  const item = id => `<li><button type="button" class="adm-item f-${CARTES[id].faction || "neutre"} ${id===adm.sel ? "actif" : ""}" data-act="carte-sel" data-id="${id}">
    <span class="pastille"></span><span>${esc(CARTES[id].nom)}</span><span class="adm-item-info">${CARTES[id].prix ?? "–"}</span></button></li>`;
  if(adm.tri!=="faction") return ids.map(item).join("");
  let html = "", fCour = null, rCour = null;
  const compte = test => ids.filter(test).length;
  for(const id of ids){
    const d = CARTES[id], f = d.faction && FACTIONS[d.faction] ? d.faction : "", r = groupeRarete(d);
    if(f!==fCour){
      fCour = f; rCour = null;
      const n = compte(x => (CARTES[x].faction && FACTIONS[CARTES[x].faction] ? CARTES[x].faction : "")===f);
      html += `<li class="adm-groupe f-${f || "neutre"}"><span class="pastille"></span>${f ? esc(FACTIONS[f].nom) : "Sans faction"}<span class="adm-item-info">${n}</span></li>`;
    }
    if(r!==rCour){
      rCour = r;
      const n = compte(x => (CARTES[x].faction && FACTIONS[CARTES[x].faction] ? CARTES[x].faction : "")===f && groupeRarete(CARTES[x])===r);
      html += `<li class="adm-sous">${ORDRE_RARETE.find(([k]) => k===r)[1]} (${n})</li>`;
    }
    html += item(id);
  }
  return html;
}
const RARETES = [["commune","Commune"],["rare","Rare"],["epique","Épique"],["legendaire","Légendaire"]];
const EFFETS = [["or","Or"],["combat","Combat"],["soin","Soin"],["pioche","Cartes piochées"],["bannir","Cartes à bannir"],
                ["degatsTous","Dégâts à chaque créature adverse"],["degatsHasard","Dégâts à une créature adverse au hasard"]];
const BLOCS = {
  effet:"Effet quand on la joue",
  conjuration:"Conjuration : quand elle arrive en jeu",
  echo:"Echo : quand elle meurt",
  allie:"Allié : si une autre carte de la même faction est jouée ce tour",
  sacrifice:"Sacrifice : en la retirant de la partie après l’avoir jouée",
  choixSacrifice:"Sacrifice à la place de l’effet : choix au moment de la jouer"
};
const BLOCS_PAR_TYPE = {sort:["effet","allie","sacrifice","choixSacrifice"], creature:["conjuration","echo","allie"], arme:["allie"]};
const AIDE_MOTS = {provocation:"Doit être visée en premier", rapidite:"Peut attaquer dès son arrivée",
                   resistance:"Ignore les premiers dégâts subis", ethere:"Intouchable tant qu’elle n’a pas attaqué"};
const AIDE_TERMES = {conjuration:"Effet à l’arrivée en jeu", echo:"Effet à la mort", allie:"Bonus de faction", sacrifice:"Retirer la carte pour un effet"};

const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const champTexte = (l, ch, v) => `<label class="champ"><span>${l}</span><input type="text" data-chemin="${ch}" value="${esc(v)}"></label>`;
const champNombre = (l, ch, v) => `<label class="champ"><span>${l}</span><input type="number" min="0" step="1" data-chemin="${ch}" value="${v ?? 0}"></label>`;
const champSelect = (l, ch, v, opts) => `<label class="champ"><span>${l}</span><select data-chemin="${ch}">${opts.map(([k,t]) => `<option value="${esc(k)}" ${String(v)===String(k) ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>`;

function admCartes(){
  const tous = Object.keys(CARTES);
  if(!adm.sel || !CARTES[adm.sel]) adm.sel = tous[0] || null;
  const ids = tous.filter(id => {
    const d = CARTES[id];
    if(adm.filtre==="aucune" && d.faction) return false;
    if(adm.filtre!=="toutes" && adm.filtre!=="aucune" && d.faction!==adm.filtre) return false;
    return !adm.recherche || d.nom.toLowerCase().includes(adm.recherche.toLowerCase());
  });
  const tries = trierCartes(ids);
  return `<div class="adm-cartes">
    <div class="adm-liste">
      <div class="adm-outils">
        <input type="search" placeholder="Rechercher une carte" aria-label="Rechercher une carte" value="${esc(adm.recherche)}" data-adm="recherche">
        <select data-adm="filtre" aria-label="Filtrer par faction">
          <option value="toutes">Toutes les factions</option>
          ${Object.entries(FACTIONS).map(([k,f]) => `<option value="${k}" ${adm.filtre===k ? "selected" : ""}>${esc(f.nom)}</option>`).join("")}
          <option value="aucune" ${adm.filtre==="aucune" ? "selected" : ""}>Sans faction</option>
        </select>
        <select data-adm="tri" aria-label="Trier les cartes">
          ${[["faction","Par faction puis rareté"],["prix","Par prix"],["nom","Par nom"],["creation","Ordre de création"]].map(([k,l]) => `<option value="${k}" ${adm.tri===k ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <button type="button" class="btn" data-act="carte-nouvelle">Nouvelle carte</button>
      </div>
      <p class="adm-compte">${ids.length} carte${ids.length>1 ? "s" : ""}, prix à droite</p>
      <ul class="adm-items">${listeCartes(tries)}</ul>
    </div>
    <div class="adm-form">${adm.sel ? formCarte(adm.sel) : "<p>Aucune carte. Créez-en une.</p>"}</div>
    <div class="adm-apercu"><h2>Aperçu</h2>${adm.sel ? htmlCarte({id:adm.sel, uid:"apercu"}) : ""}</div>
  </div>`;
}

function formCarte(id){
  const d = CARTES[id], p = `cartes.${id}`;
  const cat = d.depart ? "depart" : d.base ? "base" : d.jeton ? "jeton" : "marche";
  const creatures = Object.entries(CARTES).filter(([,c]) => c.type==="creature").map(([k,c]) => [k,c.nom]);
  const blocs = (BLOCS_PAR_TYPE[d.type] || []).map(cle => {
    const e = d[cle] || {}, pc = `${p}.${cle}`, rempli = Object.keys(e).length>0;
    const ouvert = rempli || adm.ouverts.has(id+"."+cle);
    return `<details class="effet" data-bloc="${id}.${cle}" ${ouvert ? "open" : ""}>
      <summary>${BLOCS[cle]}<span>${rempli ? esc(decrire(e)) : "Aucun effet"}</span></summary>
      <div class="champs petits">
        ${EFFETS.map(([k,l]) => champNombre(l, `${pc}.${k}`, e[k] || 0)).join("")}
        ${champNombre("Renfort : attaque", `${pc}.renfort.atk`, e.renfort ? e.renfort.atk : 0)}
        ${champNombre("Renfort : vie", `${pc}.renfort.vie`, e.renfort ? e.renfort.vie : 0)}
        ${champSelect("Invoquer", `${pc}.invoque.id`, e.invoque ? e.invoque.id : "", [["","Rien"], ...creatures])}
        ${champNombre("Nombre invoqué", `${pc}.invoque.n`, e.invoque ? e.invoque.n : 0)}
      </div></details>`;
  }).join("");
  return `<h2>${esc(d.nom)}</h2>
    <div class="champs">
      ${champTexte("Nom", p+".nom", d.nom)}
      ${champSelect("Type", p+".type", d.type, [["creature","Créature"],["sort","Sort"],["arme","Arme"]])}
      ${champSelect("Faction", p+".faction", d.faction || "", [["","Aucune"], ...Object.entries(FACTIONS).map(([k,f]) => [k,f.nom])])}
      ${champSelect("Catégorie", "cat:"+id, cat, [["marche","Achetable au marché"],["depart","Deck de départ"],["base","Carte de base"],["jeton","Jeton (invoqué seulement)"]])}

function nettoyerCarte(c){
  for(const cle of Object.keys(BLOCS)){
    const e = c[cle];
    if(!e) continue;
    for(const k of Object.keys(e)) if(typeof e[k]==="number" && e[k]<=0) delete e[k];
    if(e.renfort){
      if(!e.renfort.atk && !e.renfort.vie) delete e.renfort;
      else { e.renfort.atk = e.renfort.atk || 0; e.renfort.vie = e.renfort.vie || 0; }
    }
    if(e.invoque && (!e.invoque.id || !e.invoque.n)) delete e.invoque;
    if(!Object.keys(e).length) delete c[cle];
  }
}

function majChemin(chemin, brut, nombre){
  if(chemin.startsWith("cat:")){
    const c = CARTES[chemin.slice(4)];
    delete c.depart; delete c.base; delete c.jeton;
    if(brut!=="marche") c[brut] = true;
    if(brut==="depart" && REGLES.deckDepart[chemin.slice(4)]==null) REGLES.deckDepart[chemin.slice(4)] = 1;
  } else {
    const parts = chemin.split(".");
    let o = CONFIG;
    for(let i=0;i<parts.length-1;i++){
      if(o[parts[i]]==null || typeof o[parts[i]]!=="object") o[parts[i]] = {};
      o = o[parts[i]];
    }
    const k = parts.at(-1);
    let v = brut;
    if(nombre){ v = Math.max(0, Math.floor(Number(brut))); if(!Number.isFinite(v)) v = 0; }
    o[k] = v;
    if(parts[0]==="cartes"){
      const c = CARTES[parts[1]];
      if(k==="faction" && !v) delete c.faction;
      if(parts.at(-2)==="invoque" && k==="id" && v && !o.n) o.n = 1;
      if(k==="type"){
        if(v==="creature"){ c.attaque = c.attaque ?? 1; c.vie = c.vie ?? 1; }
        if(v==="arme"){ c.bonus = c.bonus ?? 1; c.durabilite = c.durabilite ?? 1; }
      }
      nettoyerCarte(c);
    }
  }
  sauver(); appliquerConfig();
}

function idUnique(prefixe){
  let n = 1, id;
  do { id = prefixe + "_" + Date.now().toString(36) + n++; } while(CARTES[id] || FACTIONS[id]);
  return id;
}

function actionAdmin(act, id, el){
  switch(act){
    case "admin": ui.ecran = "admin"; break;
    case "admin-quitter": ui.ecran = "jeu"; S = null; break;
    case "onglet": adm.onglet = id; adm.reset = false; break;
    case "carte-sel": adm.sel = id; adm.suppr = null; break;
    case "carte-nouvelle": {
      const nid = idUnique("carte");
      const f = adm.filtre!=="toutes" && adm.filtre!=="aucune" ? adm.filtre : Object.keys(FACTIONS)[0];
      CARTES[nid] = {nom:"Nouvelle carte", type:"sort", prix:2, rarete:"commune", effet:{or:1}};
      if(f) CARTES[nid].faction = f;
      adm.sel = nid; adm.recherche = ""; sauver(); break;
    }
    case "carte-dupliquer": {
      const nid = idUnique("carte");
      CARTES[nid] = copie(CARTES[id]); CARTES[nid].nom += " (copie)";
      adm.sel = nid; sauver(); break;
    }
    case "image-choisir": { const f = document.querySelector(`[data-image="${id}"]`); if(f) f.click(); return; }
    case "image-suppr": { const u = CARTES[id].image; delete CARTES[id].image; sauver(); liberer(u); erreur("Image retirée."); break; }
    case "images-transfert": if(ASSETS) transfererImages(); return;
    case "image-coller": {
      const repli = () => erreur("Appuyez sur Ctrl+V (Cmd+V sur Mac) pour coller l’image copiée.");
      if(!navigator.clipboard || !navigator.clipboard.read){ repli(); return; }
      navigator.clipboard.read().then(async items => {
        for(const it of items){
          const type = it.types.find(t => t.startsWith("image/"));
          if(type){ const blob = await it.getType(type); chargerImage(id, new File([blob], "image", {type})); return; }
        }
        erreur("Aucune image copiée : faites un clic droit sur l’image du site, puis « Copier l’image ».");
      }, repli);
      return;
    }
    case "carte-suppr": adm.suppr = id; break;
    case "carte-suppr-non": adm.suppr = null; break;
    case "carte-suppr-ok": {
      const imgSuppr = CARTES[id].image;
      delete CARTES[id];
      liberer(imgSuppr);
      delete REGLES.deckDepart[id];
      if(REGLES.carteBase===id) REGLES.carteBase = "";
      Object.values(CARTES).forEach(c => { for(const cle of Object.keys(BLOCS)) if(c[cle] && c[cle].invoque && c[cle].invoque.id===id) delete c[cle].invoque; nettoyerCarte(c); });
      adm.suppr = null; adm.sel = null; sauver(); erreur("Carte supprimée."); break;
    }
    case "faction-nouvelle": {
      const nid = idUnique("fac");
      FACTIONS[nid] = {nom:"Nouvelle faction", f:"nouvelle", m:"nouveau", sym:"✦", couleur:"#7a5c99"};
      sauver(); appliquerConfig(); break;
    }
    case "faction-suppr":
      if(!Object.values(CARTES).some(c => c.faction===id)){ delete FACTIONS[id]; if(adm.filtre===id) adm.filtre = "toutes"; sauver(); appliquerConfig(); }
      break;
    case "json-copier": {
      const ta = document.getElementById("json-config");
      const fin = () => { ta.select(); try { document.execCommand("copy"); erreur("Texte copié."); } catch(e) { erreur("Texte sélectionné : copiez-le avec Ctrl+C."); } };
      if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(() => erreur("Texte copié."), fin); else fin();
      return;
    }
    case "json-importer": {
      const ta = document.getElementById("json-config");
      let obj;
      try { obj = JSON.parse(ta.value); } catch(e) { return erreur("Ce texte n’est pas une sauvegarde valide : vérifiez qu’il a été collé en entier."); }
      if(!obj || !obj.cartes || !obj.factions || !obj.regles) return erreur("Il manque les cartes, les factions ou les règles dans ce texte.");
      CONFIG = fusionner(obj); appliquerConfig(); sauver(); adm.sel = null; erreur("Sauvegarde importée."); break;
    }
    case "config-telecharger": telechargerConfig(); return;
    case "reset": adm.reset = true; break;
    case "reset-non": adm.reset = false; break;
    case "reset-ok":
      CONFIG = copie(DEFAUT); appliquerConfig(); sauver(); adm.reset = false; adm.sel = null; erreur("Valeurs d’origine restaurées."); break;
    default: return;
  }
  render();
}

const estServeur = url => typeof url==="string" && url.includes("/_blob/");
// Supprime une image du serveur si plus aucune carte ne l’utilise
function liberer(url){
  if(!ASSETS || !estServeur(url)) return;
  if(Object.values(CARTES).some(c => c.image===url)) return;
  ASSETS.delete(url.split("/_blob/")[1]).catch(() => {});
}
function dataVersBlob(data){
  const [entete, b64] = data.split(",");
  const type = entete.match(/data:([^;]+)/)[1];
  const bin = atob(b64), t = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) t[i] = bin.charCodeAt(i);
  return new Blob([t], {type});
}
async function transfererImages(){
  const ids = Object.keys(CARTES).filter(k => (CARTES[k].image || "").startsWith("data:"));
  let ok = 0;
  for(const k of ids){
    erreur(`Transfert des images : ${ok+1} sur ${ids.length}…`);
    try { const r = await ASSETS.upload(dataVersBlob(CARTES[k].image)); CARTES[k].image = r.url; ok++; sauver(); }
    catch(e) { break; }
  }
  erreur(ok===ids.length ? `${ok} image${ok>1 ? "s" : ""} transférée${ok>1 ? "s" : ""} sur le serveur du jeu.` : `Transfert interrompu après ${ok} image${ok>1 ? "s" : ""}. Réessayez plus tard.`);
  renderAdmin();
}

let raisonEchec = "";
async function versDataURL(url){
  try {
    const r = await fetch(url, {credentials:"include"});
    if(!r.ok) throw new Error("réponse " + r.status);
    const b = await r.blob();
    const d = await new Promise((ok, ko) => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = ko; f.readAsDataURL(b); });
    return d.replace(/^data:[^;,]*/, m => m.startsWith("data:image/") ? m : "data:image/jpeg");
  } catch(e) {
    raisonEchec = String(e && e.message || e);
    return await new Promise(ok => {
      const i = new Image();
      i.onload = () => {
        const c = document.createElement("canvas"); c.width = i.naturalWidth; c.height = i.naturalHeight;
        c.getContext("2d").drawImage(i, 0, 0);
        try { ok(c.toDataURL("image/jpeg", 0.85)); } catch(err) { raisonEchec += " / " + (err && err.name); ok(null); }
      };
      i.onerror = () => { raisonEchec += " / image illisible"; ok(null); };
      i.src = url;
    });
  }
}
async function telechargerConfig(){
  erreur("Préparation du fichier config.json…");
  const cfg = copie(CONFIG);
  cfg.exporte = Date.now();
  let manquantes = 0, integrees = 0, total = 0;
  raisonEchec = "";
  for(const c of Object.values(cfg.cartes)){
    if(!c.image) continue;
    total++;
    if(estServeur(c.image)){
      erreur(`Préparation des images : ${total}…`);
      const d = await versDataURL(c.image);
      if(d){ c.image = d; integrees++; } else { delete c.image; manquantes++; }
    } else integrees++;
  }
  adm.dernierExport = {total, integrees, manquantes, raison:raisonEchec, quand:new Date().toLocaleTimeString("fr-FR"), ou: window.claude ? "le prototype sur Claude" : "votre site"};
  if(ui.ecran==="admin") renderAdmin();
  const texte = JSON.stringify(cfg);
  CONFIG.exporte = cfg.exporte; sauver();
  const fin = manquantes ? ` ${manquantes} image${manquantes>1 ? "s n’ont" : " n’a"} pas pu être intégrée${manquantes>1 ? "s" : ""}.` : "";
  if(window.claude && typeof window.claude.use==="function"){
    const dl = await window.claude.use("downloads").catch(() => null);
    if(!dl) return erreur("Le téléchargement n’est pas disponible sur cette page.");
    try { await dl.save({filename:"config.json", data:texte}); erreur("Fichier config.json enregistré." + fin); }
    catch(e) { if(!e || e.code!=="declined") erreur("Le téléchargement a échoué : réessayez dans un instant."); }
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([texte], {type:"application/json"}));
    a.download = "config.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    erreur("Fichier config.json téléchargé." + fin);
  }
}

function chargerImage(id, fichier){
  if(!fichier.type.startsWith("image/")) return erreur("Ce fichier n’est pas une image : choisissez un PNG, un JPG ou un WebP.");
  const lecteur = new FileReader();
  lecteur.onload = () => {
    const img = new Image();
    img.onload = () => {
      const L = 448, H = 576, cv = document.createElement("canvas");
      cv.width = L; cv.height = H;
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#fbf7ec"; ctx.fillRect(0, 0, L, H);
      const r = Math.max(L/img.width, H/img.height), w = img.width*r, h = img.height*r;
      ctx.drawImage(img, (L-w)/2, (H-h)/2, w, h);
      const avant = CARTES[id].image;
      const enLocal = () => {
        CARTES[id].image = cv.toDataURL("image/jpeg", 0.82);
        if(sauver()){ liberer(avant); erreur("Image ajoutée."); }
        else {
          if(avant) CARTES[id].image = avant; else delete CARTES[id].image;
          erreur("Mémoire du navigateur pleine : retirez quelques images pour en ajouter d’autres.");
        }
        renderAdmin();
      };
      if(!ASSETS) return enLocal();
      erreur("Envoi de l’image…");
      cv.toBlob(async blob => {
        try {
          const r = await ASSETS.upload(blob);
          CARTES[id].image = r.url; sauver(); liberer(avant);
          erreur("Image enregistrée sur le serveur du jeu.");
          renderAdmin();
        } catch(e) { enLocal(); }
      }, "image/jpeg", 0.85);
    };
    img.onerror = () => erreur("Impossible de lire cette image : essayez un autre fichier.");
    img.src = lecteur.result;
  };
  lecteur.readAsDataURL(fichier);
}

document.addEventListener("paste", e => {

/* ============================================================
   JEU EN LIGNE (version rapide)
   L’hôte fait tourner les règles et publie l’état de la partie ;
   l’invité envoie ses actions, que l’hôte vérifie et applique.
   ============================================================ */
const EN = {db:null, monId:null, ecran:null, code:null, role:null, hoteId:null, inviteId:null,
            desabos:[], ordres:[], seqEnvoye:0, refusVu:0, enAttente:false, capture:false, refusCapture:null,
            version:0, cfg:null, saisie:"", reprises:[], erreurMenu:""};
if(window.claude && typeof window.claude.use==="function"){
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(async ([db, user]) => {
    if(!db || !user) return;
    const id = await user.id();
    if(id){ EN.db = db; EN.monId = id; }
    if(!S) renderCouche();
  }, () => {});
}

// Une file d’écriture par document : une seule écriture à la fois, la plus récente gagne
function fileEcriture(){
  let enCours = false, suivante = null;
  return fn => {
    suivante = fn;
    if(enCours) return;
    enCours = true;
    (async () => {
      while(suivante){ const f = suivante; suivante = null; try { await f(); } catch(e) { console.warn("Écriture refusée", e); } }
      enCours = false;
    })();
  };
}
const ecrirePartie = fileEcriture(), ecrirePrive = fileEcriture(), ecrireOrdres = fileEcriture();

const LETTRES = "abcdefghjkmnpqrstuvwxyz23456789";
const genererCode = () => Array.from({length:5}, () => LETTRES[Math.floor(Math.random()*LETTRES.length)]).join("");
const refPartie = () => EN.db.doc(`parties/${EN.hoteId}/p/${EN.code}`);
const refOrdres = () => EN.db.doc(`ordres/${EN.inviteId}/p/${EN.code}`);
const refPrive = () => EN.db.doc(`data/users/${EN.hoteId}/parties/${EN.code}`);

function configPublique(){
  const cartes = copie(CONFIG.cartes);
  Object.values(cartes).forEach(c => { if(c.image && !estServeur(c.image)) delete c.image; });
  return {cartes, factions:CONFIG.factions, mots:CONFIG.mots, termes:CONFIG.termes, regles:CONFIG.regles};
}
// Ce que l’invité a le droit de voir : pas la main de l’hôte, pas l’ordre des decks
function vuePublique(){
  const e = JSON.parse(JSON.stringify(S));
  e.joueurs[0].main = e.joueurs[0].main.length;
  e.joueurs.forEach(j => { j.deck = j.deck.length; });
  e.marcheDeck = e.marcheDeck.length;
  e.journal = e.journal.slice(-12);
  return e;
}
function reconstruire(e){
  e = JSON.parse(JSON.stringify(e));
  const vides = n => Array.from({length:n}, () => null);
  e.joueurs.forEach(j => { if(typeof j.main==="number") j.main = vides(j.main); if(typeof j.deck==="number") j.deck = vides(j.deck); });
  if(typeof e.marcheDeck==="number") e.marcheDeck = vides(e.marcheDeck);
  return e;
}

function publier(){
  if(!enLigne() || EN.role!=="hote") return;
  EN.version++;
  const statut = S.vainqueur!==null ? "terminee" : "en_cours";
  const corps = {etat:vuePublique(), version:EN.version, statut, hote:EN.hoteId, invite:EN.inviteId, config:EN.cfg, maj:Date.now()};
  const prive = {etat:JSON.parse(JSON.stringify(S)), code:EN.code, invite:EN.inviteId, statut, config:EN.cfg, maj:Date.now()};
  const rp = refPartie(), rv = refPrive();
  ecrirePartie(() => rp.set(corps));
  ecrirePrive(() => rv.set(prive));
}

function nettoyerAbonnements(){ EN.desabos.forEach(f => { try { f(); } catch(e) {} }); EN.desabos = []; }
function quitterEnLigne(){
  nettoyerAbonnements();
  if(EN.role==="invite") appliquerConfig();
  Object.assign(EN, {ecran:null, code:null, role:null, hoteId:null, inviteId:null, ordres:[], seqEnvoye:0, refusVu:0, enAttente:false, cfg:null});
}

// ----- Hôte
async function creerPartie(){
  EN.erreurMenu = "";
  let code = genererCode();
  try { if((await EN.db.doc(`salle/${code}`).get()).exists) code = genererCode(); } catch(e) {}
  Object.assign(EN, {code, role:"hote", hoteId:EN.monId, inviteId:null, ecran:"attente", version:0, cfg:configPublique()});
  renderCouche();
  try { await EN.db.doc(`salle/${code}`).set({hote:EN.monId, statut:"attente", cree:Date.now()}); }
  catch(e) { EN.ecran = "choix"; EN.erreurMenu = "Impossible de créer la partie : vérifiez que la page est partagée avec vous comme Contributeur ou Éditeur."; return renderCouche(); }
  EN.desabos.push(EN.db.doc(`salle/${code}`).onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    if(d && d.invite && !EN.inviteId && EN.role==="hote") demarrerHote(d.invite);
  }, () => {}));
}
function nommerJoueurs(){ S.joueurs[0].nom = "Hôte"; S.joueurs[1].nom = "Invité"; }
function demarrerHote(inviteId){
  EN.inviteId = inviteId;
  nouvellePartie("enligne"); nommerJoueurs();
  S.seqTraite = 0; S.journal = [`${S.joueurs[S.courant].nom} commence.`];
  EN.ecran = null; ui.ecran = "jeu";
  Object.assign(ui, {attaquant:null, armeEnAttente:null, choixPierre:null, couvert:false, aiEnCours:false});
  ecouterOrdres(); publier(); render();
}
function revancheHote(){
  const seq = S.seqTraite || 0;
  nouvellePartie("enligne"); nommerJoueurs();
  S.seqTraite = seq; S.journal = [`Revanche ! ${S.joueurs[S.courant].nom} commence.`];
  Object.assign(ui, {attaquant:null, armeEnAttente:null, choixPierre:null});
  publier(); render();
}
function ecouterOrdres(){
  EN.desabos.push(refOrdres().onSnapshot(snap => {
    if(!snap.exists || !enLigne()) return;
    const liste = [...(snap.data().ordres || [])].sort((a,b) => a.seq-b.seq);
    let fait = false;
    for(const o of liste){
      if(o.seq > (S.seqTraite || 0)){ S.seqTraite = o.seq; executerOrdre(o); fait = true; }
    }
    if(fait){ publier(); render(); }
  }, () => {}));
}
function executerOrdre(o){
  const c = o.cmd || {};
  if(S.vainqueur!==null || S.courant!==1){ S.refus = {seq:o.seq, msg:"Ce n’est pas votre tour."}; return; }
  EN.capture = true; EN.refusCapture = null;
  try {
    switch(c.type){
      case "jouer": jouer(c.id, c.opts || {}); break;
      case "attaquer": attaquer(c.att, c.cible); break;
      case "combat": utiliserCombat(c.cible); break;
      case "acheter": acheter(c.k); break;
      case "sacrifier": sacrifier(c.id); break;
      case "bannir": bannir(c.id); break;
      case "bannirStop": S.bannirEnAttente = 0; break;
      case "fin": finTour(); break;
    }
  } finally { EN.capture = false; }
  if(EN.refusCapture) S.refus = {seq:o.seq, msg:EN.refusCapture};
}
async function chargerReprises(){
  EN.reprises = [];
  try {
    const q = await EN.db.collection(`data/users/${EN.monId}/parties`).where("statut","==","en_cours").limit(5).get();
    EN.reprises = q.docs.map(d => d.data()).filter(d => d && d.etat).sort((a,b) => b.maj-a.maj);
  } catch(e) {}
  if(EN.ecran==="choix") renderCouche();
}
function reprendre(code){
  const r = EN.reprises.find(x => x.code===code);
  if(!r) return;
  Object.assign(EN, {code, role:"hote", hoteId:EN.monId, inviteId:r.invite, ecran:null, version:0, cfg:r.config || configPublique()});
  S = JSON.parse(JSON.stringify(r.etat));
  ui.ecran = "jeu"; Object.assign(ui, {attaquant:null, armeEnAttente:null, choixPierre:null, couvert:false, aiEnCours:false});
  ecouterOrdres(); publier(); render();
}

// ----- Invité
async function rejoindre(){
  EN.erreurMenu = "";
  const code = (EN.saisie || "").trim().toLowerCase();
  if(!/^[a-z0-9]{5}$/.test(code)){ EN.erreurMenu = "Le code fait 5 caractères (lettres et chiffres)."; return renderCouche(); }
  EN.ecran = "connexion"; renderCouche();
  const echec = msg => { EN.ecran = "choix"; EN.erreurMenu = msg; renderCouche(); };
  let d;
  try { const s = await EN.db.doc(`salle/${code}`).get(); d = s.exists ? s.data() : null; }
  catch(e) { return echec("Connexion impossible pour le moment. Réessayez dans un instant."); }
  if(!d || d.statut==="annulee") return echec("Aucune partie ne correspond à ce code.");
  if(d.hote===EN.monId) return echec("C’est votre propre partie : votre adversaire doit la rejoindre depuis son compte.");
  if(d.invite && d.invite!==EN.monId) return echec("Cette partie a déjà deux joueurs.");
  Object.assign(EN, {code, role:"invite", hoteId:d.hote, inviteId:EN.monId});
  try {
    if(!d.invite) await EN.db.doc(`salle/${code}`).update({invite:EN.monId});
    const o = await refOrdres().get();
    EN.ordres = o.exists ? [...(o.data().ordres || [])] : [];
    EN.seqEnvoye = EN.ordres.reduce((m,x) => Math.max(m, x.seq), 0);
  } catch(e) { EN.role = null; return echec("Impossible de rejoindre : la page doit être partagée avec vous comme Contributeur ou Éditeur."); }
  let premier = true;
  EN.desabos.push(refPartie().onSnapshot(snap => {
    if(!snap.exists || EN.role!=="invite") return;
    const p = snap.data();
    if(p.invite!==EN.monId) return;
    if(p.config) appliquerConfig(p.config);
    S = reconstruire(p.etat);
    EN.ecran = null; ui.ecran = "jeu";
    if(S.refus && S.refus.seq > EN.refusVu){ if(!premier) erreur(S.refus.msg); EN.refusVu = S.refus.seq; }
    if((S.seqTraite || 0) >= EN.seqEnvoye) EN.enAttente = false;
    if(S.courant!==1){ ui.attaquant = null; ui.armeEnAttente = null; ui.choixPierre = null; }
    premier = false;
    render();
  }, () => {}));
}
function envoyer(cmd){
  EN.seqEnvoye++;
  EN.ordres = [...EN.ordres, {seq:EN.seqEnvoye, cmd}].slice(-30);
  EN.enAttente = true;
  const data = {ordres:EN.ordres}, ref = refOrdres();
  ecrireOrdres(() => ref.set(data));
  return true;
}

// Les actions passent par le moteur local, ou partent chez l’hôte pour l’invité
const MOTEUR_LOCAL = {jouer, attaquer, utiliserCombat, acheter, sacrifier, bannir, finTour, bannirStop:() => { S.bannirEnAttente = 0; }};
const MOTEUR_DISTANT = {
  jouer:(id, opts={}) => envoyer({type:"jouer", id, opts}),
  attaquer:(att, cible) => envoyer({type:"attaquer", att, cible}),
  utiliserCombat:cible => envoyer({type:"combat", cible}),
  acheter:k => envoyer({type:"acheter", k}),
  sacrifier:id => envoyer({type:"sacrifier", id}),
  bannir:id => envoyer({type:"bannir", id}),
  bannirStop:() => envoyer({type:"bannirStop"}),
  finTour:() => envoyer({type:"fin"})
};
const M = () => enLigne() && EN.role==="invite" ? MOTEUR_DISTANT : MOTEUR_LOCAL;

  return `<div class="boite" role="dialog" aria-label="Jouer en ligne">
