function actionPorte(act){
  const vues = {"porte-vue-connexion":"connexion", "porte-vue-inscription":"inscription", "porte-vue-oubli":"oubli"};
  if(vues[act]){ PROG.porteVue = vues[act]; PROG.emailNonConfirme = null; render(); return true; }
  actionPorteAsync(act);
  return true;
}
async function actionPorteAsync(act){
  const sb = sbc(), f = PROG.formCompte, email = (f.email || "").trim().toLowerCase();
  const tenter = async fn => {
    if(PROG.occupe) return;
    PROG.occupe = true; renderCouche();
    try { await fn(); } catch(e) { erreur(traduireErreur(e && e.message)); }
    finally { PROG.occupe = false; if(PROG.porte) renderCouche(); }
  };
  const mdpValide = () => {
    if((f.mdp || "").length < 8 || !/[a-z]/i.test(f.mdp) || !/\d/.test(f.mdp)){ erreur("Utilisez au moins 8 caractères, avec des lettres et des chiffres."); return false; }
    if(f.mdp!==f.mdp2){ erreur("Les deux mots de passe ne sont pas identiques."); return false; }
    return true;
  };
  switch(act){
    case "porte-login":
      if(!emailValide(email)) return erreur("Cette adresse e-mail n’est pas valide.");
      if(!f.mdp) return erreur("Indiquez votre mot de passe.");
      return tenter(async () => {
        const { error } = await sb.auth.signInWithPassword({email, password:f.mdp});
        if(error){ if(/not confirmed/i.test(error.message)){ PROG.emailNonConfirme = email; PROG.infoEmail = email; } throw error; }
        PROG.formCompte = {email:"", mdp:"", mdp2:"", pseudo:""}; PROG.emailNonConfirme = null;
        await entrerJeu();
      });
    case "porte-inscrire": {
      const pseudo = (f.pseudo || "").trim().replace(/\s+/g, " ");
      if(!/^[\p{L}\p{N} _-]{3,20}$/u.test(pseudo)) return erreur("Le pseudo doit faire de 3 à 20 caractères : lettres, chiffres, espaces, tirets ou soulignés.");
      if(!emailValide(email)) return erreur("Cette adresse e-mail n’est pas valide.");
      if(!mdpValide()) return;
      return tenter(async () => {
        const { data, error } = await sb.auth.signUp({email, password:f.mdp, options:{emailRedirectTo:urlRetour(), data:{pseudo, mdp:true}}});
        if(error) throw error;
        // Supabase ne signale pas toujours une adresse déjà inscrite : il renvoie alors un compte sans identité
        if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length===0)
          throw new Error("already registered");
        PROG.formCompte = {email:"", mdp:"", mdp2:"", pseudo:""};
        if(data && data.session) return entrerJeu();
        PROG.infoEmail = email; PROG.porteVue = "info";
      });
    }
    case "porte-renvoyer": {
      const adresse = PROG.infoEmail || PROG.emailNonConfirme || email;
      if(!emailValide(adresse || "")) return erreur("Indiquez d’abord votre adresse e-mail.");
      return tenter(async () => {
        const { error } = await sb.auth.resend({type:"signup", email:adresse, options:{emailRedirectTo:urlRetour()}});
        if(error) throw error;
        PROG.infoEmail = adresse; PROG.porteVue = "info"; PROG.emailNonConfirme = null;
        erreur("E-mail de confirmation renvoyé.");
      });
    }
    case "porte-envoyer-oubli":
      if(!emailValide(email)) return erreur("Cette adresse e-mail n’est pas valide.");
      return tenter(async () => {
        const { error } = await sb.auth.resetPasswordForEmail(email, {redirectTo:urlRetour()});
        if(error) throw error;
        PROG.infoEmail = email; PROG.porteVue = "info";
      });
    case "porte-convertir":
      if(!emailValide(email)) return erreur("Cette adresse e-mail n’est pas valide.");
      return tenter(async () => {
        const { error } = await sb.auth.updateUser({email}, {emailRedirectTo:urlRetour()});
        if(error) throw error;
        await chargerUtilisateur();
        if(compteEtat()==="mdp") PROG.porteVue = "mdp";
        else { PROG.infoEmail = email; PROG.porteVue = "attente"; erreur("E-mail envoyé : cliquez sur le lien qu’il contient."); }
      });
    case "porte-definir-mdp":
      if(!mdpValide()) return;
      return tenter(async () => {
        const { error } = await sb.auth.updateUser({password:f.mdp, data:{mdp:true}});
        if(error) throw error;
        PROG.recuperation = false; PROG.formCompte = {email:"", mdp:"", mdp2:"", pseudo:""};
        await chargerUtilisateur();
        await entrerJeu();
      });
  }
}

function preparerTuto(){
  const C = CARTES, dep = Object.keys(REGLES.deckDepart || {}).filter(k => C[k] && C[k].type==="sort");
  const ors = dep.filter(k => valeur(k, "or")>0).sort((a,b) => valeur(a,"or") - valeur(b,"or"));
  const premier = (liste, test) => liste.find(k => C[k] && test(C[k]));
  const tous = Object.keys(C);
  const c = {
    or1: ors[0] || "piece", or2: ors[ors.length-1] || ors[0] || "rubis",
    puiss: premier(dep, d => d.effet && d.effet.combat) || premier(tous, d => d.type==="sort" && d.effet && d.effet.combat && !d.jeton),
    achat: C.garde_anubis ? "garde_anubis" : premier(tous, d => d.faction==="egy" && d.type==="creature" && !d.jeton),
    rapide: C.ulfhednar && (C.ulfhednar.mots || []).includes("rapidite") ? "ulfhednar" : premier(tous, d => d.type==="creature" && (d.mots || []).includes("rapidite") && !d.jeton && (d.vie || 0)>2),
    jeton: C.loup ? "loup" : premier(tous, d => d.jeton && d.type==="creature"),
    combo1: C.scribe && C.scribe.allie ? "scribe" : premier(tous, d => d.faction==="egy" && d.type==="sort" && d.allie),
    combo2: C.pain_nil ? "pain_nil" : premier(tous, d => d.faction==="egy" && d.type==="sort" && !d.allie),
    assaut1: C.sekhmet ? "sekhmet" : premier(tous, d => d.faction==="egy" && d.type==="sort" && d.effet && d.effet.combat),
    assaut2: C.jugement ? "jugement" : premier(tous, d => d.faction==="egy" && d.type==="sort" && d.effet && d.effet.combat>=4),
    defenseur: C.porte_bouclier ? "porte_bouclier" : premier(tous, d => d.faction==="nor" && d.type==="creature" && (d.mots || []).includes("provocation"))
  };
  // Assez d’or pour l’achat
  const prix = (C[c.achat] && C[c.achat].prix) || 3;
  c.nbOr1 = 2; while(c.nbOr1*valeur(c.or1, "or") + valeur(c.or2, "or") < prix && c.nbOr1 < 5) c.nbOr1++;
  // PV de l’adversaire calculés pour que le coup final suffise, avec une petite marge
  const comboP = id => (C[id] && C[id].allie && C[id].allie.combat) || 0;
  const total2 = valeur(c.assaut1, "combat") + comboP(c.assaut1) + valeur(c.assaut2, "combat") + comboP(c.assaut2);
  const p1 = valeur(c.puiss, "combat"), defVie = (C[c.defenseur] && C[c.defenseur].vie) || 3;
  TUTO.pvAdverse = Math.max(p1 + 1, p1 + total2 - defVie - 1);
  TUTO.c = c;
}

/* ============================================================
   MUSIQUE : une musique pour les menus, une liste pour les duels
   Les fichiers sont dans le dossier « musiques » du site (GitHub).
   ============================================================ */
const MUSIQUE = {el:null, contexte:null, piste:null, partieId:null, debloque:false, ecoute:null};
function prefsMusique(){
  try { return Object.assign({actif:true, volume:0.1}, JSON.parse(localStorage.getItem("musique-prefs")) || {}); }
  catch(e) { return {actif:true, volume:0.1}; }
}
function sauverPrefsMusique(p){ try { localStorage.setItem("musique-prefs", JSON.stringify(p)); } catch(e) {} }
const listeDuel = () => ((CONFIG.musiques && CONFIG.musiques.duel) || []).map(x => String(x || "").trim()).filter(Boolean);
const musiqueMenu = () => String((CONFIG.musiques && CONFIG.musiques.menu) || "").trim();
const aDesMusiques = () => !!(musiqueMenu() || listeDuel().length);
const contexteMusique = () => (S && ui.ecran==="jeu") ? "duel" : "menu";
function choisirPiste(ctx){
  if(ctx==="menu") return musiqueMenu() || null;
  const l = listeDuel();
  if(!l.length) return null;
  let p, essais = 0;
  do { p = l[Math.floor(Math.random()*l.length)]; } while(l.length>1 && p===MUSIQUE.piste && essais++ < 10);
  return p;
}
function fondu(a, cible, ms, fin){
  const debut = a.volume, t0 = performance.now();
  const pas = () => {
    const k = Math.min(1, (performance.now()-t0)/ms);
    try { a.volume = Math.max(0, Math.min(1, debut + (cible-debut)*k)); } catch(e) {}
    if(k<1) setTimeout(pas, 30); else if(fin) fin();
  };
  pas();
}
function jouerPiste(src, boucle){
  const ancien = MUSIQUE.el, prefs = prefsMusique();
  if(ancien){ MUSIQUE.el = null; fondu(ancien, 0, 700, () => { ancien.pause(); ancien.removeAttribute("src"); ancien.load(); }); }
  MUSIQUE.piste = src;
  if(!src || !prefs.actif || document.hidden) return;
  const a = new Audio(/^https?:/i.test(src) ? src : encodeURI(src));
  a.loop = boucle; a.volume = 0; a.preload = "auto";
  a.addEventListener("ended", () => { if(MUSIQUE.el===a && !a.loop) jouerPiste(choisirPiste("duel"), false); });
  a.addEventListener("error", () => console.warn("Musique introuvable :", src));
  MUSIQUE.el = a;
  a.play().then(() => fondu(a, prefs.volume, 900)).catch(() => {});
}
function majMusique(){
  if(!MUSIQUE.debloque || !aDesMusiques()) return;
  const ctx = contexteMusique(), pid = ctx==="duel" ? S.idPartie : null;
  if(ctx===MUSIQUE.contexte && pid===MUSIQUE.partieId) return;
  MUSIQUE.contexte = ctx; MUSIQUE.partieId = pid;
  const piste = choisirPiste(ctx);
  // Même musique de menu : on ne la relance pas
  if(ctx==="menu" && MUSIQUE.el && piste===MUSIQUE.piste) return;
  jouerPiste(piste, ctx==="menu");
}
function relancerMusique(){ MUSIQUE.contexte = null; MUSIQUE.partieId = null; MUSIQUE.piste = null; majMusique(); }
// Les navigateurs n’autorisent le son qu’après une première action du joueur
["pointerdown","keydown"].forEach(t => document.addEventListener(t, () => {
  if(MUSIQUE.debloque) return;
  MUSIQUE.debloque = true; majMusique();
}, true));
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ if(MUSIQUE.el) MUSIQUE.el.pause(); }
  else if(MUSIQUE.el) MUSIQUE.el.play().catch(() => {});
  else relancerMusique();
});
// Bouton son et réglage du volume
const SVG_SON = actif => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${actif
  ? '<path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
  : '<path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'}</svg>`;
function htmlSon(avecVolume){
  if(!aDesMusiques()) return "";
  const p = prefsMusique();
  return `<span class="son"><button type="button" class="btn-son" data-act="son" aria-pressed="${p.actif}" aria-label="${p.actif ? "Couper la musique" : "Activer la musique"}" title="${p.actif ? "Couper la musique" : "Activer la musique"}">${SVG_SON(p.actif)}</button>${avecVolume
    ? `<input type="range" min="0" max="1" step="0.05" value="${p.volume}" data-son="volume" aria-label="Volume de la musique" ${p.actif ? "" : "disabled"}>` : ""}</span>`;
}
function basculerSon(){
  const p = prefsMusique(); p.actif = !p.actif; sauverPrefsMusique(p);
  MUSIQUE.debloque = true;
  if(p.actif) relancerMusique(); else jouerPiste(null, false);
}
document.addEventListener("input", e => {
  if(!(e.target.dataset && e.target.dataset.son==="volume")) return;
  const p = prefsMusique(); p.volume = Number(e.target.value); sauverPrefsMusique(p);
  if(MUSIQUE.el) MUSIQUE.el.volume = p.volume;
});

    <div class="adm-actions"><button type="button" class="btn second" data-act="mus-ajouter">Ajouter une musique de duel</button>

async function actionMusiques(act, id){
  const m = CONFIG.musiques || (CONFIG.musiques = {menu:"", duel:[]});
  switch(act){
    case "mus-ajouter": m.duel = [...(m.duel || []), ""]; sauver(); break;
    case "mus-credit-ajouter": { if(!CONFIG.credits) CONFIG.credits = {musiques:[]}; CONFIG.credits.musiques.push({titre:"", artiste:""}); sauver(); break; }
    case "mus-credit-retirer": { CONFIG.credits.musiques.splice(Number(id), 1); sauver(); break; }
    case "mus-retirer": m.duel.splice(Number(id), 1); sauver(); break;
    case "mus-ecouter": {
      if(MUSIQUE.ecoute){ MUSIQUE.ecoute.audio.pause(); const meme = MUSIQUE.ecoute.chemin===id; MUSIQUE.ecoute = null; if(meme) break; }
      if(MUSIQUE.el) MUSIQUE.el.pause();
      const a = new Audio(/^https?:/i.test(id) ? id : encodeURI(id)); a.volume = prefsMusique().volume;
      a.addEventListener("error", () => { erreur(`Fichier introuvable : ${id}`); MUSIQUE.ecoute = null; renderAdmin(); });
      a.addEventListener("ended", () => { MUSIQUE.ecoute = null; renderAdmin(); });
      MUSIQUE.ecoute = {chemin:id, audio:a};
      a.play().catch(() => erreur("Lecture impossible : vérifiez le chemin du fichier."));
      break;
    }
    case "mus-verifier": {
      const chemins = [m.menu, ...(m.duel || [])].map(x => String(x || "").trim()).filter(Boolean);
      adm.verifMusiques = {};
      await Promise.all(chemins.map(async c => {
        try { const r = await fetch(/^https?:/i.test(c) ? c : encodeURI(c), {method:"HEAD", cache:"no-store"}); adm.verifMusiques[c] = r.ok; }
        catch(e) { adm.verifMusiques[c] = false; }
      }));
      const ko = Object.values(adm.verifMusiques).filter(x => !x).length;
      erreur(ko ? `${ko} fichier${ko>1 ? "s" : ""} introuvable${ko>1 ? "s" : ""}.` : "Tous les fichiers sont en ligne.");
      break;
    }
  }
  renderAdmin();
}

/* ============================================================
   ANIMATIONS EN PARTIE (calque au-dessus du plateau)
   Le moteur note les actions dans S.evt ; l’affichage les rejoue ici.
   Rapides (0,3 à 0,6 s), jamais bloquantes, coupées si le joueur
   a réduit les animations dans son système.
   ============================================================ */
let POS_AVANT = {}, FX_VU = {id:null, n:0};
// Toutes les animations du jeu durent deux fois plus longtemps (réglage central)
const FX_LENT = 2;
if(typeof Element!=="undefined" && Element.prototype.animate && !Element.prototype.animate.__lent){
  const animateOrigine = Element.prototype.animate;
  Element.prototype.animate = function(k, o){ const a = animateOrigine.call(this, k, o); try { a.playbackRate = 1/FX_LENT; } catch(e) {} return a; };
  Element.prototype.animate.__lent = true;
}
const fxPossible = () => niveauAnim() > 0;
function calqueFx(){
  let c = document.getElementById("fx");
  if(!c){ c = document.createElement("div"); c.id = "fx"; c.setAttribute("aria-hidden", "true"); document.body.appendChild(c); }
  return c;
}
// Mémorise la position des cartes, créatures et médaillons avant chaque nouvel affichage
function memoriserPositions(){
  POS_AVANT = {};
  if(!S) return;
  document.querySelectorAll("#app [data-uid], #app .crea[data-id], #couche [data-uid]").forEach(el => {
    const r = el.getBoundingClientRect();
    if(r.width) POS_AVANT[el.dataset.uid || el.dataset.id] = {r, html:el.outerHTML};
  });
  document.querySelectorAll("#app .medaillon[data-joueur]").forEach(el => { POS_AVANT["heros-" + el.dataset.joueur] = {r:el.getBoundingClientRect()}; });
  const ma = document.querySelector("#app .main-adverse"); if(ma) POS_AVANT["main-adverse"] = {r:ma.getBoundingClientRect()};
}
const centre = r => ({x:r.left + r.width/2, y:r.top + r.height/2});
const rectDe = sel => { const el = typeof sel==="string" ? document.querySelector(sel) : sel; return el ? el.getBoundingClientRect() : null; };
function voler(el, de, a, duree, delai, extra){
  const c = calqueFx(); c.appendChild(el);
  const ki = extra && extra.milieu
    ? [{transform:`translate(${de.x}px,${de.y}px) scale(${extra.e0 ?? 1})`, opacity:1},
       {transform:`translate(${extra.milieu.x}px,${extra.milieu.y}px) scale(${extra.e1 ?? 1.15})`, opacity:1, offset:.45},
       {transform:`translate(${a.x}px,${a.y}px) scale(${extra.e2 ?? .6})`, opacity:extra.o2 ?? .9}]
    : [{transform:`translate(${de.x}px,${de.y}px) scale(${(extra && extra.e0) ?? 1})`, opacity:1},
       {transform:`translate(${a.x}px,${a.y}px) scale(${(extra && extra.e2) ?? .6}) rotate(${(extra && extra.rot) || 0}deg)`, opacity:(extra && extra.o2) ?? .9}];
  const anim = el.animate(ki, {duration:duree, delay:delai || 0, easing:"cubic-bezier(.3,.7,.35,1)", fill:"both"});
  anim.finished.then(() => el.remove(), () => el.remove());
  return anim;
}
function eclat(point, type, delai){
  const e = document.createElement("span");
  e.className = "fx-eclat " + (type || "impact");
  e.style.left = point.x + "px"; e.style.top = point.y + "px";
  calqueFx().appendChild(e);
  const anim = e.animate([{transform:"translate(-50%,-50%) scale(.2)", opacity:1}, {transform:"translate(-50%,-50%) scale(1.5)", opacity:0}],
    {duration:type==="soin" ? 600 : 380, delay:delai || 0, easing:"ease-out", fill:"both"});
  anim.finished.then(() => e.remove(), () => e.remove());
  if(type==="soin") for(let k=0; k<5; k++){
    const p = document.createElement("span"); p.className = "fx-particule-soin"; p.textContent = "+";
    p.style.left = point.x + "px"; p.style.top = point.y + "px"; calqueFx().appendChild(p);
    const dx = (k-2)*14 + (Math.random()*8-4);
    p.animate([{transform:"translate(-50%,-50%)", opacity:0}, {transform:`translate(calc(-50% + ${dx}px), calc(-50% - 10px))`, opacity:1, offset:.25},
      {transform:`translate(calc(-50% + ${dx}px), calc(-50% - ${46 + k*4}px))`, opacity:0}], {duration:750, delay:(delai || 0) + k*50, easing:"ease-out", fill:"both"})
      .finished.then(() => p.remove(), () => p.remove());
  }
}
function pulser(el){ if(!el) return; el.classList.remove("fx-pulse"); void el.offsetWidth; el.classList.add("fx-pulse"); }
function icoVolante(cle, taille){
  const s = document.createElement("span"); s.className = "fx-objet";
  s.style.width = s.style.height = (taille || 28) + "px";
  s.style.marginLeft = s.style.marginTop = -(taille || 28)/2 + "px";
  s.innerHTML = `<svg viewBox="0 0 24 24">${ICONES[cle]}</svg>`;
  return s;
}
// Origine d’un effet : la carte jouée (avant affichage), sinon le médaillon ou la main adverse
function origine(ev){
  if(ev.src && POS_AVANT[ev.src]) return centre(POS_AVANT[ev.src].r);
  if(ev.src==="heros"){ const r = rectDe(`.medaillon[data-joueur="${ev.j}"]`); if(r) return centre(r); }
  const r = ev.j===vue() ? rectDe(".zone-main .main") : (POS_AVANT["main-adverse"] && POS_AVANT["main-adverse"].r) || rectDe(".main-adverse");
  return r ? centre(r) : {x:innerWidth/2, y:innerHeight/2};
}
function ciblePoint(j, cible, k){
  if(cible==="face"){ const q = k!==undefined ? k : 1-j; const r = rectDe(`.medaillon[data-joueur="${q}"]`) || (POS_AVANT["heros-" + q] || {}).r; return r ? centre(r) : null; }
  const r = rectDe(`.crea[data-id="${cible}"]`) || (POS_AVANT[cible] || {}).r;
  return r ? centre(r) : null;
}
function animerEvenement(ev){
  const moi = ev.j===vue();
  switch(ev.t){
    case "or": case "puissance": {
      const de = origine(ev), n = Math.min(ev.v || 1, 5);
      const jeton = moi ? document.querySelector(`.ressource.${ev.t==="or" ? "or" : "puissance"} .jeton`) : document.querySelector(`.medaillon[data-joueur="${ev.j}"]`);
      const r = jeton && jeton.getBoundingClientRect(); if(!r) return;
      const a = centre(r);
      for(let k=0; k<n; k++){
        const mil = {x:(de.x+a.x)/2 + (k-(n-1)/2)*26, y:Math.min(de.y, a.y) - 50 - Math.random()*30};
        voler(icoVolante(ev.t==="or" ? "or" : "puissance", ev.t==="or" ? 26 : 30), de, a, 560, k*70, {milieu:mil, e0:.6, e1:1.2, e2:.7});
      }
      setTimeout(() => pulser(jeton), (560 + (n-1)*70)*FX_LENT);
      break;
    }
    case "soin": {
      const r = rectDe(`.medaillon[data-joueur="${ev.j}"]`); if(r) eclat(centre(r), "soin");
      break;
    }
    case "achat": {
      const av = POS_AVANT[ev.src]; if(!av) return;
      const pile = document.querySelector(`.pile-defausse[data-joueur="${ev.j}"] .pile-tas`);
      const rp = pile && pile.getBoundingClientRect(); if(!rp) return;
      const clone = document.createElement("div"); clone.className = "fx-carte";
      clone.style.width = av.r.width + "px"; clone.style.marginLeft = -av.r.width/2 + "px"; clone.style.marginTop = -av.r.height/2 + "px";
      clone.innerHTML = av.html;
      voler(clone, centre(av.r), centre(rp), 600, 0, {e0:1, e2:rp.width/av.r.width, o2:1});
      setTimeout(() => pulser(pile.closest(".pile")), (600)*FX_LENT);
      break;
    }
    case "attaque": {
      const att = document.querySelector(`.crea[data-id="${ev.att}"]`), pt = ciblePoint(ev.j, ev.cible, ev.k);
      if(!pt) return;
      const ra = att ? att.getBoundingClientRect() : (POS_AVANT[ev.att] || {}).r; if(!ra) return;
      const c0 = centre(ra), dx = (pt.x - c0.x)*.78, dy = (pt.y - c0.y)*.78;
      if(att){
        // Une copie vole sur le calque d’effets, au premier plan : elle passe toujours au-dessus du défenseur
        const copie = document.createElement("div"); copie.className = "fx-attaquant";
        copie.style.left = ra.left + "px"; copie.style.top = ra.top + "px"; copie.style.width = ra.width + "px"; copie.style.height = ra.height + "px";
        copie.innerHTML = att.outerHTML;
        calqueFx().appendChild(copie);
        ATTAQUANTS_CACHES.add(ev.att); att.style.visibility = "hidden";

const ATTAQUANTS_CACHES = new Set(), PIOCHE_CACHEES = new Set();
function jouerEffets(){
  if(!S) return;
  // Une créature en plein vol reste masquée même si le plateau est réaffiché
  ATTAQUANTS_CACHES.forEach(u => { const el = document.querySelector(`.crea[data-id="${u}"]`); if(el) el.style.visibility = "hidden"; });
  PIOCHE_CACHEES.forEach(u => { const el = document.querySelector(`.zone-main .main .carte[data-uid="${u}"]`); if(el) el.style.visibility = "hidden"; });
  const evts = S.evt || [];
  const dernier = evts.length ? evts[evts.length-1].n : 0;
  if(FX_VU.id!==S.idPartie){ FX_VU = {id:S.idPartie, n:dernier}; PIOCHE_CACHEES.clear(); ATTAQUANTS_CACHES.clear(); return; }
  const nouveaux = evts.filter(e => e.n > FX_VU.n);
  FX_VU.n = Math.max(FX_VU.n, dernier);
  const niveau = niveauAnim();
  if(!niveau || !nouveaux.length) return;
  // Si des cartes partent à la défausse dans le même temps, la pioche attend qu’elles soient arrivées
  const defausse = nouveaux.find(e => e.t==="defausse");
  delaiPioche = defausse && niveau>=2 ? 460 + (defausse.uids || []).length*45 + 120 : 0;
  nouveaux.forEach(ev => {
    try {
      if(animerEvenement2(ev, niveau)) return;
      // Or, puissance, achat : les objets ne volent qu’en mode complet
      if(niveau<2 && ["or","puissance","achat"].includes(ev.t)){ if(ev.t!=="achat" && ev.j===vue()) pulser(document.querySelector(`.ressource.${ev.t==="or" ? "or" : "puissance"} .jeton`)); return; }
      animerEvenement(ev);
    } catch(e) {}
  });
}

const NIVEAUX_ANIM = {completes:2, reduites:1, aucune:0};
function reglageAnimations(){
  let v = null; try { v = localStorage.getItem("animations"); } catch(e) {}
  if(!NIVEAUX_ANIM.hasOwnProperty(v)) v = (typeof matchMedia==="function" && matchMedia("(prefers-reduced-motion: reduce)").matches) ? "reduites" : "completes";
  return v;
}
// 2 : tout ; 1 : éclats et chiffres, rien ne vole ; 0 : aucune animation
function niveauAnim(){
  if(typeof Element==="undefined" || !Element.prototype.animate) return 0;
  return NIVEAUX_ANIM[reglageAnimations()];
}
function appliquerReglageAnimations(){ document.body.classList.toggle("sans-animations", niveauAnim()===0); }
function htmlReglageAnimations(libelle = true){
  const v = reglageAnimations();
  return `<label class="reglage-anim">${libelle ? "Animations " : ""}<select data-reglage="animations" aria-label="Niveau des animations">
    ${[["completes","Complètes"],["reduites","Réduites"],["aucune","Aucune"]].map(([k,l]) => `<option value="${k}" ${v===k ? "selected" : ""}>${l}</option>`).join("")}</select></label>`;
}
document.addEventListener("change", e => {
  if(!(e.target.dataset && e.target.dataset.reglage==="animations")) return;
  try { localStorage.setItem("animations", e.target.value); } catch(err) {}
  appliquerReglageAnimations();
});

function idCarteDe(el){
  const uid = el.dataset.uid || (el.classList.contains("crea") ? el.dataset.id : null);
  if(uid==="base") return REGLES.carteBase;
  if(uid && S){
    const zones = [S.marche, ...S.joueurs.flatMap(j => [j.main, j.plateau, j.joues, j.defausse, j.bannies])];
    for(const z of zones){ const c = (z || []).find(x => x && x.uid===uid); if(c) return c.id; }

  const nom = el.querySelector(".nom-bande"); if(nom){ const id = Object.keys(CARTES).find(k => CARTES[k].nom===nom.textContent.trim()); if(id) return id; }

}

/* ===== Mobile en paysage : tout le plateau tient dans la zone visible ===== */
const REF_H = 390, REF_W_MIN = 760;
function majCompact(){
  const vv = window.visualViewport;
  const w = vv ? vv.width : innerWidth, h = vv ? vv.height : innerHeight;
  const tactile = typeof matchMedia==="function" && matchMedia("(pointer: coarse)").matches;
  const compact = w > h && (h <= 600 || (tactile && h < 900));
  document.body.classList.toggle("compact", compact);
  const app = document.getElementById("app");
  if(!app) return;
  if(compact && document.body.classList.contains("en-partie")){
    // Échelle : la surface de référence (390 px de haut, au moins 760 de large) remplit exactement l’écran
    const s = Math.min(h / REF_H, w / REF_W_MIN);
    const lv = w / s, hv = h / s;
    app.style.position = "fixed";
    app.style.left = (vv ? vv.offsetLeft : 0) + "px";
    app.style.top = (vv ? vv.offsetTop : 0) + "px";
    app.style.width = lv + "px";
    app.style.height = hv + "px";
    app.style.transformOrigin = "0 0";
    app.style.transform = `scale(${s})`;
    document.body.style.setProperty("--h-jeu", hv + "px");
    window.scrollTo(0, 0);
  } else if(app.style.transform){
    ["position","left","top","width","height","transformOrigin","transform"].forEach(k => app.style[k] = "");
    document.body.style.removeProperty("--h-jeu");
  }
}
addEventListener("resize", () => { majCompact(); if(S) ajusterEventail(); });
addEventListener("orientationchange", () => setTimeout(() => { majCompact(); if(S) ajusterEventail(); }, 250));
if(window.visualViewport) visualViewport.addEventListener("resize", () => { majCompact(); if(S) ajusterEventail(); });

// Ciblage en 2 contre 2 : la Provocation protège toute l’équipe visée ; sinon les créatures visibles du joueur visé
function cibles2v2(i, k){
  const e = S.joueurs[k];
  if(!e || e.esprit || e.eq===S.joueurs[i].eq) return {face:false, creatures:new Set()};
  const vis = x => x.plateau.filter(c => !(aMot(c, "ethere") && !c.revele));

  if(prov.length) return {face:false, creatures:new Set(prov.map(c => c.uid))};

function utiliserCombat2v2(cible, k){

function verifierVictoire2v2(){

    if(j.esprit || j.pv>0) return;
    j.esprit = true; j.tEsprit = 0; j.pv = 0;
    for(const c of j.plateau){ if(!def(c).jeton) j.defausse.push({uid:c.uid, id:c.id}); if(c.arme) j.defausse.push({uid:c.arme.uid, id:c.arme.id}); }
    j.plateau = [];
    log(`${heroDe(j).nom} tombe et devient un esprit.`);
    fxEvt({t:"chute", j:k});
    const a = S.joueurs[allieDe(k)];
    if(!a.esprit && R2.vengeance){ a.pv += R2.vengeance; log(`Vengeance : ${heroDe(a).nom} récupère ${R2.vengeance} PV.`); fxEvt({t:"soin", j:allieDe(k), v:R2.vengeance}); }
  });

  for(const eq of [0, 1]){
    if(S.joueurs.filter(j => j.eq===eq).every(j => j.esprit)){ S.vainqueur = NOMS_EQUIPES[1 - eq]; S.equipeGagnante = 1 - eq; fxEvt({t:"fin", perdant:eq}); return; }

  }
  let garde2 = 40;
  while(S.vainqueur===null && garde2-->0){
    const o = S.marche.map((c, k) => ({k, d:def(c)})).filter(x => x.d.prix<=j.or)
      .sort((a, b) => (b.d.prix + (b.d.faction===j.heros ? 1.5 : 0)) - (a.d.prix + (a.d.faction===j.heros ? 1.5 : 0)));
    const base = CARTES[REGLES.carteBase];
    if(o.length) acheter(o[0].k); else if(base && (base.prix || 0)>0 && j.or>=base.prix) acheter("base"); else break;
    await etape();
  }
  if(!j.esprit){
    for(const c of [...j.plateau]){
      if(S.vainqueur!==null) break;
      if(!j.plateau.includes(c) || !c.peutAttaquer || c.aAttaque) continue;
      const k = choisirCibleIA(i); if(k===null) break;
      const t = cibles2v2(i, k);
      if(t.face){ attaquer2v2(c.uid, "face", k); await etape(); continue; }
      const cand = S.joueurs.flatMap(x => x.plateau).filter(v => t.creatures.has(v.uid));
      const tues = cand.filter(v => !v.bouclier && vieRestante(v)<=atkTotal(c)).sort((a, b) => atkTotal(b) - atkTotal(a));
      const ch = tues[0] || cand.sort((a, b) => vieRestante(a) - vieRestante(b))[0];
      if(ch){ attaquer2v2(c.uid, ch.uid, k); await etape(); }
    }
    let g = 40;
    while(j.combat>0 && S.vainqueur===null && g-->0 && !j.esprit){
      const ordre = ennemisDe(i).filter(k => !S.joueurs[k].esprit)
        .sort((a, b) => S.iaCiblage[j.eq]==="equilibre" ? S.joueurs[b].pv - S.joueurs[a].pv : S.joueurs[a].pv - S.joueurs[b].pv);
      let fait = false;
      for(const k of ordre){
        const t = cibles2v2(i, k);
        if(t.face){ utiliserCombat2v2("face", k); fait = true; await etape(); break; }
        const cand = S.joueurs.flatMap(x => x.plateau).filter(v => t.creatures.has(v.uid) && atkTotal(v) < j.pv).sort((a, b) => vieRestante(a) - vieRestante(b));
        if(cand.length){ utiliserCombat2v2(cand[0].uid, k); fait = true; await etape(); break; }
      }
      if(!fait) break;
    }
  }
  if(S.vainqueur===null) finTour2v2();
}

// Remplit les places libres : panthéon principal d’abord, puis créatures, puis cartes chères
function completerDeck(){
  const e = PROG.deckEdit, t = REGLES.tailleDeck, n = {};
  e.cartes.forEach(id => { const f = CARTES[id] && CARTES[id].faction; if(f) n[f] = (n[f] || 0) + 1; });
  const fav = Object.keys(n).sort((a, b) => n[b] - n[a])[0];
  const cand = Object.keys(PROG.collection).filter(id => estCollectionnable(CARTES[id]))
    .sort((a, b) => ((CARTES[b].faction===fav) - (CARTES[a].faction===fav)) || ((CARTES[b].type==="creature") - (CARTES[a].type==="creature")) || ((CARTES[b].prix || 0) - (CARTES[a].prix || 0)));
  let ajoutees = 0, encore = true;
  while(e.cartes.length < t && encore){
    encore = false;
    for(const id of cand){
      if(e.cartes.length >= t) break;
      if(resteDispo(id, compter(e.cartes))>0){ e.cartes.push(id); ajoutees++; encore = true; }
    }
  }
  erreur(ajoutees ? `${ajoutees} carte${ajoutees>1 ? "s" : ""} ajoutée${ajoutees>1 ? "s" : ""}.` : "Aucune carte disponible pour compléter le deck.");
}

// Atelier : la divinité que le deck obtiendra (panthéon majoritaire et palier de Dévotion)

function htmlHerosDeck(cartes){
  const n = {};

      <span class="pouvoir-heros-deck"><b>${esc(pv.nom || "Pouvoir")}</b> : ${esc(decrire(pv.effet || {}))}</span>
    </div>

      <span class="barre-devotion"><span style="width:${Math.min(100, 100*n[f]/s2)}%"></span><i style="left:${100*s1/s2}%"></i></span>
      <span class="aide">${n[f]} / ${s2} cartes ${esc(FACTIONS[f].f)}s. ${hs ? `Encore ${manque} pour ${esc(hs.nom || "la divinité suivante")}${p===0 ? ` et ${REGLES.devotionNbTresors ?? 2} cartes de départ à ses couleurs` : " et une créature de départ du panthéon"}.` : "Divinité primordiale atteinte."}</span>

/* ============================================================
   QUÊTES DU JOUR ET TROPHÉES À 4 RANGS (récompenses vérifiées par le serveur)
   ============================================================ */
const NOM_PAQUET = t => t==="classique" ? "Paquet classique" : FACTIONS[t] ? `Paquet ${FACTIONS[t].m}` : "Paquet";
const texteRecompense = r => !r ? "" : r.or ? `${r.or} or` : (r.paquets || []).map(NOM_PAQUET).join(" + ");
function infoTrophee(t){
  // Données du serveur si disponibles, sinon calcul local (prototype)
  const srv = PROG.trophees && PROG.trophees.find(x => x.id===t.id);
  if(srv) return {valeurs:srv.valeurs || [srv.valeur, srv.valeur, srv.valeur, srv.valeur], paliers:srv.paliers, reclames:srv.reclames || [], recompenses:srv.recompenses || []};
  const v = (PROG.mesStats && t.val(PROG.mesStats)) || 0;
  return {valeurs:[v, v, v, v], paliers:t.paliers, reclames:[], recompenses:[]};
}
const rangsAtteints = t => { const i = infoTrophee(t); return i.paliers.filter((p, k) => (i.valeurs[k] || 0) >= p).length; };
function recompensesEnAttente(){
  if(!PROG.trophees) return 0;
  return TROPHEES.reduce((n, t) => { const i = infoTrophee(t); return n + i.paliers.filter((p, k) => (i.valeurs[k] || 0) >= p && !i.reclames.includes(k + 1)).length; }, 0);
}

  if(!ids.length) return "";
  return `<h2 class="titre-section-col">Cartes de départ</h2>
    <p class="aide">Chaque joueur commence ses parties avec ces cartes. Avec la Dévotion, certaines prennent la couleur de votre panthéon : ouvrez-les pour voir leurs versions.</p>
    <div class="grille grille-depart">${ids.map(id => {
      const n = (REGLES.deckDepart || {})[id], v = versionsDe(id).length;
      return `<div class="col-item">${htmlCarte({id, uid:"dep-" + id}, {act:"col-sel", id})}<span class="badge-nb">${id===REGLES.carteBase ? "Marché" : "×" + n}</span>${v ? `<span class="badge-versions">${v} versions</span>` : ""}</div>`;
    }).join("")}</div>
    <h2 class="titre-section-col">Cartes à collectionner</h2>`;
}
function htmlVersionsDepart(id){
  const vs = versionsDe(id);
  if(!vs.length) return "";
  const vue = PROG.zoomVersion || null, [s1, s2] = seuilsDevotion();
  const regle = id===(REGLES.devotionTresor || "piece")
    ? `Avec ${s1} cartes d’un même panthéon ou plus dans votre deck, ${REGLES.devotionNbTresors ?? 2} de vos ${esc(CARTES[id].nom)}s prennent cette version.`
    : `Avec ${s2} cartes d’un même panthéon dans votre deck, votre ${esc(CARTES[id].nom)} prend cette version.`;
  const vignette = (k, titre) => `<div role="button" tabindex="0" class="vignette-choix ${vue===k ? "vue" : ""}" data-act="col-version-voir" data-id="${k || ""}" title="${esc(titre)}" aria-label="${esc(titre)}">${htmlCarte({id:k || id, uid:"vv-" + (k || "o")})}</div>`;
  return `<div class="choix-illustrations"><h3>Versions de Dévotion</h3>
    <div class="rangee-vignettes">${vignette(null, "Version de base")}${vs.map(k => vignette(k, `Version ${FACTIONS[CARTES[k].faction] ? FACTIONS[CARTES[k].faction].f : ""}`)).join("")}</div>
    <p class="aide">${vue ? `${esc(CARTES[vue].nom)}, version ${esc(FACTIONS[CARTES[vue].faction] ? FACTIONS[CARTES[vue].faction].f : "")}. ${regle}` : "Version de base, utilisée sans Dévotion. " + regle}</p></div>`;
}

chargerConfig();
appliquerReglageAnimations();
render();
chargerFichierConfig().then(chargerProgression);
</script>
</body>
